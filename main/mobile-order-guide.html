<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>モバイルオーダー休止のお知らせ | 南陵祭2026</title>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('app-theme');
          if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
          else if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
        } catch (e) {}
      })();
    </script>
    <style>
      html { background-color: #f0f2f5; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) { background-color: #0f172a; }
      }
      html[data-theme="dark"] { background-color: #0f172a; }
      html[data-theme="light"] { background-color: #f0f2f5; }
      :root {
        --bg-color: #f0f2f5;
        --card-bg: #ffffff;
        --text-main: #1e293b;
        --text-sub: #64748b;
        --border-color: #e2e8f0;
      }
      [data-theme="dark"] {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-main: #f8fafc;
        --text-sub: #94a3b8;
        --border-color: #334155;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg-color: #0f172a;
          --card-bg: #1e293b;
          --text-main: #f8fafc;
          --text-sub: #94a3b8;
          --border-color: #334155;
        }
      }
      body {
        margin: 0;
        padding: 20px;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        box-sizing: border-box;
      }
      .notice-card {
        max-width: 480px;
        width: 100%;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 20px;
        padding: 36px 24px;
        text-align: center;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      }
      .icon-box {
        width: 68px;
        height: 68px;
        border-radius: 50%;
        background: rgba(245, 158, 11, 0.12);
        color: #f59e0b;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        margin-bottom: 20px;
      }
      .notice-title {
        font-size: 1.25rem;
        font-weight: 700;
        margin-bottom: 12px;
        letter-spacing: -0.01em;
      }
      .notice-desc {
        font-size: 0.95rem;
        line-height: 1.65;
        color: var(--text-sub);
        margin-bottom: 28px;
      }
      .btn-home {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 12px 20px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 0.95rem;
        background-color: #2563eb;
        color: #ffffff;
        text-decoration: none;
        transition: background-color 0.15s ease, transform 0.1s ease;
      }
      .btn-home:hover {
        background-color: #1d4ed8;
        color: #ffffff;
      }
      .btn-home:active {
        transform: scale(0.98);
      }
    </style>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  </head>
  <body>
    <div class="notice-card">
      <div class="icon-box">
        <i class="bi bi-info-circle-fill"></i>
      </div>
      <h1 class="notice-title">モバイルオーダー休止のお知らせ</h1>
      <p class="notice-desc">
        今年度のモバイルオーダー先行運用は見送りとなりました。<br />
        恐れ入りますが、各模擬店の店頭にて直接ご注文・ご購入をお願いいたします。
      </p>
      <a href="index.html" class="btn-home">
        <i class="bi bi-house-door-fill"></i> トップページへ戻る
      </a>
    </div>
  </body>
</html>

<!doctype html>
<html lang="ja">
  <head>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('app-theme');
          if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
          else if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
        } catch (e) {}
      })();
    </script>
    <!-- Prevent Dark Mode Flicker (FOUC) -->
    <style>
      html { background-color: #f0f2f5; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) { background-color: #0f172a; }
      }
      html[data-theme="dark"] { background-color: #0f172a; }
      html[data-theme="light"] { background-color: #f0f2f5; }
    </style>
    <script>
      (function() {
        const savedTheme = localStorage.getItem("app-theme") || "auto";
        if (savedTheme === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        } else if (savedTheme === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>企画一覧 | 南陵祭'26</title>
    <!-- Core Style (Shell) -->
    <link rel="stylesheet" href="style.css" />
    <style>
      .page-header {
        padding: 16px 16px 6px;
        text-align: center;
      }

      .page-title {
        font-size: 1.4rem;
        font-weight: 900;
        margin: 0;
        background: var(--primary-gradient);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: fadeInDown 0.8s ease-out;
      }

      /* Filter Section (Compact & Sleek) */
      .filter-section {
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        padding: 10px 14px;
        margin: 0 12px 10px;
        max-width: 900px;
        margin-left: auto;
        margin-right: auto;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        animation: fadeInUp 0.8s ease-out 0.2s backwards;
      }

      .search-box-wrapper {
        width: 100%;
        max-width: 600px;
        margin: 0 auto 8px;
      }

      .search-input {
        width: 100%;
        padding: 6px 14px;
        font-size: 0.85rem;
        color: var(--text-main);
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 50px;
        transition: all 0.3s ease;
        font-family: inherit;
      }

      .search-input:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 2px rgba(var(--primary-rgb), 0.2);
      }

      .filter-group {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-bottom: 5px;
        flex-wrap: wrap;
      }

      .filter-group:last-child {
        margin-bottom: 0;
      }

      .filter-label {
        color: var(--text-sub);
        font-weight: 700;
        font-size: 0.78rem;
        min-width: 36px;
        text-align: right;
      }

      .filter-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        justify-content: center;
      }

      .filter-btn {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        color: var(--text-sub);
        padding: 4px 12px;
        border-radius: 50px;
        cursor: pointer;
        font-size: 0.78rem;
        font-weight: 600;
        transition: all 0.2s ease;
      }

      .filter-btn:hover {
        border-color: var(--primary-color);
        color: var(--primary-color);
      }

      .filter-btn.active {
        background: var(--primary-gradient);
        color: white;
        border-color: transparent;
        box-shadow: 0 2px 6px rgba(var(--primary-rgb), 0.3);
      }

      /* Control Row */
      .control-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 900px;
        margin: 0 auto 8px;
        padding: 0 14px;
        flex-wrap: wrap;
        gap: 8px;
      }

      .sort-wrapper {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .card-button-wrapper .btn-favorite-star {
        margin-right: auto;
      }
      @media (max-width: 600px) {
        .card-button-wrapper .btn-favorite-star {
          margin-right: 0;
        }
      }

      .sort-select {
        padding: 5px 10px;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        background: var(--card-bg);
        color: var(--text-main);
        font-weight: 600;
        font-size: 0.8rem;
        cursor: pointer;
      }

      .toggle-btn {
        background: transparent;
        border: none;
        padding: 5px 8px;
        border-radius: 6px;
        color: var(--text-sub);
        cursor: pointer;
        font-size: 0.95rem;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .toggle-btn.active {
        background: var(--primary-gradient);
        color: white;
      }

      /* Projects Grid / List Containers */
      .projects-grid-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 12px;
        max-width: 1200px;
        margin: 0 auto 80px;
        padding: 0 14px;
      }

      /* List View Layout */
      .projects-grid-container.list-view {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-width: 900px;
        margin: 0 auto 80px;
      }

      /* Base Project Card */
      .project-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        overflow: hidden;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
        display: flex;
        flex-direction: column;
        text-decoration: none;
        color: var(--text-main);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        will-change: transform;
      }

      .project-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
        border-color: rgba(var(--primary-rgb), 0.3);
      }

      .card-image {
        height: 120px;
        overflow: hidden;
        position: relative;
      }

      .card-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.4s ease;
      }

      .project-card:hover .card-image img {
        transform: scale(1.05);
      }

      .card-content {
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        flex-grow: 1;
      }

      /* Harmonized High Density List View */
      .list-view .project-card {
        flex-direction: row;
        align-items: center;
        padding: 8px 12px;
        border-radius: 12px;
        min-height: 64px;
        gap: 10px;
      }

      .list-view .card-image {
        width: 52px;
        height: 52px;
        border-radius: 8px;
        flex-shrink: 0;
      }

      .list-view .card-content {
        padding: 0;
        gap: 2px;
        justify-content: center;
        flex: 1;
        min-width: 0;
      }

      .card-group-name {
        color: var(--primary-color);
        font-size: 0.75rem;
        font-weight: 700;
        margin-bottom: 0;
        display: block;
        line-height: 1.1;
      }

      [data-theme="dark"] .card-group-name {
        color: #a5b4fc;
      }

      .card-project-title {
        font-size: 0.95rem;
        font-weight: 700;
        margin: 0 0 2px;
        color: var(--text-main);
        line-height: 1.2;
        text-decoration: none;
        transition: color 0.2s ease;
      }
      
      a.card-project-title:hover {
        color: var(--primary-color);
      }

      .list-view .card-project-title {
        font-size: 0.92rem;
        margin: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: block;
      }

      /* Place info */
      .card-place {
        display: flex;
        align-items: center;
        gap: 3px;
        font-size: 0.75rem;
        color: var(--text-sub);
        margin-top: auto;
        padding-top: 4px;
        line-height: 1.1;
      }

      .list-view .card-place {
        margin-top: 2px;
        padding-top: 0;
        font-size: 0.72rem;
      }

      .card-place i {
        color: var(--text-placeholder);
      }

      .card-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 3px;
        margin-top: 4px;
      }

      .list-view .card-tags {
        margin-top: 2px;
      }

      .card-tag {
        font-size: 0.68rem;
        padding: 2px 6px;
        border-radius: 4px;
        background: var(--item-fill);
        color: var(--text-sub);
        font-weight: 600;
      }

      .card-tag.highlight-tag {
        background: rgba(var(--primary-rgb), 0.1);
        color: var(--primary-color);
      }

      .card-catchphrase {
        font-size: 0.78rem;
        line-height: 1.4;
        margin-top: 4px;
        color: var(--text-sub);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .list-view .card-catchphrase {
        display: none; /* Hide catchphrase in list view for compactness */
      }

      .card-button-wrapper {
        margin-top: 0;
        padding: 0 8px 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        justify-content: flex-end;
      }

      .list-view .card-button-wrapper {
        padding: 0;
        margin-left: auto;
        flex-direction: row !important;
        flex-wrap: nowrap !important;
        align-items: center !important;
        justify-content: flex-end;
        gap: 6px !important;
        flex-shrink: 0;
      }

      .btn-favorite-star {
        width: 28px;
        height: 28px;
        background: transparent;
        border: none;
        color: var(--text-placeholder);
        font-size: 0.95rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s, color 0.2s;
        padding: 0;
      }

      .btn-favorite-star.active {
        color: #f59e0b;
      }

      .btn-action {
        padding: 5px 12px;
        border-radius: 50px;
        font-size: 0.78rem;
        font-weight: 700;
        text-decoration: none;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
      }

      .btn-details {
        background: var(--item-fill);
        color: var(--text-main);
        border: 1px solid var(--border-color);
      }

      .btn-details:hover {
        background: var(--border-color);
      }

      .btn-order {
        background: linear-gradient(135deg, #ff0080 0%, #ff5e62 100%);
        color: white;
        border: none;
        box-shadow: 0 2px 6px rgba(255, 0, 128, 0.2);
      }

      .btn-order:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 10px rgba(255, 0, 128, 0.3);
      }

      /* Mobile adjustments — 縦積み廃止・高密度横並び維持 */
      @media (max-width: 480px) {
        .page-header {
          padding: 12px 10px 4px;
        }
        .page-title {
          font-size: 1.25rem;
        }
        .filter-section {
          padding: 8px 10px;
          margin: 0 6px 8px;
        }
        .projects-grid-container {
          padding: 0 6px 80px;
          grid-template-columns: repeat(2, 1fr);
          gap: 6px;
        }
        .projects-grid-container.list-view {
          grid-template-columns: 1fr;
          gap: 5px;
        }
        .list-view .card-image {
          width: 42px;
          height: 42px;
        }
        .list-view .project-card {
          padding: 5px 8px;
          min-height: 52px;
          gap: 6px;
        }
        .list-view .card-project-title {
          font-size: 0.78rem;
        }
        .list-view .card-button-wrapper {
          flex-direction: row !important;
          align-items: center !important;
          width: auto !important;
          gap: 3px !important;
        }
        .list-view .card-button-wrapper .btn-action {
          padding: 3px 7px;
          font-size: 0.68rem;
        }
      }

      /* Animations */
      @keyframes fadeInDown {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes fadeInUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .no-results {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-sub);
        grid-column: 1 / -1;
        display: none;
        font-weight: bold;
      }
      /* Skeleton Loading */
      @keyframes shimmer {
        0% {
          background-position: -200% 0;
        }
        100% {
          background-position: 200% 0;
        }
      }

      .skeleton {
        background: linear-gradient(
          90deg,
          var(--border-color) 25%,
          rgba(255, 255, 255, 0.2) 37%,
          var(--border-color) 63%
        );
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
        border-radius: 8px;
        color: transparent !important;
        user-select: none;
      }

      [data-theme="dark"] .skeleton {
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.05) 25%,
          rgba(255, 255, 255, 0.1) 37%,
          rgba(255, 255, 255, 0.05) 63%
        );
      }

      .project-card.is-loading {
        pointer-events: none;
        box-shadow: none;
        border-color: transparent;
      }

      .project-card.is-loading .card-image {
        background: var(--card-bg); /* Fallback */
      }

      /* Floating Vote Button (FAB) (Bug 8) */
      .floating-vote-btn {
        position: fixed;
        bottom: calc(max(20px, env(safe-area-inset-bottom, 20px)) + 70px + 16px);
        right: 20px;
        z-index: 999;
        background: linear-gradient(135deg, #6a11cb, #2575fc);
        color: white !important;
        border-radius: 50px;
        padding: 10px 18px;
        font-weight: 800;
        font-size: 0.9rem;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 6px;
        box-shadow: 0 4px 15px rgba(106, 17, 203, 0.4);
        transition: transform 0.2s, box-shadow 0.2s;
      }
      .floating-vote-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(106, 17, 203, 0.6);
      }
      .floating-vote-btn:active {
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="page-header">
        <h1 class="page-title">企画・展示一覧</h1>
      </div>


      <!-- Filter Section -->
      <div class="filter-section">
        <div class="search-box-wrapper">
          <input
            type="search"
            id="search-input"
            class="search-input"
            placeholder="企画名・団体名で検索..."
          />
        </div>

        <div class="filter-group">
          <span class="filter-label">団体</span>
          <div id="filter-by-grade" class="filter-buttons">
            <button class="filter-btn active" data-filter="すべて" data-track="click_filter_grade" data-track-grade="すべて">
              すべて
            </button>
            <button class="filter-btn" data-filter="1年生" data-track="click_filter_grade" data-track-grade="1年生">1年生</button>
            <button class="filter-btn" data-filter="2年生" data-track="click_filter_grade" data-track-grade="2年生">2年生</button>
            <button class="filter-btn" data-filter="3年生" data-track="click_filter_grade" data-track-grade="3年生">3年生</button>
            <button class="filter-btn" data-filter="部活動" data-track="click_filter_grade" data-track-grade="部活動">部活動</button>
          </div>
        </div>

        <div class="filter-group">
          <span class="filter-label">ジャンル</span>
          <div id="filter-by-type" class="filter-buttons">
            <button class="filter-btn active" data-filter="すべて" data-track="click_filter_type" data-track-type="すべて">
              すべて
            </button>
            <button class="filter-btn" data-filter="food" data-track="click_filter_type" data-track-type="food">🍱 飲食</button>
            <button class="filter-btn" data-filter="shop" data-track="click_filter_type" data-track-type="shop">🛍️ 物販</button>
            <button class="filter-btn" data-filter="exhibit" data-track="click_filter_type" data-track-type="exhibit">🎨 展示・体験</button>
          </div>
        </div>
      </div>

      <!-- Control Row -->
      <div class="control-row">
        <!-- お気に入りトグルを追加 -->
        <label class="toggle-switch-label" style="margin-right: auto; gap: 8px;">
          <div class="toggle-switch">
            <input type="checkbox" id="show-favorites-toggle" />
            <span class="slider"></span>
          </div>
          <span style="font-size: 0.85rem; font-weight: bold; color: var(--text-main);"><i class="bi bi-star-fill text-warning"></i> お気に入りのみ</span>
        </label>

        <div class="sort-wrapper">
          <span
            style="font-size: 0.9rem; font-weight: 700; color: var(--text-sub)"
            >並び替え:</span
          >
          <select id="sort-select" class="sort-select">
            <option value="id-asc">クラス・団体順</option>
            <option value="name-asc">五十音順 (昇順)</option>
            <option value="floor-asc">場所・階数順</option>
          </select>
        </div>

        <div class="view-toggle-wrapper">
          <button
            class="view-toggle-btn"
            id="grid-view-btn"
            aria-label="Grid View"
          >
            <i class="bi bi-grid-fill"></i>
          </button>
          <button
            class="view-toggle-btn active"
            id="list-view-btn"
            aria-label="List View"
          >
            <i class="bi bi-list-ul"></i>
          </button>
        </div>
      </div>

      <div class="projects-grid-container list-view" id="projects-grid">
        <!-- JS will inject cards here -->
      </div>

      <div id="no-results-message" class="no-results">
        該当する企画はありません
      </div>
    </main>

    <!-- Load External Data -->
    <script src="data/data.js"></script>
    <script type="module" src="app-shell.js"></script>

    <script type="module">
      import { db, getFavorites, toggleFavorite, getCurrentUser, watchUser, analytics, logEvent } from "./auth.js";
      import { collection, getDocs } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

      window.CURRENT_PAGE = "projects";

      document.addEventListener("DOMContentLoaded", async () => {
        const gridContainer = document.getElementById("projects-grid");
        const noResultsMessage = document.getElementById("no-results-message");
        const searchInput = document.getElementById("search-input");
        const showFavoritesToggle = document.getElementById("show-favorites-toggle");

        if (!gridContainer) return;

        let activeFilters = {
          grade: "すべて",
          category: "すべて",
          search: "",
          sort: "id-asc",
          favoritesOnly: false,
        };
        
        let storeStatuses = {}; // 店舗の営業ステータスマップ
        let userFavorites = []; // ユーザーのお気に入りIDリスト
        let isAuthResolved = false;
        let isStoresLoaded = false;

        // auth 状態の監視
        watchUser(async (user) => {
          if (user) {
            userFavorites = await getFavorites();
          } else {
            userFavorites = [];
            if (activeFilters.favoritesOnly) {
              activeFilters.favoritesOnly = false;
              if (showFavoritesToggle) showFavoritesToggle.checked = false;
            }
          }
          isAuthResolved = true;
          if (isStoresLoaded) {
            applyFiltersAndSort(false);
          }
        });

        // Skeleton Generation
        function renderSkeletons(count = 9) {
          let html = "";
          for (let i = 0; i < count; i++) {
            html += `
                    <div class="project-card is-loading">
                        <div class="card-image skeleton" style="height: ${gridContainer.classList.contains("list-view") ? "80px" : "130px"}"></div>
                        <div class="card-content">
                            <span class="card-group-name skeleton" style="width: 50%; height: 1em; margin-bottom: 4px;"></span>
                            <div class="card-project-title skeleton" style="width: 80%; height: 1.2em; margin-bottom: 8px;"></div>
                            <p class="card-catchphrase skeleton" style="width: 100%; height: 1em; margin-bottom: 4px;"></p>
                            <div class="card-place skeleton" style="width: 40%; height: 1em; margin-top: auto;"></div>
                        </div>
                    </div>
                    `;
          }
          gridContainer.innerHTML = html;
        }

        function renderCards(projects) {
          if (projects.length === 0) {
            gridContainer.innerHTML = "";
            noResultsMessage.style.display = "block";
            return;
          }

          noResultsMessage.style.display = "none";

          const cardsHTML = projects
            .map((project, index) => {
              const groupName =
                project.groupName || project.groupId || "参加団体";
              const imgSrc = `../images/${project.id}.png`;
              const catchphrase =
                project.catchphrase || project.description || "";
              const place = project.place || "会場未定";
              const tags = (project.tags || []).filter((tag) =>
                ["食品", "展示", "ゲーム", "アトラクション", "体験"].includes(
                  tag,
                ),
              );

              const tagsHTML = tags
                .map((tag) => `<span class="card-tag">${tag}</span>`)
                .join("");

              const useMobileOrder = project.useMobileOrder === true;
                
              let statusBadge = "";
              let isOrderable = useMobileOrder;
              const storeData = storeStatuses[project.id];
              
              if (useMobileOrder) {
                if (storeData) {
                  const op = storeData.op;
                  const available = storeData.available;
                  const total = storeData.total;
                  
                  let text = "準備中";
                  let color = "#d97706";
                  let bg = "#fef3c7";
                  
                  if (op === "open") {
                    if (available !== undefined && total !== undefined) {
                      if (available === 0 && total > 0) {
                        text = "現在売切";
                        color = "#dc2626";
                        bg = "#fee2e2";
                        isOrderable = false;
                      } else if (available > 0 && available < total) {
                        text = "一部売切";
                        color = "#d97706";
                        bg = "#fef3c7";
                        isOrderable = true;
                      } else {
                        text = "営業中";
                        color = "#10b981";
                        bg = "#d1fae5";
                        isOrderable = true;
                      }
                    } else {
                      text = "営業中";
                      color = "#10b981";
                      bg = "#d1fae5";
                      isOrderable = true;
                    }
                  } else if (op === "closed") {
                    text = "本日の営業終了";
                    color = "#6b7280";
                    bg = "#f3f4f6";
                    isOrderable = false;
                  } else {
                    isOrderable = false;
                  }
                  
                  statusBadge = `<div style="margin-bottom:4px;"><span style="display:inline-block;padding:2px 8px;border-radius:999px;font-size:0.7rem;font-weight:700;background:${bg};color:${color};">${text}</span></div>`;
                } else {
                  isOrderable = false;
                  statusBadge = `<div style="margin-bottom:4px;"><span style="display:inline-block;padding:2px 8px;border-radius:999px;font-size:0.7rem;font-weight:700;background:#fef3c7;color:#d97706;">準備中</span></div>`;
                }
              } else {
                isOrderable = false;
              }

              const orderBtnHTML = isOrderable
                ? `<a href="../pos/mobile-order.html?store=${project.id}" class="btn-action btn-order" data-track="click_order_from_list" data-track-project-id="${project.id}"><i class="bi bi-cart-fill"></i> オーダー</a>`
                : (useMobileOrder ? `<button class="btn-action btn-order" style="background:#ccc;box-shadow:none;cursor:not-allowed;" disabled><i class="bi bi-cart-fill"></i> 準備中</button>` : "");

              const detailUrl = project.linkUrl ? project.linkUrl : `detail.html?id=${project.id}`;
              const isFavorite = userFavorites.includes(project.id);
              const favBtnClass = isFavorite ? "btn-favorite-star active" : "btn-favorite-star";

              return `
                    <div class="project-card" style="animation-delay: ${index * 0.02}s">
                        <div class="card-image">
                            <img src="${imgSrc}" alt="${project.name}" onerror="this.onerror=null;this.src='../images/noimage.png'">
                        </div>
                        <div class="card-content">
                            <span class="card-group-name">${groupName}</span>
                            <a href="${detailUrl}" class="card-project-title" data-track="click_project" data-track-project-id="${project.id}">${project.name}</a>
                            ${statusBadge}
                            <p class="card-catchphrase">${catchphrase}</p>
                            <div class="card-place">
                                <i class="bi bi-geo-alt-fill"></i> ${place}
                            </div>
                            <div class="card-tags">${tagsHTML}</div>
                        </div>
                        <div class="card-button-wrapper">
                            <button class="${favBtnClass}" data-project-id="${project.id}" aria-label="Favorite" data-track="click_favorite" data-track-project-id="${project.id}">
                                <i class="bi bi-star"></i>
                            </button>
                            ${orderBtnHTML}
                            <a href="${detailUrl}" class="btn-action btn-details" data-track="click_detail" data-track-project-id="${project.id}">詳細</a>
                        </div>
                    </div>
                    `;
            })
            .join("");

          gridContainer.innerHTML = cardsHTML;
          
          // お気に入りボタンのイベントリスナーを設定
          document.querySelectorAll('.btn-favorite-star').forEach(btn => {
             btn.addEventListener('click', async (e) => {
                 e.preventDefault(); // 親のaタグ等があれば無効化
                 const user = getCurrentUser();
                 if (!user) {
                     // 未ログイン時は専用モーダルを表示して案内
                     const currentUrl = encodeURIComponent(window.location.pathname + window.location.search);
                     AppShell.showLoginPrompt("favorite", `login.html?redirect=${currentUrl}&reason=favorite`, btn);
                     return;
                 }
                 
                 const projectId = btn.dataset.projectId;
                 // UIを先行して切り替え（オプティミスティックUI）
                 const isActive = btn.classList.toggle('active');
                 
                 try {
                     const isNowFavorite = await toggleFavorite(projectId);
                     // 状態の同期
                     if (isNowFavorite && !userFavorites.includes(projectId)) {
                         userFavorites.push(projectId);
                     } else if (!isNowFavorite && userFavorites.includes(projectId)) {
                         userFavorites = userFavorites.filter(id => id !== projectId);
                         // もし「お気に入りのみ表示」がONなら、画面から消すために再描画
                         if (activeFilters.favoritesOnly) {
                             applyFiltersAndSort(false);
                         }
                     }
                 } catch (err) {
                     console.error("Failed to toggle favorite:", err);
                     // 失敗したら元に戻す
                     btn.classList.toggle('active', !isActive);
                     AppShell.showToast("お気に入りの更新に失敗しました", true);
                 }
             });
          });
        }

        // Filter & Sort Logic
        function applyFiltersAndSort(useLoading = false) {
          if (typeof projectData === "undefined") return;

          if (useLoading) {
            renderSkeletons(9); // Show skeleton while processing/filtering
            // Simulate subtle delay for UX (and ensures render loop clear)
            setTimeout(() => {
              processDataAndRender();
            }, 400);
          } else {
            processDataAndRender();
          }

          function processDataAndRender() {
            // 1. 基本的な除外
            let result = projectData.filter(
              (p) => p.category !== "stage" && !(storeStatuses[p.id] && storeStatuses[p.id].isTestStore),
            );

            // 2. Filter
            if (activeFilters.grade !== "すべて") {
              result = result.filter((p) => {
                if (activeFilters.grade === "部活動")
                  return p.groupName && !p.groupName.match(/^[1-3]年/);
                return (
                  p.groupName &&
                  p.groupName.startsWith(activeFilters.grade.replace("生", ""))
                );
              });
            }
            if (activeFilters.category !== "すべて") {
              result = result.filter(
                (p) => p.category === activeFilters.category,
              );
            }
            if (activeFilters.search) {
              const term = activeFilters.search.toLowerCase();
              result = result.filter(
                (p) =>
                  p.name.toLowerCase().includes(term) ||
                  (p.groupName && p.groupName.toLowerCase().includes(term)) ||
                  (p.place && p.place.toLowerCase().includes(term)) ||
                  (p.catchphrase && p.catchphrase.toLowerCase().includes(term)) ||
                  (p.tags && p.tags.some(t => t.toLowerCase().includes(term))),
              );
            }
            if (activeFilters.favoritesOnly) {
              result = result.filter(p => userFavorites.includes(p.id));
            }

            // 3. Sort
            if (activeFilters.sort === "name-asc") {
              result.sort((a, b) => a.name.localeCompare(b.name, "ja"));
            } else if (activeFilters.sort === "id-asc") {
              result.sort(
                (a, b) => (parseInt(a.id) || 9999) - (parseInt(b.id) || 9999),
              );
            } else if (activeFilters.sort === "floor-asc") {
              result.sort((a, b) => {
                const floorA = a.floor || 99;
                const floorB = b.floor || 99;
                if (floorA !== floorB) return floorA - floorB;
                return (parseInt(a.id) || 9999) - (parseInt(b.id) || 9999);
              });
            }
            renderCards(result);
          }
        }

        searchInput?.addEventListener("input", (e) => {
          activeFilters.search = e.target.value.trim();
          applyFiltersAndSort(false); // No loading for type-ahead search
        });
        
        searchInput?.addEventListener("change", (e) => {
          const val = e.target.value.trim();
          if (val) {
            logEvent(analytics, "search_project", { search_keyword: val });
          }
        });

        document.querySelectorAll(".filter-btn").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            const group = e.target.closest(".filter-buttons");
            group.querySelector(".active").classList.remove("active");
            e.target.classList.add("active");
            if (group.id === "filter-by-grade")
              activeFilters.grade = e.target.dataset.filter;
            if (group.id === "filter-by-type")
              activeFilters.category = e.target.dataset.filter;
            applyFiltersAndSort(true); // Show loading on filter change
          });
        });

          const sortSelect = document.getElementById("sort-select");
          if (sortSelect) {
            sortSelect.addEventListener("change", (e) => {
              activeFilters.sort = e.target.value;
              logEvent(analytics, "change_sort", { sort_type: e.target.value });
              applyFiltersAndSort(true);
            });
          }

          if (showFavoritesToggle) {
            showFavoritesToggle.addEventListener("change", (e) => {
              if (e.target.checked) {
                  const user = getCurrentUser();
                  if (!user) {
                      e.target.checked = false;
                      const currentUrl = encodeURIComponent(window.location.pathname + window.location.search);
                      AppShell.showLoginPrompt("favorite", `login.html?redirect=${currentUrl}&reason=favorite`, e.target);
                      return;
                  }
              }
              activeFilters.favoritesOnly = e.target.checked;
              logEvent(analytics, "toggle_favorites_filter", { status: e.target.checked ? "on" : "off" });
              applyFiltersAndSort(true);
            });
          }

          const gridBtn = document.getElementById("grid-view-btn");
          const listBtn = document.getElementById("list-view-btn");
        gridBtn?.addEventListener("click", () => {
          gridContainer.classList.remove("list-view");
          gridBtn.classList.add("active");
          listBtn.classList.remove("active");
          // Re-render to adjust image skeleton size if needed (or just CSS handles it)
          // renderCards not needed if content exists, but skeleton logic depends on class
        });
        listBtn?.addEventListener("click", () => {
          gridContainer.classList.add("list-view");
          listBtn.classList.add("active");
          gridBtn.classList.remove("active");
        });

        // Initial Render
        renderSkeletons(12);
        
        try {
          const snap = await getDocs(collection(db, "stores"));
          snap.forEach(doc => {
            const data = doc.data();
            storeStatuses[doc.id] = {
              op: data.operationStatus || "suspended",
              available: data.availableItemCount,
              total: data.totalItemCount,
              isTestStore: data.isTestStore
            };
          });
        } catch (e) {
          console.error("Firestore status fetch error:", e);
        }

        isStoresLoaded = true;
        if (isAuthResolved) {
          applyFiltersAndSort(false);
        }
      });
    </script>
      <!-- Floating Vote Button (Bug 8) -->
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSfp5h3ff_OnUV_0zNVLEA7Efbd9Qyy5VYJWBJmWIWnTeZwnmQ/viewform?usp=header" class="floating-vote-btn" target="_blank" rel="noopener" aria-label="来場者投票" data-track="click_floating_vote">
        <i class="bi bi-person-raised-hand"></i>
        <span>投票</span>
      </a>
    </body>
</html>

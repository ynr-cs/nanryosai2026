<!doctype html>
<html lang="ja">
  <head>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('app-theme');
          if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
          else if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
        } catch (e) {}
      })();
    </script>
    <!-- Prevent Dark Mode Flicker (FOUC) -->
    <style>
      html { background-color: #f0f2f5; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) { background-color: #0f172a; }
      }
      html[data-theme="dark"] { background-color: #0f172a; }
      html[data-theme="light"] { background-color: #f0f2f5; }
    </style>
    <script>
      (function() {
        const savedTheme = localStorage.getItem("app-theme") || "auto";
        if (savedTheme === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        } else if (savedTheme === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>マイページ | 南陵祭'26</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
    <style>
      .profile-header {
        text-align: center;
        padding: 24px 16px;
        background: var(--card-bg);
        border-radius: 0 0 24px 24px;
        box-shadow: 0 4px 15px var(--shadow-color);
        margin-bottom: 20px;
      }
      .profile-img-lg {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: var(--border-color);
        margin: 0 auto 12px;
        overflow: hidden;
        border: 3px solid var(--card-bg);
        box-shadow: 0 6px 12px var(--shadow-color);
      }
      .profile-img-lg img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .profile-name {
        font-size: 1.25rem;
        font-weight: 800;
        margin-bottom: 4px;
        color: var(--text-main);
      }
      .profile-email {
        color: var(--text-sub);
        font-size: 0.9rem;
      }

      .section-title {
        padding: 0 20px;
        margin-bottom: 8px;
        font-size: 1.1rem;
        font-weight: 800;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text-main);
      }

      .dashboard-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        padding: 0;
        margin-bottom: 20px;
      }
      .stat-card {
        background: var(--card-bg);
        padding: 16px 12px;
        border-radius: 16px;
        text-align: center;
        box-shadow: 0 4px 10px var(--shadow-color);
        transition: transform 0.2s;
      }
      .stat-card:active {
        transform: scale(0.98);
      }
      .stat-num {
        font-size: 1.5rem;
        font-weight: 900;
        color: var(--primary-color);
        line-height: 1;
      }
      .stat-label {
        font-size: 0.8rem;
        color: var(--text-sub);
        margin-top: 5px;
        font-weight: bold;
      }
      .stat-card {
        transition:
          transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275),
          box-shadow 0.3s ease;
        cursor: default;
      }
      .stat-card[id="card-order-count"] {
        cursor: pointer;
      }
      .stat-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
      }

      .menu-list {
        padding: 0;
      }
      .menu-item {
        display: flex;
        align-items: center;
        padding: 15px 0;
        border-bottom: 1px solid var(--border-color);
        color: var(--text-main);
        font-weight: 500;
        transition:
          transform 0.2s cubic-bezier(0.4, 0, 0.2, 1),
          color 0.2s ease;
        cursor: pointer;
      }
      .menu-item:hover {
        transform: translateX(6px);
        color: var(--primary-color);
      }
      .menu-item i,
      .logout-btn i {
        width: 30px;
        text-align: center;
        margin-right: 15px;
        color: var(--primary-color);
        transition: color 0.2s ease;
      }
      .logout-btn i {
        color: #ff4757 !important;
      }
      .menu-item:hover i {
        color: var(--brand-color);
      }
      .menu-item:last-child {
        border-bottom: none;
      }

      /* Menu items are standard div.menu-item */

      /* Loading State */
      .loading-skeleton {
        animation: pulse 1.5s infinite;
        background: var(--border-color);
        color: transparent !important;
        border-radius: 4px;
      }

      /* Order History Styles - Compact */
      .order-card {
        background: var(--card-bg);
        border-radius: 12px;
        padding: 12px 14px;
        margin-bottom: 8px;
        border: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        gap: 12px;
        transition: transform 0.15s, box-shadow 0.15s;
      }
      .order-card:active {
        transform: scale(0.98);
      }
      .order-icon {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: var(--item-fill);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 1.1rem;
      }
      .order-info {
        flex: 1;
        min-width: 0;
      }
      .order-info-top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
      }
      .store-name {
        font-weight: 700;
        color: var(--text-main);
        font-size: 0.9rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .order-date {
        font-size: 0.7rem;
        color: var(--text-sub);
        white-space: nowrap;
        flex-shrink: 0;
      }
      .order-items {
        font-size: 0.75rem;
        color: var(--text-sub);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin: 2px 0;
      }
      .order-info-bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .order-price {
        font-weight: 800;
        font-size: 0.9rem;
        color: var(--text-main);
      }
      .status-badge {
        padding: 2px 8px;
        border-radius: 20px;
        font-size: 0.65rem;
        font-weight: bold;
      }

      .header-count-badge {
        background: var(--primary-color);
        color: white;
        padding: 2px 8px;
        border-radius: 10px;
        font-size: 0.75rem;
        font-weight: 700;
        margin-left: 6px;
      }

      .section-title {
        padding: 0;
        margin-bottom: 10px;
        font-size: 1.05rem;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        color: var(--text-main);
        cursor: pointer;
        user-select: none;
        transition:
          opacity 0.2s,
          transform 0.2s;
      }
      .section-title:hover {
        opacity: 0.8;
        transform: translateY(-2px);
      }

      /* Toggle Arrow */
      .toggle-icon {
        transition: transform 0.3s ease;
      }
      .section-closed .toggle-icon {
        transform: rotate(-90deg);
      }

      /* Collapsible Content */
      .collapsible-content {
        overflow: hidden;
        transition:
          max-height 0.3s ease,
          opacity 0.3s ease;
        max-height: 2000px; /* Arbitrary large height */
        opacity: 1;
      }
      .section-closed + .collapsible-content {
        max-height: 0;
        opacity: 0;
        padding-bottom: 0 !important;
      }

      @keyframes pulse {
        0% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
        }
        100% {
          opacity: 0.6;
        }
      }

      /* Toggle Switch CSS */
      .toggle-switch {
        position: relative;
        display: inline-block;
        width: 44px;
        height: 24px;
      }
      .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #ccc;
        transition: 0.4s;
        border-radius: 34px;
      }
      .slider:before {
        position: absolute;
        content: "";
        height: 18px;
        width: 18px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        transition: 0.4s;
        border-radius: 50%;
      }
      input:checked + .slider {
        background-color: var(--primary-color);
      }
      /* Loading State */
      #account-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 60vh;
        gap: 16px;
      }
      .standard-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid var(--border-color);
        border-top-color: var(--primary-color);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .loader-text {
        color: var(--text-sub);
        font-size: 0.85rem;
      }

      /* UID Badge Styles */
      .user-uid-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--item-fill);
        border: 1px solid var(--border-color);
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.72rem;
        color: var(--text-sub);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        margin-top: 6px;
        cursor: pointer;
        transition: all 0.2s ease;
        user-select: none;
        max-width: 90%;
      }
      .user-uid-badge:hover {
        background: var(--card-bg);
        border-color: var(--primary-color);
        color: var(--primary-color);
      }
      .user-uid-badge:active {
        transform: scale(0.97);
      }
      .uid-text {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .btn-copy-uid {
        background: none;
        border: none;
        padding: 0;
        color: inherit;
        font-size: 0.8rem;
        cursor: pointer;
        display: flex;
        align-items: center;
      }

      /* Modern Nickname Edit Styles */
      .nickname-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-bottom: 2px;
      }
      .btn-edit-nick {
        background: var(--item-fill);
        border: 1px solid var(--border-color);
        color: var(--text-sub);
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 0.8rem;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .btn-edit-nick:hover {
        background: var(--primary-color);
        border-color: var(--primary-color);
        color: #fff;
        transform: scale(1.08);
      }
      .nickname-edit-panel {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 14px 16px;
        margin: 10px auto 4px;
        max-width: 320px;
        box-shadow: 0 4px 15px var(--shadow-color);
        animation: fadeInDown 0.25s ease-out;
      }
      @keyframes fadeInDown {
        from {
          opacity: 0;
          transform: translateY(-8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .nickname-input-group {
        position: relative;
        margin-bottom: 10px;
      }
      .nickname-input {
        width: 100%;
        padding: 8px 48px 8px 12px;
        font-size: 0.9rem;
        border-radius: 10px;
        border: 1.5px solid var(--border-color);
        background: var(--bg-color);
        color: var(--text-main);
        transition: border-color 0.2s, box-shadow 0.2s;
        outline: none;
        box-sizing: border-box;
      }
      .nickname-input:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15);
      }
      .char-counter {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 0.7rem;
        color: var(--text-sub);
        pointer-events: none;
      }
      .nickname-action-row {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .btn-nick-cancel {
        padding: 6px 14px;
        font-size: 0.8rem;
        font-weight: 600;
        border-radius: 20px;
        border: 1px solid var(--border-color);
        background: transparent;
        color: var(--text-sub);
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn-nick-cancel:hover {
        background: var(--item-fill);
        color: var(--text-main);
      }
      .btn-nick-save {
        padding: 6px 16px;
        font-size: 0.8rem;
        font-weight: 700;
        border-radius: 20px;
        border: none;
        background: var(--primary-color);
        color: #fff;
        cursor: pointer;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .btn-nick-save:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        background: var(--text-sub);
      }
      .btn-nick-save:not(:disabled):hover {
        opacity: 0.9;
        transform: translateY(-1px);
        box-shadow: 0 3px 8px rgba(108, 92, 231, 0.3);
      }
      .toast-feedback {
        position: fixed;
        bottom: calc(var(--bottom-nav-height, 70px) + 20px);
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: rgba(30, 41, 59, 0.92);
        color: #fff;
        padding: 10px 20px;
        border-radius: 24px;
        font-size: 0.85rem;
        font-weight: 600;
        box-shadow: 0 4px 16px rgba(0,0,0,0.25);
        z-index: 9999;
        opacity: 0;
        pointer-events: none;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        display: flex;
        align-items: center;
        gap: 8px;
        backdrop-filter: blur(8px);
      }
      .toast-feedback.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* Account Delete Modal & Full-screen Overlay */
      .modal-custom-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(6px);
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
      }
      .modal-custom-overlay.active {
        opacity: 1;
        pointer-events: auto;
      }
      .delete-modal-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 20px;
        max-width: 360px;
        width: 100%;
        padding: 24px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        transform: scale(0.92);
        transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .modal-custom-overlay.active .delete-modal-card {
        transform: scale(1);
      }
      .delete-icon-circle {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: rgba(239, 68, 68, 0.12);
        color: #ef4444;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        margin: 0 auto 16px;
      }
      .delete-modal-title {
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--text-main);
        margin-bottom: 8px;
      }
      .delete-modal-desc {
        font-size: 0.85rem;
        color: var(--text-sub);
        line-height: 1.5;
        margin-bottom: 20px;
      }
      .delete-modal-actions {
        display: flex;
        gap: 10px;
      }
      .btn-modal-cancel {
        flex: 1;
        padding: 10px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        background: var(--item-fill);
        color: var(--text-main);
        font-weight: 600;
        font-size: 0.9rem;
        cursor: pointer;
        transition: background 0.2s;
      }
      .btn-modal-cancel:hover {
        background: var(--border-color);
      }
      .btn-modal-delete {
        flex: 1;
        padding: 10px;
        border-radius: 12px;
        border: none;
        background: #ef4444;
        color: #fff;
        font-weight: 700;
        font-size: 0.9rem;
        cursor: pointer;
        transition: opacity 0.2s, transform 0.1s;
      }
      .btn-modal-delete:hover {
        opacity: 0.9;
      }
      .btn-modal-delete:active {
        transform: scale(0.98);
      }

      /* Deletion Progress Screen Overlay */
      .deletion-processing-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        z-index: 10001;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
      .deletion-processing-overlay.active {
        opacity: 1;
        pointer-events: auto;
      }
      .deletion-spinner-wrap {
        width: 60px;
        height: 60px;
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top-color: #ef4444;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        margin-bottom: 20px;
      }
      .deletion-processing-title {
        color: #fff;
        font-size: 1.15rem;
        font-weight: 700;
        margin-bottom: 8px;
      }
      .deletion-processing-sub {
        color: rgba(255, 255, 255, 0.7);
        font-size: 0.85rem;
        text-align: center;
        max-width: 280px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <main>
      <!-- Loading State (visible by default) -->
      <div id="account-loader">
        <div class="standard-spinner"></div>
        <div class="loader-text">読み込み中...</div>
      </div>

      <!-- Authenticated User Content -->
      <div id="auth-content" style="display: none;">
        <div id="profile-area">
          <!-- Loaded by JS -->
          <div class="profile-header">
            <div class="profile-img-lg" style="display:flex; align-items:center; justify-content:center; background:var(--item-fill); border:2px solid var(--border-color);">
              <i class="bi bi-person-fill" style="font-size: 40px; color: var(--text-sub);"></i>
            </div>
            
            <!-- Nickname Display & Edit Trigger -->
            <div class="nickname-wrap">
              <span id="display-nickname" class="profile-name" style="margin-bottom:0;">---</span>
              <button id="btn-edit-nickname" class="btn-edit-nick" aria-label="ニックネーム編集" title="ニックネームを変更">
                <i class="bi bi-pencil-fill"></i>
              </button>
            </div>

            <!-- Modern Nickname Edit Panel -->
            <div id="nickname-edit-box" class="nickname-edit-panel" style="display:none;">
              <div class="nickname-input-group">
                <input type="text" id="input-nickname" class="nickname-input" maxlength="20" placeholder="新しいニックネーム" autocomplete="off" />
                <span id="char-counter" class="char-counter">0/20</span>
              </div>
              <div class="nickname-action-row">
                <button type="button" id="btn-cancel-nickname" class="btn-nick-cancel">キャンセル</button>
                <button type="button" id="btn-save-nickname" class="btn-nick-save" disabled>
                  <i class="bi bi-check2"></i> 保存
                </button>
              </div>
            </div>

            <!-- Student / Visitor Badge -->
            <div id="student-badge-area" style="margin-top:6px;">
              <span id="student-badge" class="badge" style="font-size:0.8rem; padding:6px 12px; border-radius:20px; font-weight:600; background:var(--item-fill); color:var(--text-sub); border:1px solid var(--border-color);">確認中...</span>
            </div>

            <!-- UID Badge (Copyable) -->
            <div style="margin-top:4px;">
              <div class="user-uid-badge" id="user-uid-badge" title="タップしてUIDをコピー">
                <i class="bi bi-fingerprint" style="color:var(--primary-color);"></i>
                <span id="display-uid" class="uid-text">UID: 読み込み中...</span>
                <i class="bi bi-copy" id="icon-copy-uid" style="font-size:0.75rem; margin-left:2px; opacity:0.7;"></i>
              </div>
            </div>
          </div>
        </div>

        <!-- Toast Notification Feedback -->
        <div id="toast-feedback" class="toast-feedback">
          <i class="bi bi-check-circle-fill text-success" id="toast-icon"></i>
          <span id="toast-message">更新しました</span>
        </div>

        <!-- Dashboard Stats -->
        <div class="account-section">
          <div class="dashboard-grid">
            <div class="stat-card" id="card-order-count">
              <div class="stat-num" id="stat-orders">-</div>
              <div class="stat-label">注文数</div>
            </div>
            <div class="stat-card">
              <div class="stat-num" id="stat-favorites">0</div>
              <div class="stat-label">お気に入り</div>
            </div>
          </div>
        </div>

        <!-- Favorites Section -->
        <div class="account-section" id="favorites-section" style="margin-top: 10px">
          <h3 class="section-title section-closed" id="favorites-toggle" data-track="click_account_accordion" data-track-section="favorites">
            <span style="display: flex; align-items: center">
              🌟 お気に入り
              <span id="fav-count-badge" class="header-count-badge">0</span>
            </span>
            <i class="bi bi-chevron-down toggle-icon"></i>
          </h3>
          <div class="collapsible-content">
            <div id="favorites-list">
              <div
                style="
                  text-align: center;
                  padding: 16px;
                  color: var(--text-sub);
                  background: var(--card-bg);
                  border-radius: 12px;
                  border: 1px dashed var(--border-color);
                  font-size: 0.85rem;
                  margin-bottom: 16px;
                "
              >
                お気に入り機能は準備中です
              </div>
            </div>
          </div>
        </div>

        <!-- Order History Section -->
        <div class="account-section" id="order-history-section" style="margin-top: 10px">
          <h3 class="section-title section-closed" id="order-history-toggle" data-track="click_account_accordion" data-track-section="order_history">
            <span style="display: flex; align-items: center">
              📦 注文履歴
              <span id="order-count-badge" class="header-count-badge">-</span>
            </span>
            <i class="bi bi-chevron-down toggle-icon"></i>
          </h3>
          <div class="collapsible-content">
            <div id="order-list">
              <!-- Orders will be injected here -->
              <div
                class="loading-skeleton"
                style="height: 56px; border-radius: 12px; margin-bottom: 8px"
              ></div>
              <div
                class="loading-skeleton"
                style="height: 56px; border-radius: 12px; margin-bottom: 8px"
              ></div>
            </div>
          </div>
        </div>

        <!-- Settings Section -->
        <div class="account-section" style="margin-top: 16px; margin-bottom: 40px">
          <h3 class="section-title" style="cursor: default">⚙️ 設定</h3>
          <div
            class="menu-list"
            style="
              background: var(--card-bg);
              border-radius: 16px;
              padding: 6px 16px;
            "
          >
            <div class="menu-item" style="justify-content: space-between">
              <div style="display: flex; align-items: center">
                <i class="bi bi-bell"></i> 呼び出し通知
              </div>
              <label class="toggle-switch">
                <input type="checkbox" id="notification-toggle" data-track="toggle_notification" />
                <span class="slider"></span>
              </label>
            </div>
            <div class="menu-item" onclick="window.location.href = 'terms.html'" data-track="click_account_menu" data-track-target="terms">
              <i class="bi bi-file-text"></i> 利用規約
            </div>
            <!-- Logout Button -->
            <div
              class="menu-item"
              id="btn-logout"
              data-track="click_account_menu" data-track-target="logout"
            >
              <i class="bi bi-box-arrow-right"></i>
              ログアウト
            </div>
            <!-- Delete Account Button -->
            <div
              class="menu-item"
              id="btn-delete-account"
              style="border-bottom: none; cursor: pointer"
              data-track="click_account_menu" data-track-target="delete_account"
            >
              <i class="bi bi-trash"></i> アカウント削除
            </div>
          </div>
        </div>
      </div>

      <!-- Delete Account Confirmation Modal -->
      <div id="delete-account-modal" class="modal-custom-overlay" aria-hidden="true">
        <div class="delete-modal-card">
          <div class="delete-icon-circle">
            <i class="bi bi-trash3-fill"></i>
          </div>
          <h4 class="delete-modal-title">アカウントを削除しますか？</h4>
          <p class="delete-modal-desc">
            お気に入りや注文履歴など、すべてのデータが完全に削除されます。<br>
            <strong>この操作は取り消せません。</strong>
          </p>
          <div id="delete-modal-error" class="alert alert-danger py-2 px-3 small text-start mb-3" style="display:none; font-size:0.8rem; border-radius:10px;"></div>
          <div class="delete-modal-actions">
            <button type="button" id="btn-cancel-delete" class="btn-modal-cancel">キャンセル</button>
            <button type="button" id="btn-confirm-delete" class="btn-modal-delete">削除する</button>
          </div>
        </div>
      </div>

      <!-- Deletion Full-screen Processing Overlay -->
      <div id="deletion-processing-overlay" class="deletion-processing-overlay" aria-hidden="true">
        <div id="deletion-spinner" class="deletion-spinner-wrap"></div>
        <div id="deletion-success-icon" style="display:none; font-size:52px; color:#10b981; margin-bottom:16px;">
          <i class="bi bi-check-circle-fill"></i>
        </div>
        <div id="deletion-progress-title" class="deletion-processing-title">アカウントを削除中...</div>
        <div id="deletion-progress-sub" class="deletion-processing-sub">
          安全にデータを消去しています。<br>画面を閉じずにお待ちください。
        </div>
      </div>
    </main>

    <script>
      window.CURRENT_PAGE = "account";
    </script>
    <script src="data/data.js"></script>
    <script type="module" src="app-shell.js"></script>

    <!-- Account Page specific logic -->
    <script type="module">
      import {
        watchUser,
        logout,
        db,
        app,
        auth,
        getFavorites,
        toggleFavorite,
        getClaims,
        isEffectiveStudent,
        functions
      } from "./auth.js";
      import {
        collection,
        query,
        where,
        getCountFromServer,
        getDocs,
        getDoc,
        setDoc,
        orderBy,
        limit,
        doc,
        arrayUnion,
      } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
      import {
        getMessaging,
        getToken,
      } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-messaging.js";
      import { httpsCallable } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-functions.js";

      const logoutBtn = document.getElementById("btn-logout");
      const orderHistorySection = document.getElementById("order-history-section");
      const orderList = document.getElementById("order-list");
      const orderHistoryToggle = document.getElementById("order-history-toggle");
      const favoritesToggle = document.getElementById("favorites-toggle");

      // Generalized Toggle Logic
      [orderHistoryToggle, favoritesToggle].forEach((toggle) => {
        if (toggle) {
          toggle.addEventListener("click", () => {
            toggle.classList.toggle("section-closed");
          });
        }
      });

      // Notification Logic
      const notificationToggle = document.getElementById("notification-toggle");
      let messaging = null;
      try {
        messaging = getMessaging(app);
      } catch (e) {
        console.warn("[Account] Messaging not available:", e);
      }
      const VAPID_KEY =
        "BI-HfOk34KQVIoJK_8KnKplz3l31I9VLWOJKF7mHBARF-XmgVjpRSyVoSfSnoVZDS7orz-OO8yq-S32STZU30Po";

      // Check permission and Device support on load
      const isIOSorMac =
        /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
        /Macintosh/i.test(navigator.userAgent);

      if (isIOSorMac || !messaging) {
        notificationToggle.disabled = true;
        notificationToggle.parentElement.parentElement.title =
          "この端末は通知に対応していません";
        const label = notificationToggle.parentElement.previousElementSibling;
        if (label)
          label.innerHTML +=
            ' <span style="font-size:0.75rem; color:var(--status-unpaid);">(非対応)</span>';
      } else if (Notification.permission === "granted") {
        notificationToggle.checked = true;
      }

      notificationToggle.addEventListener("change", async (e) => {
        const user = window.CURRENT_USER_OBJ;
        if (!user) {
          alert("ログインが必要です");
          e.target.checked = false;
          return;
        }

        if (e.target.checked) {
          try {
            const permission = await Notification.requestPermission();
            if (permission === "granted") {
              await saveToken(user);
            } else {
              alert("通知権限が拒否されました");
              e.target.checked = false;
            }
          } catch (err) {
            console.error("Notification Error:", err);
            alert("エラーが発生しました: " + err.message);
            e.target.checked = false;
          }
        } else {
          alert(
            "通知をオフにしました（完全に無効化するにはブラウザの設定も変更してください）",
          );
        }
      });

      async function saveToken(user) {
        try {
          const registration = await navigator.serviceWorker.register(
            "./firebase-messaging-sw.js",
          );
          const swReg = await navigator.serviceWorker.ready;

          const token = await getToken(messaging, {
            vapidKey: VAPID_KEY,
            serviceWorkerRegistration: swReg,
          });

          if (token) {
            await setDoc(
              doc(db, "users", user.uid),
              {
                fcmTokens: arrayUnion(token),
                notificationEnabled: true,
              },
              { merge: true },
            );
          } else {
            console.warn("No registration token available.");
            alert("トークンの取得に失敗しました");
            notificationToggle.checked = false;
          }
        } catch (error) {
          console.error("An error occurred while retrieving token. ", error);
          alert("通知設定のエラー: " + error.message);
          notificationToggle.checked = false;
        }
      }

      // Store user globally for access in event listeners
      window.CURRENT_USER_OBJ = null;
      let storesCache = {};

      // Fallback Timeout: If auth takes too long, redirect
      const authTimeout = setTimeout(() => {
        if (!window.CURRENT_USER_OBJ) {
          console.warn("Auth timeout - redirecting to login");
          const redirectTarget = encodeURIComponent("./account.html");
          window.location.replace(`./login.html?redirect=${redirectTarget}&reason=account`);
        }
      }, 2500);

      // UI Update Logic
      function handleUserUpdate(user) {
        clearTimeout(authTimeout);

        if (user) {
          window.CURRENT_USER_OBJ = user;
          const loader = document.getElementById("account-loader");
          const content = document.getElementById("auth-content");
          if (loader) loader.style.display = "none";
          if (content) content.style.display = "block";

          renderProfile(user);
          fetchOrderCount(user.uid);
          fetchOrderHistory(user.uid);
          fetchFavoritesList(user.uid);
        } else {
          const redirectTarget = encodeURIComponent("./account.html");
          window.location.replace(`./login.html?redirect=${redirectTarget}&reason=account`);
        }
      }

      // Initialize Listener
      watchUser(handleUserUpdate);

      // Helper: Toast Message
      let toastTimer = null;
      function showToast(message, isSuccess = true) {
        const toast = document.getElementById("toast-feedback");
        const msgEl = document.getElementById("toast-message");
        const iconEl = document.getElementById("toast-icon");
        if (!toast || !msgEl) return;

        msgEl.textContent = message;
        if (iconEl) {
          iconEl.className = isSuccess
            ? "bi bi-check-circle-fill text-success"
            : "bi bi-exclamation-triangle-fill text-warning";
        }

        toast.classList.add("show");
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.remove("show");
        }, 2600);
      }

      // --- Profile & Nickname Management ---
      async function renderProfile(user) {
        const displayNick = document.getElementById("display-nickname");
        const studentBadge = document.getElementById("student-badge");
        const editBox = document.getElementById("nickname-edit-box");
        const btnEdit = document.getElementById("btn-edit-nickname");
        const btnSave = document.getElementById("btn-save-nickname");
        const btnCancel = document.getElementById("btn-cancel-nickname");
        const inputNick = document.getElementById("input-nickname");
        const charCounter = document.getElementById("char-counter");
        const displayUid = document.getElementById("display-uid");
        const uidBadge = document.getElementById("user-uid-badge");
        const iconCopy = document.getElementById("icon-copy-uid");

        // 1. UID の表示 & コピー設定
        if (displayUid) {
          displayUid.textContent = `UID: ${user.uid}`;
        }
        if (uidBadge) {
          uidBadge.onclick = async () => {
            try {
              await navigator.clipboard.writeText(user.uid);
              if (iconCopy) {
                iconCopy.className = "bi bi-check2 text-success";
                setTimeout(() => {
                  iconCopy.className = "bi bi-copy";
                }, 2000);
              }
              showToast("UIDをコピーしました", true);
            } catch (err) {
              console.warn("Copy UID failed:", err);
            }
          };
        }

        // 2. Firestore から nickname を取得
        let currentNick = "南陵祭来場者";
        try {
          const userDoc = await getDoc(doc(db, "users", user.uid));
          if (userDoc.exists() && userDoc.data().nickname) {
            currentNick = userDoc.data().nickname;
          }
        } catch (e) {
          console.warn("Failed to fetch nickname:", e);
        }
        if (displayNick) displayNick.textContent = currentNick;

        // 3. Custom Claims から在校生ステータスを判定
        try {
          const claims = await getClaims();
          if (isEffectiveStudent(claims)) {
            if (studentBadge) {
              studentBadge.textContent = "🎓 在校生認証済み";
              studentBadge.style.background = "rgba(16, 185, 129, 0.12)";
              studentBadge.style.color = "#059669";
              studentBadge.style.borderColor = "#10b981";
            }
          } else {
            if (studentBadge) {
              studentBadge.textContent = "一般来場者";
              studentBadge.style.background = "var(--item-fill)";
              studentBadge.style.color = "var(--text-sub)";
              studentBadge.style.borderColor = "var(--border-color)";
            }
          }
        } catch (e) {
          console.warn("Failed to check claims:", e);
        }

        // 4. ニックネームバリデーション関数
        function validateNickname() {
          if (!inputNick || !btnSave) return;
          const val = (inputNick.value || "").trim();
          const len = inputNick.value.length;
          if (charCounter) charCounter.textContent = `${len}/20`;

          // 空文字、または現在と同じなら disabled
          if (val.length === 0 || val === currentNick) {
            btnSave.disabled = true;
          } else {
            btnSave.disabled = false;
          }
        }

        // 5. ニックネーム編集イベント
        if (inputNick) {
          inputNick.oninput = validateNickname;
          inputNick.onkeydown = (e) => {
            if (e.key === "Enter" && !btnSave.disabled) {
              btnSave.click();
            } else if (e.key === "Escape") {
              if (btnCancel) btnCancel.click();
            }
          };
        }

        if (btnEdit) {
          btnEdit.onclick = () => {
            if (inputNick) {
              inputNick.value = currentNick === "南陵祭来場者" ? "" : currentNick;
              validateNickname();
            }
            if (editBox) {
              editBox.style.display = "block";
              if (inputNick) inputNick.focus();
            }
          };
        }

        if (btnCancel) {
          btnCancel.onclick = () => {
            if (editBox) editBox.style.display = "none";
          };
        }

        if (btnSave) {
          btnSave.onclick = async () => {
            const newNick = (inputNick.value || "").trim();
            if (!newNick || newNick === currentNick) return;

            btnSave.disabled = true;
            btnSave.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true" style="width:12px; height:12px; border-width:2px; display:inline-block; vertical-align:-1px;"></span> 保存中...`;

            try {
              await setDoc(
                doc(db, "users", user.uid),
                { nickname: newNick },
                { merge: true },
              );
              currentNick = newNick;
              displayNick.textContent = newNick;
              if (editBox) editBox.style.display = "none";
              showToast("ニックネームを更新しました", true);
            } catch (e) {
              console.error("Nickname save error:", e);
              showToast("保存に失敗しました: " + e.message, false);
            } finally {
              btnSave.innerHTML = `<i class="bi bi-check2"></i> 保存`;
              validateNickname();
            }
          };
        }
      }

      async function fetchOrderCount(uid) {
        try {
          const q = query(collection(db, "orders"), where("userId", "==", uid));
          const snapshot = await getCountFromServer(q);
          const count = snapshot.data().count;
          const badge = document.getElementById("order-count-badge");
          if (badge) badge.textContent = count;
          const statEl = document.getElementById("stat-orders");
          if (statEl) statEl.textContent = count;
        } catch (e) {
          console.error("Order Count Error:", e);
        }
      }

      async function fetchFavoritesList(uid) {
        const list = document.getElementById("favorites-list");
        const favBadge = document.getElementById("fav-count-badge");
        const statFavs = document.getElementById("stat-favorites");
        if (!list) return;

        try {
          const favorites = await getFavorites();
          if (favBadge) favBadge.textContent = favorites.length;
          if (statFavs) statFavs.textContent = favorites.length;

          if (favorites.length === 0) {
            list.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text-sub);">お気に入りがありません</div>`;
            return;
          }

          list.innerHTML = "";
          
          favorites.forEach(favId => {
             let item = null;
             let typeStr = "";
             if (typeof projectData !== "undefined") {
                 item = projectData.find(p => p.id === favId);
                 if (item) typeStr = "企画";
             }
             if (!item && typeof stageData !== "undefined") {
                 item = stageData.find(s => s.id === favId);
                 if (item) typeStr = "ステージ";
             }
             
             if (!item) return;

             let imgPath = `../images/${item.id}.png`;

             let detailsHTML = `<span>${item.groupName || item.place || ''}</span>`;
             if (typeStr === "ステージ") {
                 detailsHTML = `
                     <span>${item.groupName || ''}</span>
                     <span style="display:flex;align-items:center;gap:2px;"><i class="bi bi-clock"></i> ${item.time || ''}</span>
                     <span style="display:flex;align-items:center;gap:2px;"><i class="bi bi-geo-alt"></i> ${item.place || ''}</span>
                 `;
             }

             const el = document.createElement("div");
             el.className = "order-card";
             el.style.cursor = "pointer";
             
             el.innerHTML = `
                 <div style="width: 50px; height: 50px; border-radius: 10px; overflow: hidden; flex-shrink: 0; background: var(--item-fill); border: 1px solid var(--border-color);">
                     <img src="${imgPath}" alt="${item.name}" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.onerror=null;this.src='../images/noimage.png'">
                 </div>
                 <div class="order-info" onclick="window.location.href='detail.html?id=${favId}'" style="padding: 2px 0;">
                     <div class="order-info-top" style="margin-bottom: 4px;">
                         <span class="store-name" style="font-size: 0.95rem; line-height: 1.2;">${item.name}</span>
                     </div>
                     <div class="order-items" style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 0.75rem; color: var(--text-sub);">
                         <span style="background: var(--bg-color); border: 1px solid var(--border-color); padding: 2px 6px; border-radius: 4px;">${typeStr}</span>
                         ${detailsHTML}
                     </div>
                 </div>
                 <button class="btn-favorite-star active" data-id="${favId}" style="margin-left: auto;" aria-label="Remove Favorite">
                     <i class="bi bi-star"></i>
                 </button>
             `;
             
             const favBtn = el.querySelector(".btn-favorite-star");
             favBtn.addEventListener("click", async (e) => {
                 e.stopPropagation();
                 favBtn.classList.remove("active");
                 try {
                     await toggleFavorite(favId);
                     fetchFavoritesList(uid);
                 } catch(err) {
                     favBtn.classList.add("active");
                 }
             });
             
             list.appendChild(el);
          });
        } catch (e) {
          console.error("Fetch Favorites Error:", e);
        }
      }

      async function fetchOrderHistory(uid) {
        const list = document.getElementById("order-list");
        if (!list) return;

        try {
          const q = query(
            collection(db, "orders"),
            where("userId", "==", uid),
            orderBy("createdAt", "desc"),
            limit(10),
          );

          const snap = await getDocs(q);
          list.innerHTML = "";

          if (snap.empty) {
            list.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text-sub);">注文履歴がありません</div>`;
            return;
          }

          for (const d of snap.docs) {
            const data = d.data();
            const orderId = d.id;
            const date = data.createdAt
              ? data.createdAt
                  .toDate()
                  .toLocaleString("ja-JP", {
                    month: "numeric",
                    day: "numeric",
                    hour: "2-digit",
                    minute: "2-digit",
                  })
              : "---";
            const total = data.totalPrice;
            const statusText = translateStatus(data.status);
            const statusColor = getStatusColor(data.status);

            let storeName = "読み込み中...";
            if (storesCache[data.storeId]) {
              storeName = storesCache[data.storeId];
            }

            const el = document.createElement("div");
            el.className = "order-card";
            el.onclick = () => {
              window.location.href = `../pos/status.html?orderId=${orderId}`;
            };
            el.style.cursor = "pointer";

            const itemNames = (data.items || [])
              .map((i) => `${i.name} x${i.quantity}`)
              .join("、");

            el.innerHTML = `
                <div class="order-icon">
                    <i class="bi bi-receipt" style="color: var(--primary-color)"></i>
                </div>
                <div class="order-info">
                    <div class="order-info-top">
                        <span class="store-name" id="store-name-${orderId}">${storeName}</span>
                        <span class="order-date">${date}</span>
                    </div>
                    <div class="order-items">${itemNames}</div>
                    <div class="order-info-bottom">
                        <span class="order-price">¥${total}</span>
                        <span class="status-badge" style="background: ${statusColor}; color: white;">${statusText}</span>
                    </div>
                </div>
            `;
            list.appendChild(el);

            if (!storesCache[data.storeId]) {
              fetchStoreName(data.storeId, `store-name-${orderId}`);
            }
          }
        } catch (e) {
          console.error("History Error:", e);
          list.innerHTML = `<div style="color:red; text-align:center;">読み込みエラー</div>`;
        }
      }

      async function fetchStoreName(storeId, elementId) {
        if (storesCache[storeId]) {
          const el = document.getElementById(elementId);
          if (el) el.textContent = storesCache[storeId];
          return;
        }
        try {
          const snap = await getDoc(doc(db, "stores", storeId));
          if (snap.exists()) {
            const name = snap.data().name;
            storesCache[storeId] = name;
            const el = document.getElementById(elementId);
            if (el) el.textContent = name;
          } else {
            storesCache[storeId] = "不明な店舗";
          }
        } catch (e) {
          console.warn(e);
        }
      }

      // Logout Logic
      if (logoutBtn) {
        logoutBtn.addEventListener("click", async () => {
          if (confirm("ログアウトしますか？")) {
            await logout();
          }
        });
      }

      // Delete Account Modal & Full-screen Progress Logic
      const deleteAccountModal = document.getElementById("delete-account-modal");
      const deletionProgressOverlay = document.getElementById("deletion-processing-overlay");
      const btnDeleteAccount = document.getElementById("btn-delete-account");
      const btnCancelDelete = document.getElementById("btn-cancel-delete");
      const btnConfirmDelete = document.getElementById("btn-confirm-delete");
      const deleteModalError = document.getElementById("delete-modal-error");

      if (btnDeleteAccount) {
        btnDeleteAccount.addEventListener("click", () => {
          if (deleteModalError) deleteModalError.style.display = "none";
          if (deleteAccountModal) {
            deleteAccountModal.classList.add("active");
            deleteAccountModal.setAttribute("aria-hidden", "false");
          }
        });
      }

      if (btnCancelDelete) {
        btnCancelDelete.addEventListener("click", () => {
          if (deleteAccountModal) {
            deleteAccountModal.classList.remove("active");
            deleteAccountModal.setAttribute("aria-hidden", "true");
          }
        });
      }

      if (deleteAccountModal) {
        deleteAccountModal.addEventListener("click", (e) => {
          if (e.target === deleteAccountModal) {
            if (btnCancelDelete) btnCancelDelete.click();
          }
        });
      }

      if (btnConfirmDelete) {
        btnConfirmDelete.addEventListener("click", async () => {
          const user = auth.currentUser;
          if (!user) return;

          // 1. 確認モーダルを閉じ、全画面ロックオーバーレイを表示
          if (deleteAccountModal) {
            deleteAccountModal.classList.remove("active");
            deleteAccountModal.setAttribute("aria-hidden", "true");
          }
          if (deletionProgressOverlay) {
            deletionProgressOverlay.classList.add("active");
            deletionProgressOverlay.setAttribute("aria-hidden", "false");
          }

          const spinnerEl = document.getElementById("deletion-spinner");
          const successIconEl = document.getElementById("deletion-success-icon");
          const titleEl = document.getElementById("deletion-progress-title");
          const subEl = document.getElementById("deletion-progress-sub");

          try {
            const deleteFn = httpsCallable(functions, "deleteMyAccount");
            await deleteFn();

            // 2. 成功時の演出
            if (spinnerEl) spinnerEl.style.display = "none";
            if (successIconEl) successIconEl.style.display = "block";
            if (titleEl) titleEl.textContent = "削除が完了しました";
            if (subEl) subEl.textContent = "ご利用ありがとうございました。ホームに戻ります。";

            await logout();
            setTimeout(() => {
              window.location.replace("./index.html");
            }, 1400);
          } catch (error) {
            console.error("Account deletion failed:", error);
            // 失敗時はオーバーレイを解除し、モーダルにエラーを表示
            if (deletionProgressOverlay) {
              deletionProgressOverlay.classList.remove("active");
              deletionProgressOverlay.setAttribute("aria-hidden", "true");
            }

            if (deleteAccountModal && deleteModalError) {
              deleteModalError.textContent = error.message || "アカウントの削除中にエラーが発生しました";
              deleteModalError.style.display = "block";
              deleteAccountModal.classList.add("active");
              deleteAccountModal.setAttribute("aria-hidden", "false");
            }
          }
        });
      }

      function translateStatus(s) {
        if (s === "cooking") return "調理中";
        if (s === "ready_to_serve") return "準備中";
        if (s === "ready_for_pickup") return "呼出中";
        if (s === "completed") return "受取完了";
        if (s === "cancelled") return "キャンセル";
        if (s === "abandoned") return "期限切れ";
        return "調理中";
      }

      function getStatusColor(s) {
        if (s === "cooking") return "#f59e0b";
        if (s === "ready_to_serve") return "#3b82f6";
        if (s === "ready_for_pickup") return "#10b981";
        if (s === "completed") return "#10b981";
        if (s === "cancelled") return "#ef4444";
        if (s === "abandoned") return "#9ca3af";
        return "#f59e0b";
      }
    </script>
  </body>
</html>

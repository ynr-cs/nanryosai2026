      // ==========================================================================
      // Geometric Helper: Merge Adjacent Polygons for Seamless Corridors
      // ==========================================================================
      function mergeAdjacentPolygons(polygons, toleranceMeters = 0.5) {
        if (!polygons || polygons.length === 0) return [];
        const validPolys = polygons.filter(p => p && p.length >= 3);
        if (validPolys.length <= 1) return validPolys;

        const refLat = validPolys[0][0][0];
        const cosLat = Math.cos((refLat * Math.PI) / 180.0);
        const lat2m = 111132.954;
        const lng2m = 111132.954 * cosLat;

        const toXY = ([lat, lng]) => [
          (lng - validPolys[0][0][1]) * lng2m,
          (lat - validPolys[0][0][0]) * lat2m
        ];
        const toLatLng = ([x, y]) => [
          parseFloat((validPolys[0][0][0] + y / lat2m).toFixed(6)),
          parseFloat((validPolys[0][0][1] + x / lng2m).toFixed(6))
        ];

        let allEdges = [];
        validPolys.forEach((poly, polyIdx) => {
          const xy = poly.map(toXY);
          for (let i = 0; i < xy.length; i++) {
            const p1 = xy[i];
            const p2 = xy[(i + 1) % xy.length];
            allEdges.push({ p1, p2, polyIdx });
          }
        });

        const distSq = (a, b) => (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2;
        const tolSq = toleranceMeters * toleranceMeters;

        const isOppositeEdge = (e1, e2) => {
          return (distSq(e1.p1, e2.p2) <= tolSq && distSq(e1.p2, e2.p1) <= tolSq);
        };

        const sharedIndices = new Set();
        for (let i = 0; i < allEdges.length; i++) {
          for (let j = i + 1; j < allEdges.length; j++) {
            if (allEdges[i].polyIdx !== allEdges[j].polyIdx && isOppositeEdge(allEdges[i], allEdges[j])) {
              sharedIndices.add(i);
              sharedIndices.add(j);
            }
          }
        }

        const outerEdges = allEdges.filter((_, idx) => !sharedIndices.has(idx));
        if (outerEdges.length === 0) return validPolys;

        const mergedPolygons = [];
        const usedEdges = new Set();

        for (let startIdx = 0; startIdx < outerEdges.length; startIdx++) {
          if (usedEdges.has(startIdx)) continue;

          const loop = [];
          let currentIdx = startIdx;
          let iterations = 0;
          const maxIter = outerEdges.length * 2;

          while (currentIdx !== -1 && !usedEdges.has(currentIdx) && iterations < maxIter) {
            usedEdges.add(currentIdx);
            const edge = outerEdges[currentIdx];
            loop.push(edge.p1);

            let nextIdx = -1;
            let bestDist = tolSq * 4;

            for (let j = 0; j < outerEdges.length; j++) {
              if (!usedEdges.has(j)) {
                const d = distSq(edge.p2, outerEdges[j].p1);
                if (d <= bestDist) {
                  bestDist = d;
                  nextIdx = j;
                }
              }
            }

            currentIdx = nextIdx;
            iterations++;
          }

          if (loop.length >= 3) {
            const cleanedLoop = [];
            for (let i = 0; i < loop.length; i++) {
              const curr = loop[i];
              const next = loop[(i + 1) % loop.length];
              if (distSq(curr, next) > 0.04) {
                cleanedLoop.push(curr);
              }
            }
            if (cleanedLoop.length >= 3) {
              mergedPolygons.push(cleanedLoop.map(toLatLng));
            }
          }
        }

        return mergedPolygons.length > 0 ? mergedPolygons : validPolys;
      }

      // ==========================================================================
      // Vector Polygon Rendering (Filtered by Floor + Persistent Gym)
      // ==========================================================================
      function renderFloorPolygons() {
        floorVectorLayerGroup.clearLayers();
        polygonLayerMap.clear();

        // 1. 体育館（全フロア・屋外問わず常時表示される1つのインタラクティブ図形）
        const gymBldg = campusData.buildings && campusData.buildings.find(b => b.id === '体育館' || b.id === 'gym_bldg');
        if (gymBldg) {
          const gymPolyCoords = gymBldg.polygon || gymBldg.coordinates;

          const gymPoly = L.polygon(gymPolyCoords, {
            pane: 'indoorPane',
            interactive: true,
            color: '#6366f1',
            weight: 2.5,
            fillColor: '#ede9fe',
            fillOpacity: 0.85,
            className: 'room-polygon gym-polygon has-project cat-stage'
          });

          gymPoly._origColor = '#6366f1';
          gymPoly._origFillColor = '#ede9fe';

          gymPoly.on('click', (e) => {
            if (e && e.originalEvent) {
              L.DomEvent.stopPropagation(e);
            }
            selectRoom('room_gym_main', true);
          });

          // 体育館の幾何学的重心に「🎭 体育館ステージ」インルームバッジを配置
          const gymCentroid = calculatePolygonCentroid(gymPolyCoords);
          const gymBadgeIcon = L.divIcon({
            className: 'in-room-badge-container',
            html: `
              <div class="in-room-badge cat-stage is-gym ${activeSelectedRoomId === 'room_gym_main' ? 'is-active' : ''}" data-room-id="room_gym_main">
                <span class="badge-icon"><i class="fas fa-theater-masks"></i></span>
                <span class="badge-text">体育館</span>
                <span class="badge-gym-sub">ステージ</span>
              </div>
            `,
            iconSize: [0, 0],
            iconAnchor: [0, 0]
          });

          const gymBadgeMarker = L.marker(gymCentroid, {
            icon: gymBadgeIcon,
            pane: 'markerPane',
            interactive: false
          });

          polygonLayerMap.set('room_gym_main', gymPoly);
          floorVectorLayerGroup.addLayer(gymPoly);
          floorVectorLayerGroup.addLayer(gymBadgeMarker);
        }

        if (currentFloor === 'outdoor') {
          renderPins();
          return;
        }

        const floorData = campusData.indoorFloors[currentFloor];
        if (!floorData) {
          renderPins();
          return;
        }

        // Corridors & Hallways (Unified Seamless Merging for Connected Corridors) - Non-interactive background
        if (floorData.corridors && floorData.corridors.length > 0) {
          const normalCorrs = floorData.corridors.filter(c => !c.id?.includes('overpass') && !c.isOverpass);
          const overpassCorrs = floorData.corridors.filter(c => c.id?.includes('overpass') || c.isOverpass);

          // 1. Normal Corridors: Clean vector rendering (non-interactive)
          normalCorrs.forEach(corr => {
            const coords = corr.polygon || corr.coordinates;
            const poly = L.polygon(coords, {
              pane: 'indoorPane',
              interactive: false,
              color: corr.strokeColor || '#64748b',
              weight: 1.5,
              fillColor: corr.color || '#cbd5e1',
              fillOpacity: 0.45,
              className: 'corridor-polygon'
            });
            floorVectorLayerGroup.addLayer(poly);

            // 1階の昇降口ポリゴン（corridor_697524）にはシンプルに「昇降口」ラベルを配置
            if (corr.name === '昇降口' || corr.id === 'corridor_697524') {
              const pinPos = corr.pinCoord || calculatePolygonCentroid(coords);
              const entranceIcon = L.divIcon({
                className: 'entrance-badge-container',
                html: `
                  <div class="entrance-badge" title="昇降口">
                    <span class="entrance-icon"><i class="fa-solid fa-door-open"></i></span>
                    <span class="entrance-text">昇降口</span>
                  </div>
                `,
                iconSize: [0, 0],
                iconAnchor: [0, 0]
              });
              const entranceMarker = L.marker(pinPos, {
                icon: entranceIcon,
                pane: 'markerPane',
                interactive: false
              });
              floorVectorLayerGroup.addLayer(entranceMarker);
            }
          });

          // 2. Overpasses (non-interactive)
          overpassCorrs.forEach(corr => {
            const poly = L.polygon(corr.polygon || corr.coordinates, {
              pane: 'overpassPane',
              interactive: false,
              color: corr.strokeColor || '#64748b',
              weight: 1.5,
              fillColor: corr.color || '#cbd5e1',
              fillOpacity: 0.7,
              className: 'corridor-overpass'
            });
            floorVectorLayerGroup.addLayer(poly);
          });
        }

        // Stairs & Vertical Connectors (non-interactive)
        const allStairs = [];
        Object.values(campusData.indoorFloors || {}).forEach(fl => {
          (fl.stairs || []).forEach(st => {
            if (st && st.id && !allStairs.some(existing => existing.id === st.id)) {
              allStairs.push(st);
            }
          });
        });
        const stairsToRender = (floorData.stairs && floorData.stairs.length > 0) ? floorData.stairs : allStairs;
        stairsToRender.forEach(stair => {
          const coords = stair.polygon || stair.coordinates;
          const poly = L.polygon(coords, {
            pane: 'indoorPane',
            interactive: false,
            color: stair.strokeColor || '#c2410c',
            weight: 1.5,
            fillColor: stair.color || '#f97316',
            fillOpacity: 0.6,
            className: 'stairs-polygon'
          });
          floorVectorLayerGroup.addLayer(poly);

          // 階段の幾何重心に「階段」マークとテキストのバッジを配置
          const centroid = calculatePolygonCentroid(coords);
          const stairIcon = L.divIcon({
            className: 'stairs-badge-container',
            html: `
              <div class="stairs-badge" title="${escapeHtml(stair.name || '階段')}">
                <span class="stairs-icon"><i class="fa-solid fa-stairs"></i></span>
                <span class="stairs-text">階段</span>
              </div>
            `,
            iconSize: [0, 0],
            iconAnchor: [0, 0]
          });
          const stairMarker = L.marker(centroid, {
            icon: stairIcon,
            pane: 'markerPane',
            interactive: false
          });
          floorVectorLayerGroup.addLayer(stairMarker);
        });

        // Toilets & Restrooms (Gender-differentiated polygons & centroid badges)
        if (floorData.toilets) {
          floorData.toilets.forEach(toilet => {
            const coords = toilet.polygon || toilet.coordinates;
            const isFemale = (toilet.gender === 'female') || (toilet.name && toilet.name.includes('女子'));
            const isMale = (toilet.gender === 'male') || (toilet.name && toilet.name.includes('男子'));
            const genderClass = isFemale ? 'toilet-female' : (isMale ? 'toilet-male' : 'toilet-common');
            const defaultStroke = isFemale ? '#db2777' : (isMale ? '#2563eb' : '#0284c7');
            const defaultFill = isFemale ? '#fce7f3' : (isMale ? '#dbeafe' : '#e0f2fe');

            const poly = L.polygon(coords, {
              pane: 'indoorPane',
              interactive: false,
              color: toilet.strokeColor || defaultStroke,
              weight: 1.5,
              fillColor: toilet.color || defaultFill,
              fillOpacity: 0.7,
              className: `toilet-polygon ${genderClass}`
            });
            floorVectorLayerGroup.addLayer(poly);

            // トイレの幾何重心に男女別「トイレ」マークとテキストのバッジを配置
            const centroid = calculatePolygonCentroid(coords);
            const toiletIconClass = isFemale ? 'fa-solid fa-person-dress' : (isMale ? 'fa-solid fa-person' : 'fa-solid fa-restroom');
            const toiletLabel = isFemale ? '女子トイレ' : (isMale ? '男子トイレ' : 'お手洗い');
            const toiletBadgeIcon = L.divIcon({
              className: 'toilet-badge-container',
              html: `
                <div class="toilet-badge ${escapeHtml(genderClass)}" title="${escapeHtml(toilet.name || toiletLabel)}">
                  <span class="toilet-icon"><i class="${escapeHtml(toiletIconClass)}"></i></span>
                  <span class="toilet-text">${escapeHtml(toiletLabel)}</span>
                </div>
              `,
              iconSize: [0, 0],
              iconAnchor: [0, 0]
            });
            const toiletBadgeMarker = L.marker(centroid, {
              icon: toiletBadgeIcon,
              pane: 'markerPane',
              interactive: false
            });
            floorVectorLayerGroup.addLayer(toiletBadgeMarker);
          });
        }

        // Rooms & Classrooms (Rooms with projects become vibrant highlighted areas with in-room badges)
        if (floorData.rooms) {
          floorData.rooms.forEach((room, roomIdx) => {
            const pinModel = joinedPins.find(p => p.roomId === room.roomId);
            const hasProject = !!(pinModel && pinModel.projects && pinModel.projects.length > 0);
            const isLibrary = (room.roomId === 'room_501_library') || (room.name && room.name.includes('天空の図書館'));
            const isInteractive = hasProject || isLibrary;
            const cat = isLibrary ? 'facility' : (pinModel ? pinModel.category : (room.category || 'facility'));
            const catMeta = CATEGORY_META[cat] || CATEGORY_META.exhibit;
            const catColor = isLibrary ? '#0284c7' : catMeta.color;
            const iconClass = isLibrary ? 'fa-book-open' : ((pinModel && pinModel.rawSpot && pinModel.rawSpot.icon) ? pinModel.rawSpot.icon : catMeta.icon);

            let stroke = hasProject ? catColor : (room.strokeColor || '#94a3b8');
            let fill = hasProject ? catColor : (room.color || '#cbd5e1');
            let fillOpacity = hasProject ? 0.55 : 0.2;
            let weight = hasProject ? 2 : 1;
            let className = `room-polygon ${hasProject ? `has-project cat-${cat}` : 'is-empty'}`;

            if (isLibrary) {
              stroke = '#0284c7';
              fill = '#38bdf8';
              fillOpacity = 0.65;
              weight = 2;
              className = `room-polygon is-library has-project cat-facility`;
            }

            const poly = L.polygon(room.polygon || room.coordinates, {
              pane: 'indoorPane',
              interactive: isInteractive,
              color: stroke,
              weight: weight,
              fillColor: fill,
              fillOpacity: fillOpacity,
              className: className
            });

            poly._origColor = stroke;
            poly._origFillColor = fill;

            if (isInteractive) {
              poly.on('click', (e) => {
                if (e && e.originalEvent) {
                  L.DomEvent.stopPropagation(e);
                }
                selectRoom(room.roomId, true);
              });

              // Centroid In-Room Badge (Floor plan badge centered directly inside the classroom rectangle)
              const centroid = room.pinCoord || calculatePolygonCentroid(room.polygon || room.coordinates);
              const isMusicRoom = room.roomId === 'special_room_337807_4f' || (room.name && room.name.includes('音楽室')) || (pinModel && pinModel.name && pinModel.name.includes('音楽室'));
              const isAvRoom = room.roomId === 'room_admin_301_av' || (room.name && room.name.includes('視聴覚')) || (pinModel && pinModel.name && pinModel.name.includes('視聴覚'));
              const projectTitle = isLibrary
                ? (room.name || '天空の図書館')
                : (pinModel.projects.length === 1
                  ? pinModel.projects[0].name
                  : `${pinModel.name} (${pinModel.projects.length})`);

              const staggerClass = (roomIdx % 2 === 0) ? 'stagger-top' : 'stagger-bottom';
              const badgeClass = isLibrary
                ? `in-room-badge is-library cat-facility ${staggerClass} ${activeSelectedRoomId === room.roomId ? 'is-active' : ''}`
                : `in-room-badge cat-${escapeHtml(cat)} ${isMusicRoom ? 'is-music-room' : ''} ${isAvRoom ? 'is-av-room' : ''} ${staggerClass} ${activeSelectedRoomId === room.roomId ? 'is-active' : ''}`;

              const displayIcon = isAvRoom ? 'fa-guitar' : iconClass;

              const badgeIcon = L.divIcon({
                className: 'in-room-badge-container',
                html: `
                  <div class="${badgeClass}" data-room-id="${escapeHtml(room.roomId)}">
                    <span class="badge-icon"><i class="fas ${escapeHtml(displayIcon)}"></i></span>
                    <span class="badge-text">${escapeHtml(projectTitle)}</span>
                    ${(pinModel && pinModel.hasMobileOrder) ? '<span class="badge-order-bolt" title="モバイルオーダー対応"><i class="fas fa-bolt"></i></span>' : ''}
                  </div>
                `,
                iconSize: [0, 0],
                iconAnchor: [0, 0]
              });

              const badgeMarker = L.marker(centroid, {
                icon: badgeIcon,
                pane: 'markerPane',
                interactive: false
              });

              floorVectorLayerGroup.addLayer(badgeMarker);
            }

            polygonLayerMap.set(room.roomId, poly);
            floorVectorLayerGroup.addLayer(poly);
          });
        }

        renderPins();
      }

      // ==========================================================================
      // Pin Marker Rendering (Filtered by Floor & Category)
      // ==========================================================================
      function renderPins() {
        pinLayerGroup.clearLayers();

        const filteredPins = joinedPins.filter(pin => {
          const isIndoorMode = (currentFloor !== 'outdoor');

          if (!isIndoorMode) {
            // 屋外・全景モード: 体育館は常時ポリゴンとして描画されるため外部ピンはスキップ
            if (pin.roomId === 'room_gym_main') return false;
            // 屋外スポット（テント、インフラ設備）をすべて表示
            if (pin.type !== 'spot') return false;
          } else {
            // 校舎内モード (1F〜5F)
            const floorNum = parseInt(currentFloor, 10);

            // 1. 屋内教室: インルームバッジで直接描画されるため外部ピンはスキップ
            if (pin.type === 'room') return false;

            // 2. 体育館: 全フロア常時ポリゴン＋インルームバッジで描画されるため外部ピンはスキップ
            if (pin.roomId === 'room_gym_main') return false;

            // 3. 外の販売団体（中庭模擬店テントB〜F・昇降口前など）: 校舎内モードでも常時表示！
            const isOutdoorVendor = (pin.type === 'spot' && (pin.category === 'cooking' || pin.category === 'food' || pin.category === 'shop' || (pin.projects && pin.projects.length > 0)));

            // 4. 各階のお手洗い（屋内設備）
            const isIndoorToilet = (pin.type === 'facility' && pin.floor === floorNum);

            if (!isOutdoorVendor && !isIndoorToilet) {
              return false;
            }
          }

          // Category check (南陵祭 公式4大ジャンル: 模擬店・調理販売・展示・ステージ)
          if (currentCategory !== 'all') {
            const matchPrimary = pin.category === currentCategory || (currentCategory === 'cooking' && pin.category === 'food');
            const matchProject = pin.projects && pin.projects.some(p => getProjectCategory(p) === currentCategory);
            if (!matchPrimary && !matchProject) return false;
          }

          return true;
        });

        filteredPins.forEach(pin => {
          const meta = CATEGORY_META[pin.category] || CATEGORY_META.facility;
          const iconClass = (pin.rawSpot && pin.rawSpot.icon) ? pin.rawSpot.icon : meta.icon;
          const labelText = pin.projects.length > 0
            ? (pin.projects.length === 1 ? pin.projects[0].name : `${pin.name} (${pin.projects.length})`)
            : pin.name;

          const isFacility = pin.isFacility === true;
          const iconSize = isFacility ? [26, 26] : [36, 41];
          const iconAnchor = isFacility ? [13, 13] : [18, 41];

          const toiletGenderClass = pin.toiletGender === 'female' ? 'is-toilet-female' : (pin.toiletGender === 'male' ? 'is-toilet-male' : '');

          const customIcon = L.divIcon({
            className: 'custom-map-pin-container',
            html: `
              <div class="custom-map-pin cat-${escapeHtml(pin.category)} ${isFacility ? 'is-facility' : ''} ${toiletGenderClass} ${pin.isMulti ? 'is-multi' : ''} ${pin.hasMobileOrder ? 'has-order' : ''} ${activeSelectedRoomId === pin.roomId ? 'is-active' : ''}" data-room-id="${escapeHtml(pin.roomId)}" title="${escapeHtml(labelText)}">
                <div class="pin-label">${escapeHtml(labelText)}</div>
                <div class="pin-body">
                  <i class="fas ${escapeHtml(iconClass)}"></i>
                  ${pin.hasMobileOrder ? '<span class="pin-badge-order" title="モバイルオーダー対応"><i class="fas fa-bolt"></i></span>' : ''}
                  ${pin.isMulti ? `<span class="pin-badge-count" title="${pin.projects.length}企画">${pin.projects.length}</span>` : ''}
                </div>
                ${!isFacility ? '<div class="pin-arrow"></div>' : ''}
              </div>
            `,
            iconSize: iconSize,
            iconAnchor: iconAnchor
          });

          const marker = L.marker(pin.coord, {
            icon: customIcon,
            pane: 'markerPane'
          });

          // Facility pins show sleek tooltip on hover, keeping the main map free of text noise
          if (isFacility) {
            marker.bindTooltip(labelText, {
              direction: 'top',
              offset: [0, -14],
              className: 'facility-tooltip'
            });
          }

          marker.on('click', (e) => {
            if (e && e.originalEvent) {
              L.DomEvent.stopPropagation(e);
            }
            selectRoom(pin.roomId, true);
          });

          pinLayerGroup.addLayer(marker);
        });

        // Update Polygon opacity based on category filter
        polygonLayerMap.forEach((poly, roomId) => {
          const pin = joinedPins.find(p => p.roomId === roomId);
          if (!pin) return;

          let matches = (currentCategory === 'all');
          if (!matches) {
            matches = (pin.category === currentCategory || (currentCategory === 'cooking' && pin.category === 'food') || (pin.projects && pin.projects.some(p => getProjectCategory(p) === currentCategory)));
          }

          poly.setStyle({
            fillOpacity: matches ? (activeSelectedRoomId === roomId ? 0.75 : 0.45) : 0.08,
            opacity: matches ? 1.0 : 0.2
          });
        });
      }

      // ==========================================================================
      // Room Selection & Sheet Presentation
      // ==========================================================================
      function selectRoom(roomId, openSheet = true) {
        activeSelectedRoomId = roomId;

        const targetPin = joinedPins.find(p => p.roomId === roomId);
        if (!targetPin) return;

        // Switch floor if not currently matching (handles indoor-to-indoor and outdoor-to-indoor)
        // 体育館 (room_gym_main) は全階共通オブジェクトのため閲覧中フロアを強制変更しない
        if (roomId !== 'room_gym_main' && targetPin.floor && currentFloor !== targetPin.floor.toString()) {
          setFloor(targetPin.floor.toString());
        }

        // Highlight Vector Polygon
        unhighlightActivePolygon();
        const poly = polygonLayerMap.get(roomId);
        if (poly) {
          poly.setStyle({
            weight: 3,
            fillOpacity: 0.75,
            color: '#ff0080'
          });
          if (poly.getElement()) {
            poly.getElement().classList.add('is-active');
          }
        }

        // Pan map smoothly to the pin
        if (map && targetPin.coord) {
          map.panTo(targetPin.coord, { animate: true, duration: 0.6 });
        }

        // Render Sheet Content
        renderBottomSheetContent(targetPin);

        if (openSheet && bottomSheet) {
          const venueEvents = getVenueStageEvents(targetPin);
          if (venueEvents && venueEvents.length > 0) {
            bottomSheet.snapTo(bottomSheet.STATES.EXPANDED);
          } else {
            bottomSheet.snapTo(bottomSheet.STATES.PEEK);
          }
        }

        // Refresh pin and in-room-badge active classes
        document.querySelectorAll('.custom-map-pin, .in-room-badge').forEach(el => {
          const rId = el.getAttribute('data-room-id');
          el.classList.toggle('is-active', rId === roomId);
        });
      }

      function unhighlightActivePolygon() {
        polygonLayerMap.forEach((poly) => {
          poly.setStyle({
            weight: 2,
            fillOpacity: 0.55,
            color: poly._origColor || '#7c5cff',
            fillColor: poly._origFillColor || '#7c5cff'
          });
          if (poly.getElement()) {
            poly.getElement().classList.remove('is-active');
          }
        });
        document.querySelectorAll('.in-room-badge.is-active').forEach(el => {
          el.classList.remove('is-active');
        });
      }

      // ==========================================================================
      // Stage Venue & Timetable Helpers (Gym, Music Room, AV Room)
      // ==========================================================================
      function parseStartTime(timeStr) {
        if (!timeStr) return 0;
        const m = timeStr.match(/^(\d{1,2}):(\d{2})/);
        if (m) {
          return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
        }
        return 0;
      }

      function getVenueStageEvents(pinModel, project = null) {
        if (typeof stageData === 'undefined' || !Array.isArray(stageData)) return [];

        const rId = (pinModel && pinModel.roomId) || (project && project.roomId) || '';
        const pName = (pinModel && pinModel.name) || '';
        const projPlace = (project && project.place) || '';
        const projCat = (project && project.category) || '';

        const isGym = rId === 'room_gym_main' || pName.includes('体育館') || projPlace.includes('体育館');
        const isMusic = rId === 'special_room_337807_4f' || pName.includes('音楽室') || projPlace.includes('音楽室');
        const isAv = pName.includes('視聴覚') || projPlace.includes('視聴覚') || rId.includes('av');

        let matched = [];
        if (isGym) {
          matched = stageData.filter(s => s.place && s.place.includes('体育館'));
        } else if (isMusic) {
          matched = stageData.filter(s => s.place && s.place.includes('音楽室'));
        } else if (isAv) {
          matched = stageData.filter(s => s.place && s.place.includes('視聴覚'));
        } else {
          // 汎用マッチング（pinModel.name または project.place）
          if (pName) {
            matched = stageData.filter(s => s.place && (s.place.includes(pName) || pName.includes(s.place)));
          }
          if (matched.length === 0 && projPlace) {
            matched = stageData.filter(s => s.place && (s.place.includes(projPlace) || projPlace.includes(s.place)));
          }
        }

        // それでも該当なしでステージ企画の場合、その企画のグループ名やIDで出演枠を検索
        if (matched.length === 0 && (projCat === 'stage' || (project && project.tags && project.tags.includes('ステージ')))) {
          matched = stageData.filter(s => s.groupName === project.groupName || s.id === project.id || (project.name && s.name && (project.name.includes(s.name) || s.name.includes(project.name))));
        }

        // 時刻昇順にソート（同一日内で時系列）
        return matched.slice().sort((a, b) => {
          if (a.day !== b.day) return (a.day || 1) - (b.day || 1);
          return parseStartTime(a.time) - parseStartTime(b.time);
        });
      }

      function getVenueStageLabel(pinModel, project = null) {
        const rId = (pinModel && pinModel.roomId) || (project && project.roomId) || '';
        const pName = (pinModel && pinModel.name) || '';
        const projPlace = (project && project.place) || '';

        if (rId === 'room_gym_main' || pName.includes('体育館') || projPlace.includes('体育館')) {
          return '体育館';
        }
        if (rId === 'special_room_337807_4f' || pName.includes('音楽室') || projPlace.includes('音楽室')) {
          return '特別棟 4F 音楽室';
        }
        if (pName.includes('視聴覚') || projPlace.includes('視聴覚') || rId.includes('av') || rId === 'room_admin_301_av') {
          return '管理棟 3F 視聴覚室';
        }
        if (projPlace) return projPlace;
        if (pinModel) {
          return (pinModel.roomId === 'room_gym_main' || pinModel.type === 'spot')
            ? pinModel.name
            : `${pinModel.floor}F ${pinModel.name}`;
        }
        return 'ステージ会場';
      }

      function renderTimelineListItems(events, currentProjectId = null) {
        if (!events || events.length === 0) {
          return '<div class="timeline-empty-state"><i class="fas fa-calendar-xmark" style="margin-right: 6px;"></i>本日の公演予定はありません</div>';
        }

        return events.map(ev => {
          // 関連企画ID（detail.html用）
          let linkId = ev.id;
          let isCurrent = false;

          if (typeof projectData !== 'undefined' && Array.isArray(projectData)) {
            const matched = projectData.find(p => p.groupName === ev.groupName || (p.name && ev.name && (p.name.includes(ev.name) || ev.name.includes(p.name))));
            if (matched) {
              linkId = matched.id;
              if (currentProjectId && matched.id === currentProjectId) {
                isCurrent = true;
              }
            }
          }
          if (currentProjectId && (ev.id === currentProjectId || ev.groupName === currentProjectId)) {
            isCurrent = true;
          }

          return `
            <div class="stage-timeline-item">
              <span class="timeline-time-badge"><i class="far fa-clock"></i> ${escapeHtml(ev.time || '')}</span>
              <div class="stage-timeline-card timeline-card ${isCurrent ? 'is-current-project' : ''}">
                <div class="timeline-card-header">
                  <span class="timeline-group-name">${escapeHtml(ev.groupName || '')}</span>
                  ${isCurrent ? '<span class="badge-current-highlight"><i class="fas fa-star"></i> この企画の出演枠</span>' : ''}
                </div>
                <h4 class="timeline-event-name">${escapeHtml(ev.name || '')}</h4>
                ${ev.description ? `<p class="timeline-event-desc">${escapeHtml(ev.description)}</p>` : ''}
                <div class="timeline-card-actions">
                  <a href="detail.html?id=${encodeURIComponent(linkId)}" class="timeline-detail-link">
                    <span>企画の詳細を見る</span>
                    <i class="fas fa-chevron-right"></i>
                  </a>
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      function generateStageTimelineHtml(events, options = {}) {
        const {
          showHeader = false,
          venueLabel = 'ステージ会場',
          currentProjectId = null,
          prefix = 'stage_venue',
          locLabel = ''
        } = options;

        const day1Events = events.filter(s => s.day == 1);
        const day2Events = events.filter(s => s.day == 2);
        const defaultDay = day1Events.length > 0 ? 1 : (day2Events.length > 0 ? 2 : 1);

        const headerHtml = showHeader ? `
          <div class="project-sheet-header" style="margin-bottom: 8px;">
            <div class="project-tags-group">
              <span class="category-badge badge-stage"><i class="fas fa-music"></i> ステージ会場</span>
              <span class="location-badge"><i class="fas fa-location-dot"></i> ${escapeHtml(locLabel || venueLabel)}</span>
            </div>
            <button type="button" class="sheet-close-btn" id="closeDetailBtn" aria-label="閉じる">
              <i class="fas fa-times"></i>
            </button>
          </div>

          <div class="project-sheet-title-group" style="margin-bottom: 8px;">
            <div class="project-group-name" style="font-size: 11px; margin-bottom: 2px;">南陵祭2026 ステージプログラム</div>
            <h2 class="project-sheet-title" style="font-size: 17px; margin-bottom: 2px;">${escapeHtml(venueLabel)} タイムテーブル</h2>
            <p class="project-catchphrase" style="font-size: 11.5px; margin-bottom: 0;">全 ${events.length} 公演開催（Day 1: ${day1Events.length}件 / Day 2: ${day2Events.length}件）</p>
          </div>
        ` : `
          <div class="timeline-section-heading">
            <h3 class="section-subheading"><i class="fas fa-calendar-days"></i> ${escapeHtml(venueLabel)} 公演タイムテーブル</h3>
            <span class="timeline-count-chip">全 ${events.length} 公演</span>
          </div>
        `;

        return `
          <div class="stage-timeline-wrapper">
            ${headerHtml}

            <div class="stage-day-tabs-bar" data-prefix="${escapeHtml(prefix)}">
              <button type="button" class="stage-day-tab-btn ${defaultDay === 1 ? 'active' : ''}" data-day="1" data-prefix="${escapeHtml(prefix)}">
                <i class="fas fa-calendar-day"></i> DAY 1 (9/11 金) <span class="tab-count-badge">[${day1Events.length}]</span>
              </button>
              <button type="button" class="stage-day-tab-btn ${defaultDay === 2 ? 'active' : ''}" data-day="2" data-prefix="${escapeHtml(prefix)}">
                <i class="fas fa-calendar-day"></i> DAY 2 (9/12 土) <span class="tab-count-badge">[${day2Events.length}]</span>
              </button>
            </div>

            <div class="stage-timeline-content">
              <div class="stage-timeline-list" id="${prefix}_day1" style="display: ${defaultDay === 1 ? 'flex' : 'none'};">
                ${renderTimelineListItems(day1Events, currentProjectId)}
              </div>
              <div class="stage-timeline-list" id="${prefix}_day2" style="display: ${defaultDay === 2 ? 'flex' : 'none'};">
                ${renderTimelineListItems(day2Events, currentProjectId)}
              </div>
            </div>
          </div>
        `;
      }

      // ==========================================================================
      // Render Dynamic Bottom Sheet Content (Multi-Project Support)
      // ==========================================================================
      let currentSelectedPin = null;

      function renderBottomSheetContent(pinModel) {
        currentSelectedPin = pinModel;
        const container = document.getElementById('sheetContent');
        if (!container) return;

        // 1. Stage Venue Check (最優先判定！音楽室、体育館、視聴覚室などステージ公演会場)
        const venueStageEvents = getVenueStageEvents(pinModel);
        if (venueStageEvents.length > 0) {
          const venueLabel = getVenueStageLabel(pinModel);
          const locLabel = (pinModel.roomId === 'room_gym_main' || pinModel.type === 'spot')
            ? escapeHtml(pinModel.name)
            : `${escapeHtml(pinModel.floor)}F ${escapeHtml(pinModel.name)}`;

          container.innerHTML = generateStageTimelineHtml(venueStageEvents, {
            showHeader: true,
            venueLabel: venueLabel,
            locLabel: locLabel,
            prefix: 'main_venue_stage'
          });

          bindSheetEvents();
          return;
        }

        const projects = pinModel.projects || [];

        // 2. If no projects (Facility POI or Room without registered project)
        if (projects.length === 0) {
          const roomName = pinModel.name || '';
          const isLibrary = pinModel.roomId === 'room_501_library' || (pinModel.name && pinModel.name.includes('天空の図書館'));

          if (isLibrary) {
            container.innerHTML = `
              <div class="project-sheet-card">
                <div class="project-sheet-header">
                  <div class="project-tags-group">
                    <span class="category-badge badge-facility"><i class="fas fa-book-open"></i> 特別施設・図書室</span>
                    <span class="location-badge"><i class="fas fa-location-dot"></i> 生徒棟 5F</span>
                  </div>
                  <button type="button" class="sheet-close-btn" id="closeDetailBtn" aria-label="閉じる">
                    <i class="fas fa-times"></i>
                  </button>
                </div>

                <div class="project-sheet-title-group">
                  <div class="project-group-name">南陵高校 シンボル特別施設</div>
                  <h2 class="project-sheet-title">天空の図書館</h2>
                  <p class="project-catchphrase">「南陵高校のシンボル、最上階に広がる開放的な読書・展望空間」</p>
                </div>

                <div class="project-expanded-details">
                  <div class="project-description-section">
                    <h3 class="section-subheading"><i class="fas fa-book-open"></i> 施設案内</h3>
                    <p class="project-description-text">生徒棟最上階（5階）に位置する「天空の図書館」です。南陵祭の喧騒から離れて静かに読書を楽しめるほか、窓外のパノラマビューが広がる憩いのシンボルスポットです。休憩・鑑賞スペースとして一般開放されています。</p>
                  </div>
                </div>
              </div>
            `;
            bindSheetEvents();
            return;
          }

          const isRestricted = /(準備室|生徒会|進路|職員|倉庫|印刷|放送室|相談室)/.test(roomName);
          let descText = '南陵祭当日の校内施設・共用スペースです。';
          let badgeText = '施設・共用設備';
          let badgeIcon = 'fa-circle-info';
          let badgeClass = 'badge-facility';

          if (isRestricted) {
            descText = '※教職員・実行委員会関係者専用エリアです。一般来場者の方の立ち入りはご遠慮ください。';
            badgeText = '関係者専用・立入禁止';
            badgeIcon = 'fa-triangle-exclamation';
            badgeClass = 'badge-stage'; // warning color
          } else if (pinModel.rawSpot && pinModel.rawSpot.description) {
            descText = pinModel.rawSpot.description;
          } else if (/(トイレ|お手洗い)/.test(roomName)) {
            descText = '来場者向けのお手洗いです。綺麗にご利用ください。';
            badgeText = 'お手洗い';
            badgeIcon = 'fa-restroom';
          }

          const locLabel = (pinModel.roomId === 'room_gym_main' || pinModel.type === 'spot') ? escapeHtml(pinModel.name) : `${escapeHtml(pinModel.floor)}F ${escapeHtml(pinModel.name)}`;
          container.innerHTML = `
            <div class="project-sheet-card">
              <div class="project-sheet-header">
                <div class="project-tags-group">
                  <span class="category-badge ${badgeClass}"><i class="fas ${badgeIcon}"></i> ${escapeHtml(badgeText)}</span>
                  <span class="location-badge"><i class="fas fa-location-dot"></i> ${locLabel}</span>
                </div>
                <button type="button" class="sheet-close-btn" id="closeDetailBtn" aria-label="閉じる">
                  <i class="fas fa-times"></i>
                </button>
              </div>

              <div class="project-sheet-title-group">
                <div class="project-group-name">南陵高校 校内施設</div>
                <h2 class="project-sheet-title">${escapeHtml(pinModel.name)}</h2>
              </div>

              <div class="project-expanded-details">
                <div class="project-description-section">
                  <h3 class="section-subheading"><i class="fas ${badgeIcon}"></i> 案内情報</h3>
                  <p class="project-description-text" style="${isRestricted ? 'color: #ef4444; font-weight: 700;' : ''}">${escapeHtml(descText)}</p>
                </div>
              </div>
            </div>
          `;
          bindSheetEvents();
          return;
        }

        // 3. Single Project
        if (projects.length === 1) {
          container.innerHTML = generateProjectCardHtml(projects[0], pinModel);
          bindSheetEvents();
          return;
        }

        // 4. Multi-Project in same room (e.g. 作法室: 華道部 + 茶道部)
        let pillsHtml = `<div class="multi-project-pills-bar" id="multiProjectPills">`;
        projects.forEach((p, idx) => {
          pillsHtml += `<button type="button" class="multi-pill-btn ${idx === 0 ? 'active' : ''}" data-index="${idx}">${escapeHtml(p.groupName || p.name)}</button>`;
        });
        pillsHtml += `</div>`;

        let cardsHtml = `<div id="multiProjectCardsContainer">`;
        projects.forEach((p, idx) => {
          cardsHtml += `<div class="multi-project-slide" data-index="${idx}" style="display: ${idx === 0 ? 'block' : 'none'}">
            ${generateProjectCardHtml(p, pinModel, false)}
          </div>`;
        });
        cardsHtml += `</div>`;

        const multiLocLabel = (pinModel.roomId === 'room_gym_main' || pinModel.type === 'spot') ? escapeHtml(pinModel.name) : `${escapeHtml(pinModel.floor)}F ${escapeHtml(pinModel.name)}`;
        container.innerHTML = `
          <div class="multi-project-wrapper">
            <div class="project-sheet-header" style="margin-bottom: 8px;">
              <div class="project-tags-group">
                <span class="category-badge badge-shop"><i class="fas fa-layer-group"></i> ${escapeHtml(pinModel.name)} ${projects.length}企画 開催</span>
                <span class="location-badge"><i class="fas fa-location-dot"></i> ${multiLocLabel}</span>
              </div>
              <button type="button" class="sheet-close-btn" id="closeDetailBtn" aria-label="閉じる">
                <i class="fas fa-times"></i>
              </button>
            </div>
            ${pillsHtml}
            ${cardsHtml}
          </div>
        `;

        // Multi pills click event
        const pills = container.querySelectorAll('.multi-pill-btn');
        const slides = container.querySelectorAll('.multi-project-slide');

        pills.forEach(pill => {
          pill.addEventListener('click', () => {
            const idx = parseInt(pill.getAttribute('data-index'), 10);
            pills.forEach((pl, i) => pl.classList.toggle('active', i === idx));
            slides.forEach((sl, i) => sl.style.display = (i === idx ? 'block' : 'none'));
          });
        });

        bindSheetEvents();
      }

      function generateProjectCardHtml(project, pinModel, showCloseBtn = true) {
        const catKey = getProjectCategory(project);
        const catMeta = CATEGORY_META[catKey] || CATEGORY_META[project.category] || CATEGORY_META.exhibit;
        const placeStr = project.place || `${pinModel.floor}F ${pinModel.name}`;

        // Menu items HTML
        let menuHtml = '';
        if (project.menu && Array.isArray(project.menu) && project.menu.length > 0) {
          menuHtml = `
            <div class="project-menu-section">
              <h3 class="section-subheading"><i class="fas fa-book-open"></i> お品書き・メニュー</h3>
              <div class="project-menu-list">
                ${project.menu.map(item => `
                  <div class="project-menu-item ${item.isAvailable === false ? 'is-sold-out' : ''}">
                    <div class="menu-item-info">
                      <div class="menu-item-name">
                        <span>${escapeHtml(item.name)}</span>
                        ${item.isRecommended ? '<span class="badge-recommend">おすすめ</span>' : ''}
                        ${item.isAvailable === false ? '<span class="badge-sold-out">完売</span>' : ''}
                      </div>
                      ${item.description ? `<div class="menu-item-desc">${escapeHtml(item.description)}</div>` : ''}
                    </div>
                    <div class="menu-item-price">${item.isAvailable === false ? '完売' : escapeHtml(item.price || '')}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }

        // Stage Schedule items HTML (ステージ企画またはステージ会場の企画)
        let stageHtml = '';
        const isStageProject = (catKey === 'stage' || project.category === 'stage' || (project.tags && project.tags.includes('ステージ')));
        const venueStageEvents = isStageProject ? getVenueStageEvents(pinModel, project) : [];

        if (venueStageEvents.length > 0) {
          const venueLabel = getVenueStageLabel(pinModel, project);
          stageHtml = `
            <div class="project-description-section" style="margin-top: 14px;">
              ${generateStageTimelineHtml(venueStageEvents, {
                showHeader: false,
                venueLabel: venueLabel,
                currentProjectId: project.id,
                prefix: `proj_${project.id}`
              })}
            </div>
          `;
        }

        return `
          <div class="project-sheet-card">
            ${showCloseBtn ? `
              <div class="project-sheet-header">
                <div class="project-tags-group">
                  <span class="category-badge ${catMeta.badgeClass}"><i class="fas ${catMeta.icon}"></i> ${catMeta.name}</span>
                  <span class="location-badge"><i class="fas fa-location-dot"></i> ${escapeHtml(placeStr)}</span>
                  ${project.useMobileOrder ? '<span class="mobile-order-badge"><i class="fas fa-bolt"></i> モバイルオーダー対応</span>' : ''}
                </div>
                <button type="button" class="sheet-close-btn" id="closeDetailBtn" aria-label="閉じる">
                  <i class="fas fa-times"></i>
                </button>
              </div>
            ` : `
              <div class="project-tags-group">
                <span class="category-badge ${catMeta.badgeClass}"><i class="fas ${catMeta.icon}"></i> ${catMeta.name}</span>
                ${project.useMobileOrder ? '<span class="mobile-order-badge"><i class="fas fa-bolt"></i> モバイルオーダー</span>' : ''}
              </div>
            `}

            <div class="project-sheet-title-group">
              <div class="project-group-name">${escapeHtml(project.groupName || '')}</div>
              <h2 class="project-sheet-title">${escapeHtml(project.name || '')}</h2>
              ${project.catchphrase ? `<p class="project-catchphrase">「${escapeHtml(project.catchphrase)}」</p>` : ''}
            </div>

            <!-- Quick Action Buttons (Peek area) -->
            <div class="project-action-buttons">
              ${project.useMobileOrder ? `
                <a href="../pos/mobile-order.html?store=${encodeURIComponent(project.id)}" class="btn-action-mobile-order">
                  <div class="btn-icon"><i class="fas fa-bolt"></i></div>
                  <div class="btn-text">
                    <span class="sub">並ばずに受け取り可能</span>
                    <span class="main">モバイルオーダーで注文する</span>
                  </div>
                  <i class="fas fa-chevron-right arrow-icon"></i>
                </a>
              ` : ''}

              <a href="detail.html?id=${encodeURIComponent(project.id)}" class="btn-action-detail">
                <i class="fas fa-circle-info"></i>
                <span>企画の詳細情報を見る</span>
              </a>
            </div>

            <!-- Expanded Details Area -->
            <div class="project-expanded-details">
              <div class="project-description-section">
                <h3 class="section-subheading"><i class="fas fa-align-left"></i> 企画紹介</h3>
                <p class="project-description-text">${escapeHtml(project.description || '皆様のご来場をお待ちしております！')}</p>
              </div>

              ${menuHtml}
              ${stageHtml}
            </div>
          </div>
        `;
      }

      function bindSheetEvents() {
        const closeBtn = document.getElementById('closeDetailBtn');
        if (closeBtn && bottomSheet) {
          closeBtn.addEventListener('click', () => {
            bottomSheet.snapTo('collapsed');
          });
        }

        // Stage Day Tabs Switcher (会場メインタイムライン＆個別企画カード両対応)
        const container = document.getElementById('sheetContent');
        if (container) {
          const tabBtns = container.querySelectorAll('.stage-day-tab-btn');
          tabBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
              e.stopPropagation();
              const prefix = btn.getAttribute('data-prefix');
              const selectedDay = btn.getAttribute('data-day');
              const parentBar = btn.closest('.stage-day-tabs-bar');
              if (parentBar) {
                parentBar.querySelectorAll('.stage-day-tab-btn').forEach(b => {
                  b.classList.toggle('active', b === btn);
                });
              }
              const day1List = document.getElementById(`${prefix}_day1`);
              const day2List = document.getElementById(`${prefix}_day2`);
              if (day1List && day2List) {
                if (selectedDay === '1') {
                  day1List.style.display = 'flex';
                  day2List.style.display = 'none';
                } else {
                  day1List.style.display = 'none';
                  day2List.style.display = 'flex';
                }
              }
            });
          });
        }
      }

      // ==========================================================================
      // UI Controls: Floor Switcher, Category Chips, Zoom, MyLocation, Route
      // ==========================================================================
      function setFloor(floor) {
        currentFloor = floor;
        const container = document.querySelector('.map-app-container');

        const isIndoor = (floor !== 'outdoor');
        if (container) {
          container.classList.toggle('mode-indoor', isIndoor);
          container.classList.toggle('mode-outdoor', !isIndoor);
        }

        // Update Floor Switcher Buttons
        document.querySelectorAll('.floor-pill-btn').forEach(btn => {
          const isActive = btn.getAttribute('data-floor') === floor;
          btn.classList.toggle('active', isActive);
          btn.setAttribute('aria-checked', isActive ? 'true' : 'false');
        });

        renderStaticBaseLayers();
        renderFloorPolygons();
      }

      function setCategory(cat) {
        currentCategory = cat;

        // Update Filter Chips
        document.querySelectorAll('.filter-chip').forEach(chip => {
          const isActive = chip.getAttribute('data-category') === cat;
          chip.classList.toggle('active', isActive);
          chip.setAttribute('aria-selected', isActive ? 'true' : 'false');
        });

        renderPins();
      }

      function initUiControls() {
        // Floor Switcher
        document.querySelectorAll('.floor-pill-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            setFloor(btn.getAttribute('data-floor'));
          });
        });

        // Category Filter Chips
        document.querySelectorAll('.filter-chip').forEach(chip => {
          chip.addEventListener('click', () => {
            setCategory(chip.getAttribute('data-category'));
          });
        });

        // Zoom In / Out
        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomOutBtn = document.getElementById('zoomOutBtn');
        if (zoomInBtn && map) zoomInBtn.addEventListener('click', () => map.zoomIn());
        if (zoomOutBtn && map) zoomOutBtn.addEventListener('click', () => map.zoomOut());

        // Reset View to Campus Center
        const resetBtn = document.getElementById('resetViewBtn');
        if (resetBtn && map) {
          resetBtn.addEventListener('click', () => {
            map.flyTo(CAMPUS_CENTER, DEFAULT_ZOOM, { duration: 0.8 });
            showToast('キャンパス全景を表示しました');
          });
        }

        // Theme Change Observer (ハンバーガーメニュー等での切り替えを検知してマップ再描画)
        const themeObserver = new MutationObserver((mutations) => {
          for (const m of mutations) {
            if (m.attributeName === 'data-theme') {
              renderStaticBaseLayers();
              renderFloorPolygons();
              break;
            }
          }
        });
        themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

        // Geolocation / MyLocation Button (Ray-Casting PIP)
        const myLocationBtn = document.getElementById('myLocationBtn');
        if (myLocationBtn) {
          myLocationBtn.addEventListener('click', () => {
            if (!('geolocation' in navigator)) {
              showToast('お使いの端末は位置情報取得に対応していません');
              return;
            }

            showToast('現在地を取得中...');
            navigator.geolocation.getCurrentPosition(
              (pos) => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                const accuracy = pos.coords.accuracy;

                userLocationLayerGroup.clearLayers();

                // User Pulse Dot
                const userIcon = L.divIcon({
                  className: 'user-location-wrapper',
                  html: '<div class="user-location-marker"></div>',
                  iconSize: [20, 20],
                  iconAnchor: [10, 10]
                });

                const userMarker = L.marker([lat, lng], {
                  icon: userIcon,
                  pane: 'userLocationPane'
                });
                userLocationLayerGroup.addLayer(userMarker);

                // Accuracy Circle
                if (accuracy && accuracy < 500) {
                  const circle = L.circle([lat, lng], {
                    radius: accuracy,
                    pane: 'userLocationPane',
                    color: '#007aff',
                    weight: 1,
                    fillColor: '#007aff',
                    fillOpacity: 0.12
                  });
                  userLocationLayerGroup.addLayer(circle);
                }

                const insideCampus = isPointInCampus(lat, lng);
                if (insideCampus) {
                  showToast('📍 校内にいます');
                  map.flyTo([lat, lng], 19, { duration: 1.0 });
                } else {
                  showToast('📍 校外にいます（アクセスルートをご利用ください）', 4000);
                  map.fitBounds(L.latLngBounds([[lat, lng], CAMPUS_CENTER]), {
                    padding: [60, 60],
                    duration: 1.0
                  });
                }
              },
              (err) => {
                console.warn('Geolocation failed:', err);
                showToast('位置情報の取得が許可されていないか、タイムアウトしました');
              },
              { enableHighAccuracy: true, timeout: 10000, maximumAge: 3000 }
            );
          });
        }

        // Access Route Modal & Options
        const routeModalBtn = document.getElementById('routeModalBtn');
        const routeModal = document.getElementById('routeModal');
        const closeRouteModalBtn = document.getElementById('closeRouteModalBtn');
        const clearRouteBtn = document.getElementById('clearRouteBtn');

        if (routeModalBtn && routeModal) {
          routeModalBtn.addEventListener('click', () => {
            setFloor('outdoor');
            routeModal.classList.add('active');
          });
        }
        if (closeRouteModalBtn && routeModal) {
          closeRouteModalBtn.addEventListener('click', () => {
            routeModal.classList.remove('active');
          });
        }
        if (clearRouteBtn && routeModal) {
          clearRouteBtn.addEventListener('click', () => {
            activeRouteLayerGroup.clearLayers();
            document.querySelectorAll('.route-option-card').forEach(c => c.classList.remove('active'));
            routeModal.classList.remove('active');
            showToast('ルート表示を解除しました');
          });
        }
        if (routeModal) {
          routeModal.addEventListener('click', (e) => {
            if (e.target === routeModal) {
              routeModal.classList.remove('active');
            }
          });
        }
        window.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' || e.key === 'Esc') {
            if (routeModal && routeModal.classList.contains('active')) {
              routeModal.classList.remove('active');
            }
          }
        });

        // Window Resize & Orientation Change Map Size Invalidation
        window.addEventListener('resize', () => {
          if (map) {
            map.invalidateSize();
          }
          if (bottomSheet) {
            bottomSheet.handleResize();
          }
        });

        window.addEventListener('orientationchange', () => {
          setTimeout(() => {
            if (map) {
              map.invalidateSize();
            }
            if (bottomSheet) {
              bottomSheet.handleResize();
            }
          }, 150);
        });
      }

      // ==========================================================================
      // Dynamic Route Options Rendering in Modal
      // ==========================================================================
      function renderRouteOptionCards() {
        const container = document.getElementById('routeOptions');
        if (!container || !campusData || !Array.isArray(campusData.accessRoutes)) return;

        if (campusData.accessRoutes.length === 0) {
          container.innerHTML = '<div style="padding: 16px; text-align: center; color: var(--text-sub); font-size: 13px;">登録されたアクセスルートがありません</div>';
          return;
        }

        const getRouteIcon = (route) => {
          if (route.icon) return route.icon;
          if (route.name.includes('日野中央公園')) return 'fas fa-tree';
          if (route.name.includes('日野小学校')) return 'fas fa-graduation-cap';
          return 'fas fa-bus';
        };

        container.innerHTML = campusData.accessRoutes.map(route => {
          const iconClass = getRouteIcon(route);
          const subText = route.subName || `${route.startPoint ? route.startPoint.name : '出発地'} 〜 正門 (${route.distanceMeters || ''}m)`;
          return `
            <button type="button" class="route-option-card" data-route-id="${escapeHtml(route.id)}">
              <div class="route-icon-box" style="background: ${escapeHtml(route.color || '#3b82f6')};">
                <i class="${escapeHtml(iconClass)}"></i>
              </div>
              <div class="route-info">
                <div class="route-name">${escapeHtml(route.name)} (徒歩${escapeHtml(route.timeMinutes || 5)}分)</div>
                <div class="route-sub">${escapeHtml(subText)}</div>
              </div>
            </button>
          `;
        }).join('');

        // イベントリスナーの登録
        container.querySelectorAll('.route-option-card').forEach(card => {
          card.addEventListener('click', () => {
            const routeId = card.getAttribute('data-route-id');
            container.querySelectorAll('.route-option-card').forEach(c => c.classList.remove('active'));
            card.classList.add('active');
            renderAccessRouteById(routeId);
            const routeModal = document.getElementById('routeModal');
            if (routeModal) routeModal.classList.remove('active');
          });
        });
      }

      // ==========================================================================
      // Access Route Rendering (Casing, Core, Correct Badges & fitBounds)
      // ==========================================================================
      function renderAccessRouteById(routeId) {
        setFloor('outdoor');
        if (!campusData || !campusData.accessRoutes) return;
        const route = campusData.accessRoutes.find(r => r.id === routeId);
        if (!route || !route.polyline || route.polyline.length === 0) return;

        activeRouteLayerGroup.clearLayers();

        const routeCoords = route.polyline;
        const isDarkMode = document.documentElement.getAttribute('data-theme') === 'dark';

        // 1. Casing Outer Polyline (Road highlight border)
        const casing = L.polyline(routeCoords, {
          pane: 'routePane',
          weight: 8,
          color: isDarkMode ? '#0f172a' : '#ffffff',
          opacity: 0.95,
          lineCap: 'round',
          lineJoin: 'round'
        });

        // 2. Core Inner Polyline
        const core = L.polyline(routeCoords, {
          pane: 'routePane',
          weight: 5,
          color: route.color || '#3b82f6',
          opacity: 1.0,
          lineCap: 'round',
          lineJoin: 'round',
          className: 'access-route-neon'
        });

        // 3. 正門と出発地の厳密な判定とバッジ配置
        // 南陵高校 正門の基準座標: [35.385818, 139.586002]
        const MAIN_GATE_COORD = [35.385818, 139.586002];
        const distToGate = (pt) => Math.hypot(pt[0] - MAIN_GATE_COORD[0], pt[1] - MAIN_GATE_COORD[1]);

        const firstPt = routeCoords[0];
        const lastPt = routeCoords[routeCoords.length - 1];
        const firstIsGate = distToGate(firstPt) < distToGate(lastPt);

        // 正門側とバス停側の座標を決定
        const gateLatLng = (route.endPoint && route.endPoint.latlng) || (firstIsGate ? firstPt : lastPt);
        const busLatLng = (route.startPoint && route.startPoint.latlng) || (firstIsGate ? lastPt : firstPt);

        const startName = (route.startPoint && route.startPoint.name) || route.name.replace(/アクセスルート.*$/, '').trim() || '出発地';
        const endName = (route.endPoint && route.endPoint.name) || '南陵高校 正門';

        // 出発地（バス停）バッジ
        const startIcon = L.divIcon({
          className: 'route-badge-marker',
          html: `<div class="route-badge start" style="border-color:${escapeHtml(route.color || '#3b82f6')}">
                   <i class="fas fa-bus" style="color:${escapeHtml(route.color || '#3b82f6')}"></i>
                   <span>${escapeHtml(startName)}</span>
                   <span class="route-min">${escapeHtml(route.timeMinutes || 5)}分</span>
                 </div>`,
          iconSize: [170, 32],
          iconAnchor: [85, 16]
        });
        const startMarker = L.marker(busLatLng, { icon: startIcon, pane: 'markerPane' });

        // 到着地（正門）バッジ
        const endIcon = L.divIcon({
          className: 'route-badge-marker',
          html: `<div class="route-badge end" style="border-color:#ef4444">
                   <i class="fas fa-school" style="color:#ef4444"></i>
                   <span>${escapeHtml(endName)}</span>
                 </div>`,
          iconSize: [130, 32],
          iconAnchor: [65, 16]
        });
        const endMarker = L.marker(gateLatLng, { icon: endIcon, pane: 'markerPane' });

        activeRouteLayerGroup.addLayer(casing);
        activeRouteLayerGroup.addLayer(core);
        activeRouteLayerGroup.addLayer(startMarker);
        activeRouteLayerGroup.addLayer(endMarker);

        // 5. Fit camera bounds
        map.fitBounds(L.latLngBounds(routeCoords), {
          paddingTopLeft: [90, 30],
          paddingBottomRight: [30, 30],
          maxZoom: 18,
          animate: true,
          duration: 0.8
        });

        showToast(`🚩 ${escapeHtml(route.name)} を表示しました（徒歩${escapeHtml(route.timeMinutes)}分）`);
      }

      // ==========================================================================
      // Firestore Realtime Menu Sync (Zero-Wait Hybrid Architecture)
      // ==========================================================================
      async function syncFirestoreMenuData() {
        try {
          const { db } = await import("./auth.js");
          const { collection, getDocs } = await import("https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js");

          const itemsSnap = await getDocs(collection(db, "items"));
          if (itemsSnap.empty) return;

          const itemsByStore = new Map();
          itemsSnap.forEach(d => {
            const item = d.data();
            if (item.storeId) {
              if (!itemsByStore.has(item.storeId)) {
                itemsByStore.set(item.storeId, new Map());
              }
              itemsByStore.get(item.storeId).set(item.name, item);
            }
          });

          let updated = false;

          // Update joinedPins model
          if (Array.isArray(joinedPins)) {
            joinedPins.forEach(pin => {
              if (pin.projects && Array.isArray(pin.projects)) {
                pin.projects.forEach(proj => {
                  const storeItems = itemsByStore.get(proj.id);
                  if (storeItems && proj.menu && Array.isArray(proj.menu)) {
                    proj.menu = proj.menu.map(staticItem => {
                      const dbItem = storeItems.get(staticItem.name);
                      if (dbItem) {
                        updated = true;
                        return {
                          ...staticItem,
                          isAvailable: dbItem.isAvailable !== false,
                          price: dbItem.price ? (typeof dbItem.price === 'number' ? `${dbItem.price}円` : dbItem.price) : staticItem.price,
                          description: dbItem.description || staticItem.description
                        };
                      }
                      return staticItem;
                    });
                  }
                });
              }
            });
          }

          // Update global projectData cache
          if (typeof projectData !== 'undefined' && Array.isArray(projectData)) {
            projectData.forEach(proj => {
              const storeItems = itemsByStore.get(proj.id);
              if (storeItems && proj.menu && Array.isArray(proj.menu)) {
                proj.menu = proj.menu.map(staticItem => {
                  const dbItem = storeItems.get(staticItem.name);
                  if (dbItem) {
                    return {
                      ...staticItem,
                      isAvailable: dbItem.isAvailable !== false,
                      price: dbItem.price ? (typeof dbItem.price === 'number' ? `${dbItem.price}円` : dbItem.price) : staticItem.price,
                      description: dbItem.description || staticItem.description
                    };
                  }
                  return staticItem;
                });
              }
            });
          }

          // Re-render currently opened bottom sheet if active
          if (updated && currentSelectedPin && bottomSheet && bottomSheet.currentState !== bottomSheet.STATES.COLLAPSED) {
            renderBottomSheetContent(currentSelectedPin);
          }
        } catch (err) {
          console.warn("Firestore menu sync notice:", err);
        }
      }

      // ==========================================================================
      // App Bootstrap
      // ==========================================================================
      async function bootstrap() {
        initMap();
        bottomSheet = new BottomSheetController();
        initUiControls();

        try {
          const response = await fetch('data/campus_map_data.json');
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          campusData = await response.json();
        } catch (err) {
          console.warn('Could not fetch campus_map_data.json via network, using static fallback:', err);
          // Safety Fallback (minimal structure if fetch failed)
          campusData = window.CAMPUS_MAP_DATA_FALLBACK || {
            metadata: { center: CAMPUS_CENTER, defaultZoom: 18 },
            buildings: [],
            outdoorAreas: [],
            spots: [],
            indoorFloors: {}
          };
        }

        // Access Route モーダルリストの動的生成
        renderRouteOptionCards();

        // Build Client-Side Model (Zero-DB Principle)
        const rawProjects = (typeof projectData !== 'undefined' && Array.isArray(projectData)) ? projectData : [];
        joinedPins = buildJoinedPinsModel(campusData, rawProjects);

        // Render Layers
        renderStaticBaseLayers();
        renderFloorPolygons();

        // Check URL parameter (?room=... or ?project=...)
        const urlParams = new URLSearchParams(window.location.search);
        const targetRoom = urlParams.get('room');
        const targetProject = urlParams.get('project') || urlParams.get('id');

        if (targetRoom) {
          selectRoom(targetRoom, true);
        } else if (targetProject) {
          const foundPin = joinedPins.find(p => p.projects && p.projects.some(pr => pr.id === targetProject));
          if (foundPin) {
            selectRoom(foundPin.roomId, true);
          }
        }

        // Non-blocking background sync with Firestore items
        syncFirestoreMenuData();
      }

      // Start on DOMContentLoaded
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootstrap);
      } else {
        bootstrap();
      }
    })();
  </script>

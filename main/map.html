      // ==========================================================================
      // Geometric Helper: Merge Adjacent Polygons for Seamless Corridors
      // ==========================================================================
      function mergeAdjacentPolygons(polygons, toleranceMeters = 0.5) {
        if (!polygons || polygons.length === 0) return [];
        const validPolys = polygons.filter(p => p && p.length >= 3);
        if (validPolys.length <= 1) return validPolys;

        const refLat = validPolys[0][0][0];
        const cosLat = Math.cos((refLat * Math.PI) / 180.0);
        const lat2m = 111132.954;
        const lng2m = 111132.954 * cosLat;

        const toXY = ([lat, lng]) => [
          (lng - validPolys[0][0][1]) * lng2m,
          (lat - validPolys[0][0][0]) * lat2m
        ];
        const toLatLng = ([x, y]) => [
          parseFloat((validPolys[0][0][0] + y / lat2m).toFixed(6)),
          parseFloat((validPolys[0][0][1] + x / lng2m).toFixed(6))
        ];

        let allEdges = [];
        validPolys.forEach((poly, polyIdx) => {
          const xy = poly.map(toXY);
          for (let i = 0; i < xy.length; i++) {
            const p1 = xy[i];
            const p2 = xy[(i + 1) % xy.length];
            allEdges.push({ p1, p2, polyIdx });
          }
        });

        const distSq = (a, b) => (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2;
        const tolSq = toleranceMeters * toleranceMeters;

        const isOppositeEdge = (e1, e2) => {
          return (distSq(e1.p1, e2.p2) <= tolSq && distSq(e1.p2, e2.p1) <= tolSq);
        };

        const sharedIndices = new Set();
        for (let i = 0; i < allEdges.length; i++) {
          for (let j = i + 1; j < allEdges.length; j++) {
            if (allEdges[i].polyIdx !== allEdges[j].polyIdx && isOppositeEdge(allEdges[i], allEdges[j])) {
              sharedIndices.add(i);
              sharedIndices.add(j);
            }
          }
        }

        const outerEdges = allEdges.filter((_, idx) => !sharedIndices.has(idx));
        if (outerEdges.length === 0) return validPolys;

        const mergedPolygons = [];
        const usedEdges = new Set();

        for (let startIdx = 0; startIdx < outerEdges.length; startIdx++) {
          if (usedEdges.has(startIdx)) continue;

          const loop = [];
          let currentIdx = startIdx;
          let iterations = 0;
          const maxIter = outerEdges.length * 2;

          while (currentIdx !== -1 && !usedEdges.has(currentIdx) && iterations < maxIter) {
            usedEdges.add(currentIdx);
            const edge = outerEdges[currentIdx];
            loop.push(edge.p1);

            let nextIdx = -1;
            let bestDist = tolSq * 4;

            for (let j = 0; j < outerEdges.length; j++) {
              if (!usedEdges.has(j)) {
                const d = distSq(edge.p2, outerEdges[j].p1);
                if (d <= bestDist) {
                  bestDist = d;
                  nextIdx = j;
                }
              }
            }

            currentIdx = nextIdx;
            iterations++;
          }

          if (loop.length >= 3) {
            const cleanedLoop = [];
            for (let i = 0; i < loop.length; i++) {
              const curr = loop[i];
              const next = loop[(i + 1) % loop.length];
              if (distSq(curr, next) > 0.04) {
                cleanedLoop.push(curr);
              }
            }
            if (cleanedLoop.length >= 3) {
              mergedPolygons.push(cleanedLoop.map(toLatLng));
            }
          }
        }

        return mergedPolygons.length > 0 ? mergedPolygons : validPolys;
      }

      // ==========================================================================
      // Vector Polygon Rendering (Filtered by Floor + Persistent Gym)
      // ==========================================================================
      function renderFloorPolygons() {
        floorVectorLayerGroup.clearLayers();
        polygonLayerMap.clear();

        // 1. 体育館（全フロア・屋外問わず常時表示される1つのインタラクティブ図形）
        const gymBldg = campusData.buildings && campusData.buildings.find(b => b.id === '体育館' || b.id === 'gym_bldg');
        if (gymBldg) {
          const gymPolyCoords = gymBldg.polygon || gymBldg.coordinates;

          const gymPoly = L.polygon(gymPolyCoords, {
            pane: 'indoorPane',
            interactive: true,
            color: '#6366f1',
            weight: 2.5,
            fillColor: '#ede9fe',
            fillOpacity: 0.85,
            className: 'room-polygon gym-polygon has-project cat-stage'
          });

          gymPoly._origColor = '#6366f1';
          gymPoly._origFillColor = '#ede9fe';

          gymPoly.on('click', (e) => {
            if (e && e.originalEvent) {
              L.DomEvent.stopPropagation(e);
            }
            selectRoom('room_gym_main', true);
          });

          // 体育館の幾何学的重心に「🎭 体育館」インルームバッジを配置
          const gymCentroid = calculatePolygonCentroid(gymPolyCoords);
          const gymBadgeIcon = L.divIcon({
            className: 'in-room-badge-container',
            html: `
              <div class="in-room-badge cat-stage ${activeSelectedRoomId === 'room_gym_main' ? 'is-active' : ''}" data-room-id="room_gym_main">
                <span class="badge-icon"><i class="fas fa-theater-masks"></i></span>
                <span class="badge-text">体育館</span>
              </div>
            `,
            iconSize: [0, 0],
            iconAnchor: [0, 0]
          });

          const gymBadgeMarker = L.marker(gymCentroid, {
            icon: gymBadgeIcon,
            pane: 'markerPane',
            interactive: false
          });

          polygonLayerMap.set('room_gym_main', gymPoly);
          floorVectorLayerGroup.addLayer(gymPoly);
          floorVectorLayerGroup.addLayer(gymBadgeMarker);
        }

        if (currentFloor === 'outdoor') {
          renderPins();
          return;
        }

        const floorData = campusData.indoorFloors[currentFloor];
        if (!floorData) {
          renderPins();
          return;
        }

        // Corridors & Hallways (Unified Seamless Merging for Connected Corridors) - Non-interactive background
        if (floorData.corridors && floorData.corridors.length > 0) {
          const normalCorrs = floorData.corridors.filter(c => !c.id?.includes('overpass') && !c.isOverpass);
          const overpassCorrs = floorData.corridors.filter(c => c.id?.includes('overpass') || c.isOverpass);

          // 1. Normal Corridors: Clean vector rendering (non-interactive)
          normalCorrs.forEach(corr => {
            const poly = L.polygon(corr.polygon || corr.coordinates, {
              pane: 'indoorPane',
              interactive: false,
              color: corr.strokeColor || '#64748b',
              weight: 1.5,
              fillColor: corr.color || '#cbd5e1',
              fillOpacity: 0.45,
              className: 'corridor-polygon'
            });
            floorVectorLayerGroup.addLayer(poly);
          });

          // 2. Overpasses (non-interactive)
          overpassCorrs.forEach(corr => {
            const poly = L.polygon(corr.polygon || corr.coordinates, {
              pane: 'overpassPane',
              interactive: false,
              color: corr.strokeColor || '#7e22ce',
              weight: 1.5,
              fillColor: corr.color || '#a855f7',
              fillOpacity: 0.7,
              className: 'corridor-overpass'
            });
            floorVectorLayerGroup.addLayer(poly);
          });
        }

        // Stairs & Vertical Connectors (non-interactive)
        const allStairs = [];
        Object.values(campusData.indoorFloors || {}).forEach(fl => {
          (fl.stairs || []).forEach(st => {
            if (st && st.id && !allStairs.some(existing => existing.id === st.id)) {
              allStairs.push(st);
            }
          });
        });
        const stairsToRender = (floorData.stairs && floorData.stairs.length > 0) ? floorData.stairs : allStairs;
        stairsToRender.forEach(stair => {
          const poly = L.polygon(stair.polygon || stair.coordinates, {
            pane: 'indoorPane',
            interactive: false,
            color: stair.strokeColor || '#c2410c',
            weight: 1.5,
            fillColor: stair.color || '#f97316',
            fillOpacity: 0.6,
            className: 'stairs-polygon'
          });
          floorVectorLayerGroup.addLayer(poly);
        });

        // Toilets & Restrooms (non-interactive background polygon; pins handle touch interaction)
        if (floorData.toilets) {
          floorData.toilets.forEach(toilet => {
            const poly = L.polygon(toilet.polygon || toilet.coordinates, {
              pane: 'indoorPane',
              interactive: false,
              color: toilet.strokeColor || '#0284c7',
              weight: 1,
              fillColor: toilet.color || '#38bdf8',
              fillOpacity: 0.5,
              className: 'toilet-polygon'
            });
            floorVectorLayerGroup.addLayer(poly);
          });
        }

        // Rooms & Classrooms (Rooms with projects become vibrant highlighted areas with in-room badges)
        if (floorData.rooms) {
          floorData.rooms.forEach(room => {
            const pinModel = joinedPins.find(p => p.roomId === room.roomId);
            const hasProject = !!(pinModel && pinModel.projects && pinModel.projects.length > 0);
            const cat = pinModel ? pinModel.category : (room.category || 'facility');
            const catMeta = CATEGORY_META[cat] || CATEGORY_META.exhibit;
            const catColor = catMeta.color;
            const iconClass = (pinModel && pinModel.rawSpot && pinModel.rawSpot.icon) ? pinModel.rawSpot.icon : catMeta.icon;

            const stroke = hasProject ? catColor : (room.strokeColor || '#94a3b8');
            const fill = hasProject ? catColor : (room.color || '#cbd5e1');

            const poly = L.polygon(room.polygon || room.coordinates, {
              pane: 'indoorPane',
              interactive: hasProject,
              color: stroke,
              weight: hasProject ? 2 : 1,
              fillColor: fill,
              fillOpacity: hasProject ? 0.55 : 0.2,
              className: `room-polygon ${hasProject ? `has-project cat-${cat}` : 'is-empty'}`
            });

            poly._origColor = stroke;
            poly._origFillColor = fill;

            if (hasProject) {
              poly.on('click', (e) => {
                if (e && e.originalEvent) {
                  L.DomEvent.stopPropagation(e);
                }
                selectRoom(room.roomId, true);
              });

              // Centroid In-Room Badge (Floor plan badge centered directly inside the classroom rectangle)
              const centroid = calculatePolygonCentroid(room.polygon || room.coordinates);
              const projectTitle = pinModel.projects.length === 1
                ? pinModel.projects[0].name
                : `${pinModel.name} (${pinModel.projects.length})`;

              const badgeIcon = L.divIcon({
                className: 'in-room-badge-container',
                html: `
                  <div class="in-room-badge cat-${escapeHtml(cat)} ${activeSelectedRoomId === room.roomId ? 'is-active' : ''}" data-room-id="${escapeHtml(room.roomId)}">
                    <span class="badge-icon"><i class="fas ${escapeHtml(iconClass)}"></i></span>
                    <span class="badge-text">${escapeHtml(projectTitle)}</span>
                    ${pinModel.hasMobileOrder ? '<span class="badge-order-bolt" title="モバイルオーダー対応"><i class="fas fa-bolt"></i></span>' : ''}
                  </div>
                `,
                iconSize: [0, 0],
                iconAnchor: [0, 0]
              });

              const badgeMarker = L.marker(centroid, {
                icon: badgeIcon,
                pane: 'markerPane',
                interactive: false
              });

              floorVectorLayerGroup.addLayer(badgeMarker);
            }

            polygonLayerMap.set(room.roomId, poly);
            floorVectorLayerGroup.addLayer(poly);
          });
        }

        renderPins();
      }

      // ==========================================================================
      // Pin Marker Rendering (Filtered by Floor & Category)
      // ==========================================================================
      function renderPins() {
        pinLayerGroup.clearLayers();

        const filteredPins = joinedPins.filter(pin => {
          const isIndoorMode = (currentFloor !== 'outdoor');

          if (!isIndoorMode) {
            // 屋外・全景モード: 体育館は常時ポリゴンとして描画されるため外部ピンはスキップ
            if (pin.roomId === 'room_gym_main') return false;
            // 屋外スポット（テント、インフラ設備）をすべて表示
            if (pin.type !== 'spot') return false;
          } else {
            // 校舎内モード (1F〜5F)
            const floorNum = parseInt(currentFloor, 10);

            // 1. 屋内教室: インルームバッジで直接描画されるため外部ピンはスキップ
            if (pin.type === 'room') return false;

            // 2. 体育館: 全フロア常時ポリゴン＋インルームバッジで描画されるため外部ピンはスキップ
            if (pin.roomId === 'room_gym_main') return false;

            // 3. 外の販売団体（中庭模擬店テントB〜F・昇降口前など）: 校舎内モードでも常時表示！
            const isOutdoorVendor = (pin.type === 'spot' && (pin.category === 'food' || pin.category === 'shop' || (pin.projects && pin.projects.length > 0)));

            // 4. 各階のお手洗い（屋内設備）
            const isIndoorToilet = (pin.type === 'facility' && pin.floor === floorNum);

            if (!isOutdoorVendor && !isIndoorToilet) {
              return false;
            }
          }

          // Category check
          if (currentCategory !== 'all') {
            const matchPrimary = pin.category === currentCategory;
            const matchProject = pin.projects && pin.projects.some(p => p.category === currentCategory);
            if (!matchPrimary && !matchProject) return false;
          }

          return true;
        });

        filteredPins.forEach(pin => {
          const meta = CATEGORY_META[pin.category] || CATEGORY_META.facility;
          const iconClass = (pin.rawSpot && pin.rawSpot.icon) ? pin.rawSpot.icon : meta.icon;
          const labelText = pin.projects.length > 0
            ? (pin.projects.length === 1 ? pin.projects[0].name : `${pin.name} (${pin.projects.length})`)
            : pin.name;

          const isFacility = pin.isFacility === true;
          const iconSize = isFacility ? [26, 26] : [36, 41];
          const iconAnchor = isFacility ? [13, 13] : [18, 41];

          const customIcon = L.divIcon({
            className: 'custom-map-pin-container',
            html: `
              <div class="custom-map-pin cat-${escapeHtml(pin.category)} ${isFacility ? 'is-facility' : ''} ${pin.isMulti ? 'is-multi' : ''} ${pin.hasMobileOrder ? 'has-order' : ''} ${activeSelectedRoomId === pin.roomId ? 'is-active' : ''}" data-room-id="${escapeHtml(pin.roomId)}" title="${escapeHtml(labelText)}">
                <div class="pin-label">${escapeHtml(labelText)}</div>
                <div class="pin-body">
                  <i class="fas ${escapeHtml(iconClass)}"></i>
                  ${pin.hasMobileOrder ? '<span class="pin-badge-order" title="モバイルオーダー対応"><i class="fas fa-bolt"></i></span>' : ''}
                  ${pin.isMulti ? `<span class="pin-badge-count" title="${pin.projects.length}企画">${pin.projects.length}</span>` : ''}
                </div>
                ${!isFacility ? '<div class="pin-arrow"></div>' : ''}
              </div>
            `,
            iconSize: iconSize,
            iconAnchor: iconAnchor
          });

          const marker = L.marker(pin.coord, {
            icon: customIcon,
            pane: 'markerPane'
          });

          // Facility pins show sleek tooltip on hover, keeping the main map free of text noise
          if (isFacility) {
            marker.bindTooltip(labelText, {
              direction: 'top',
              offset: [0, -14],
              className: 'facility-tooltip'
            });
          }

          marker.on('click', (e) => {
            if (e && e.originalEvent) {
              L.DomEvent.stopPropagation(e);
            }
            selectRoom(pin.roomId, true);
          });

          pinLayerGroup.addLayer(marker);
        });

        // Update Polygon opacity based on category filter
        polygonLayerMap.forEach((poly, roomId) => {
          const pin = joinedPins.find(p => p.roomId === roomId);
          if (!pin) return;

          let matches = (currentCategory === 'all');
          if (!matches) {
            matches = (pin.category === currentCategory || (pin.projects && pin.projects.some(p => p.category === currentCategory)));
          }

          poly.setStyle({
            fillOpacity: matches ? (activeSelectedRoomId === roomId ? 0.75 : 0.45) : 0.08,
            opacity: matches ? 1.0 : 0.2
          });
        });
      }

      // ==========================================================================
      // Room Selection & Sheet Presentation
      // ==========================================================================
      function selectRoom(roomId, openSheet = true) {
        activeSelectedRoomId = roomId;

        const targetPin = joinedPins.find(p => p.roomId === roomId);
        if (!targetPin) return;

        // Switch floor if not currently matching (handles indoor-to-indoor and outdoor-to-indoor)
        // 体育館 (room_gym_main) は全階共通オブジェクトのため閲覧中フロアを強制変更しない
        if (roomId !== 'room_gym_main' && targetPin.floor && currentFloor !== targetPin.floor.toString()) {
          setFloor(targetPin.floor.toString());
        }

        // Highlight Vector Polygon
        unhighlightActivePolygon();
        const poly = polygonLayerMap.get(roomId);
        if (poly) {
          poly.setStyle({
            weight: 3,
            fillOpacity: 0.75,
            color: '#ff0080'
          });
          if (poly.getElement()) {
            poly.getElement().classList.add('is-active');
          }
        }

        // Pan map smoothly to the pin
        if (map && targetPin.coord) {
          map.panTo(targetPin.coord, { animate: true, duration: 0.6 });
        }

        // Render Sheet Content
        renderBottomSheetContent(targetPin);

        if (openSheet && bottomSheet) {
          bottomSheet.snapTo('peek');
        }

        // Refresh pin and in-room-badge active classes
        document.querySelectorAll('.custom-map-pin, .in-room-badge').forEach(el => {
          const rId = el.getAttribute('data-room-id');
          el.classList.toggle('is-active', rId === roomId);
        });
      }

      function unhighlightActivePolygon() {
        polygonLayerMap.forEach((poly) => {
          poly.setStyle({
            weight: 2,
            fillOpacity: 0.55,
            color: poly._origColor || '#7c5cff',
            fillColor: poly._origFillColor || '#7c5cff'
          });
          if (poly.getElement()) {
            poly.getElement().classList.remove('is-active');
          }
        });
        document.querySelectorAll('.in-room-badge.is-active').forEach(el => {
          el.classList.remove('is-active');
        });
      }

      // ==========================================================================
      // Render Dynamic Bottom Sheet Content (Multi-Project Support)
      // ==========================================================================
      function renderBottomSheetContent(pinModel) {
        const container = document.getElementById('sheetContent');
        if (!container) return;

        const projects = pinModel.projects || [];

        // If no projects (Facility POI or Room without registered project)
        if (projects.length === 0) {
          const roomName = pinModel.name || '';
          const isRestricted = /(準備室|生徒会|進路|職員|倉庫|印刷|放送室|相談室)/.test(roomName);
          let descText = '南陵祭当日の校内施設・共用スペースです。';
          let badgeText = '施設・共用設備';
          let badgeIcon = 'fa-circle-info';
          let badgeClass = 'badge-facility';

          if (isRestricted) {
            descText = '※教職員・実行委員会関係者専用エリアです。一般来場者の方の立ち入りはご遠慮ください。';
            badgeText = '関係者専用・立入禁止';
            badgeIcon = 'fa-triangle-exclamation';
            badgeClass = 'badge-stage'; // warning color
          } else if (pinModel.rawSpot && pinModel.rawSpot.description) {
            descText = pinModel.rawSpot.description;
          } else if (/(トイレ|お手洗い)/.test(roomName)) {
            descText = '来場者向けのお手洗いです。綺麗にご利用ください。';
            badgeText = 'お手洗い';
            badgeIcon = 'fa-restroom';
          }

          const locLabel = (pinModel.roomId === 'room_gym_main' || pinModel.type === 'spot') ? escapeHtml(pinModel.name) : `${escapeHtml(pinModel.floor)}F ${escapeHtml(pinModel.name)}`;
          container.innerHTML = `
            <div class="project-sheet-card">
              <div class="project-sheet-header">
                <div class="project-tags-group">
                  <span class="category-badge ${badgeClass}"><i class="fas ${badgeIcon}"></i> ${escapeHtml(badgeText)}</span>
                  <span class="location-badge"><i class="fas fa-location-dot"></i> ${locLabel}</span>
                </div>
                <button type="button" class="sheet-close-btn" id="closeDetailBtn" aria-label="閉じる">
                  <i class="fas fa-times"></i>
                </button>
              </div>

              <div class="project-sheet-title-group">
                <div class="project-group-name">南陵高校 校内施設</div>
                <h2 class="project-sheet-title">${escapeHtml(pinModel.name)}</h2>
              </div>

              <div class="project-expanded-details">
                <div class="project-description-section">
                  <h3 class="section-subheading"><i class="fas ${badgeIcon}"></i> 案内情報</h3>
                  <p class="project-description-text" style="${isRestricted ? 'color: #ef4444; font-weight: 700;' : ''}">${escapeHtml(descText)}</p>
                </div>
              </div>
            </div>
          `;
          bindSheetEvents();
          return;
        }

        // Single Project
        if (projects.length === 1) {
          container.innerHTML = generateProjectCardHtml(projects[0], pinModel);
          bindSheetEvents();
          return;
        }

        // Multi-Project in same room (e.g. 体育館 / 作法室: 華道部 + 茶道部)
        let pillsHtml = `<div class="multi-project-pills-bar" id="multiProjectPills">`;
        projects.forEach((p, idx) => {
          pillsHtml += `<button type="button" class="multi-pill-btn ${idx === 0 ? 'active' : ''}" data-index="${idx}">${escapeHtml(p.groupName || p.name)}</button>`;
        });
        pillsHtml += `</div>`;

        let cardsHtml = `<div id="multiProjectCardsContainer">`;
        projects.forEach((p, idx) => {
          cardsHtml += `<div class="multi-project-slide" data-index="${idx}" style="display: ${idx === 0 ? 'block' : 'none'}">
            ${generateProjectCardHtml(p, pinModel, false)}
          </div>`;
        });
        cardsHtml += `</div>`;

        const multiLocLabel = (pinModel.roomId === 'room_gym_main' || pinModel.type === 'spot') ? escapeHtml(pinModel.name) : `${escapeHtml(pinModel.floor)}F ${escapeHtml(pinModel.name)}`;
        container.innerHTML = `
          <div class="multi-project-wrapper">
            <div class="project-sheet-header" style="margin-bottom: 8px;">
              <div class="project-tags-group">
                <span class="category-badge badge-shop"><i class="fas fa-layer-group"></i> ${escapeHtml(pinModel.name)} ${projects.length}企画 開催</span>
                <span class="location-badge"><i class="fas fa-location-dot"></i> ${multiLocLabel}</span>
              </div>
              <button type="button" class="sheet-close-btn" id="closeDetailBtn" aria-label="閉じる">
                <i class="fas fa-times"></i>
              </button>
            </div>
            ${pillsHtml}
            ${cardsHtml}
          </div>
        `;

        // Multi pills click event
        const pills = container.querySelectorAll('.multi-pill-btn');
        const slides = container.querySelectorAll('.multi-project-slide');

        pills.forEach(pill => {
          pill.addEventListener('click', () => {
            const idx = parseInt(pill.getAttribute('data-index'), 10);
            pills.forEach((pl, i) => pl.classList.toggle('active', i === idx));
            slides.forEach((sl, i) => sl.style.display = (i === idx ? 'block' : 'none'));
          });
        });

        bindSheetEvents();
      }

      function generateProjectCardHtml(project, pinModel, showCloseBtn = true) {
        const catMeta = CATEGORY_META[project.category] || CATEGORY_META.exhibit;
        const placeStr = project.place || `${pinModel.floor}F ${pinModel.name}`;

        // Menu items HTML
        let menuHtml = '';
        if (project.menu && Array.isArray(project.menu) && project.menu.length > 0) {
          menuHtml = `
            <div class="project-menu-section">
              <h3 class="section-subheading"><i class="fas fa-book-open"></i> お品書き・メニュー</h3>
              <div class="project-menu-list">
                ${project.menu.map(item => `
                  <div class="project-menu-item">
                    <div class="menu-item-info">
                      <div class="menu-item-name">
                        <span>${escapeHtml(item.name)}</span>
                        ${item.isRecommended ? '<span class="badge-recommend">おすすめ</span>' : ''}
                      </div>
                      ${item.description ? `<div class="menu-item-desc">${escapeHtml(item.description)}</div>` : ''}
                    </div>
                    <div class="menu-item-price">${escapeHtml(item.price || '')}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }

        // Stage Schedule items HTML
        let stageHtml = '';
        if (project.category === 'stage' && typeof stageData !== 'undefined') {
          const timetable = stageData.find(s => s.id === project.id || (s.stages && s.stages.some(st => st.id === project.id)));
          if (timetable) {
            stageHtml = `
              <div class="project-description-section">
                <h3 class="section-subheading"><i class="fas fa-clock"></i> 公演タイムテーブル</h3>
                <div class="stage-schedule-badge">
                  <i class="fas fa-microphone"></i> 本部ステージ・タイムテーブルにて配信中
                </div>
              </div>
            `;
          }
        }

        return `
          <div class="project-sheet-card">
            ${showCloseBtn ? `
              <div class="project-sheet-header">
                <div class="project-tags-group">
                  <span class="category-badge ${catMeta.badgeClass}"><i class="fas ${catMeta.icon}"></i> ${catMeta.name}</span>
                  <span class="location-badge"><i class="fas fa-location-dot"></i> ${escapeHtml(placeStr)}</span>
                  ${project.useMobileOrder ? '<span class="mobile-order-badge"><i class="fas fa-bolt"></i> モバイルオーダー対応</span>' : ''}
                </div>
                <button type="button" class="sheet-close-btn" id="closeDetailBtn" aria-label="閉じる">
                  <i class="fas fa-times"></i>
                </button>
              </div>
            ` : `
              <div class="project-tags-group">
                <span class="category-badge ${catMeta.badgeClass}"><i class="fas ${catMeta.icon}"></i> ${catMeta.name}</span>
                ${project.useMobileOrder ? '<span class="mobile-order-badge"><i class="fas fa-bolt"></i> モバイルオーダー</span>' : ''}
              </div>
            `}

            <div class="project-sheet-title-group">
              <div class="project-group-name">${escapeHtml(project.groupName || '')}</div>
              <h2 class="project-sheet-title">${escapeHtml(project.name || '')}</h2>
              ${project.catchphrase ? `<p class="project-catchphrase">「${escapeHtml(project.catchphrase)}」</p>` : ''}
            </div>

            <!-- Quick Action Buttons (Peek area) -->
            <div class="project-action-buttons">
              ${project.useMobileOrder ? `
                <a href="../pos/mobile-order.html?store=${encodeURIComponent(project.id)}" class="btn-action-mobile-order">
                  <div class="btn-icon"><i class="fas fa-bolt"></i></div>
                  <div class="btn-text">
                    <span class="sub">並ばずに受け取り可能</span>
                    <span class="main">モバイルオーダーで注文する</span>
                  </div>
                  <i class="fas fa-chevron-right arrow-icon"></i>
                </a>
              ` : ''}

              <a href="detail.html?id=${encodeURIComponent(project.id)}" class="btn-action-detail">
                <i class="fas fa-circle-info"></i>
                <span>企画の詳細情報を見る</span>
              </a>
            </div>

            <!-- Expanded Details Area -->
            <div class="project-expanded-details">
              <div class="project-description-section">
                <h3 class="section-subheading"><i class="fas fa-align-left"></i> 企画紹介</h3>
                <p class="project-description-text">${escapeHtml(project.description || '皆様のご来場をお待ちしております！')}</p>
              </div>

              ${menuHtml}
              ${stageHtml}
            </div>
          </div>
        `;
      }

      function bindSheetEvents() {
        const closeBtn = document.getElementById('closeDetailBtn');
        if (closeBtn && bottomSheet) {
          closeBtn.addEventListener('click', () => {
            bottomSheet.snapTo('collapsed');
          });
        }
      }

      // ==========================================================================
      // UI Controls: Floor Switcher, Category Chips, Zoom, MyLocation, Route
      // ==========================================================================
      function setFloor(floor) {
        currentFloor = floor;
        const container = document.querySelector('.map-app-container');

        const isIndoor = (floor !== 'outdoor');
        if (container) {
          container.classList.toggle('mode-indoor', isIndoor);
          container.classList.toggle('mode-outdoor', !isIndoor);
        }

        // Update Floor Switcher Buttons
        document.querySelectorAll('.floor-pill-btn').forEach(btn => {
          const isActive = btn.getAttribute('data-floor') === floor;
          btn.classList.toggle('active', isActive);
          btn.setAttribute('aria-checked', isActive ? 'true' : 'false');
        });

        renderStaticBaseLayers();
        renderFloorPolygons();
      }

      function setCategory(cat) {
        currentCategory = cat;

        // Update Filter Chips
        document.querySelectorAll('.filter-chip').forEach(chip => {
          const isActive = chip.getAttribute('data-category') === cat;
          chip.classList.toggle('active', isActive);
          chip.setAttribute('aria-selected', isActive ? 'true' : 'false');
        });

        // Update Floating Dock Active Badge
        const dockBadge = document.getElementById('dockCategoryActiveBadge');
        if (dockBadge) {
          const catNames = {
            all: 'すべて',
            food: '模擬店',
            exhibit: '展示',
            shop: '物販',
            stage: 'ステージ',
            facility: '施設'
          };
          dockBadge.textContent = catNames[cat] || 'すべて';
        }

        renderPins();
      }

      function initUiControls() {
        // Floating Dock & Tray (下からひょんっと出せる収納式フッター)
        const mapDock = document.getElementById('mapDock');
        const dockBackdrop = document.getElementById('dockBackdrop');
        const dockTrigger = document.getElementById('dockTrigger');
        const dockCloseBtn = document.getElementById('dockCloseBtn');
        const dockTrayHandle = document.getElementById('dockTrayHandle');

        function openDock() {
          if (!mapDock) return;
          mapDock.classList.add('is-open');
          if (dockBackdrop) dockBackdrop.classList.add('active');
          if (dockTrigger) dockTrigger.setAttribute('aria-expanded', 'true');
          // 企画詳細ボトムシートが開いている場合は収納して被りを防止
          if (bottomSheet && bottomSheet.currentState !== bottomSheet.STATES.COLLAPSED) {
            bottomSheet.snapTo(bottomSheet.STATES.COLLAPSED);
          }
        }

        function closeDock() {
          if (!mapDock) return;
          mapDock.classList.remove('is-open');
          if (dockBackdrop) dockBackdrop.classList.remove('active');
          if (dockTrigger) dockTrigger.setAttribute('aria-expanded', 'false');
        }

        function toggleDock() {
          if (!mapDock) return;
          if (mapDock.classList.contains('is-open')) {
            closeDock();
          } else {
            openDock();
          }
        }

        if (dockTrigger) dockTrigger.addEventListener('click', toggleDock);
        if (dockCloseBtn) dockCloseBtn.addEventListener('click', closeDock);
        if (dockTrayHandle) dockTrayHandle.addEventListener('click', closeDock);
        if (dockBackdrop) dockBackdrop.addEventListener('click', closeDock);

        // 地図タップ・ドラッグ開始で下部ドックを自動収納
        if (map) {
          map.on('click', closeDock);
          map.on('dragstart', closeDock);
        }

        // Floor Switcher
        document.querySelectorAll('.floor-pill-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            setFloor(btn.getAttribute('data-floor'));
          });
        });

        // Category Filter Chips
        document.querySelectorAll('.filter-chip').forEach(chip => {
          chip.addEventListener('click', () => {
            setCategory(chip.getAttribute('data-category'));
            // 選択後に自動収納（視界開放）
            setTimeout(closeDock, 200);
          });
        });

        // Zoom In / Out
        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomOutBtn = document.getElementById('zoomOutBtn');
        if (zoomInBtn && map) zoomInBtn.addEventListener('click', () => map.zoomIn());
        if (zoomOutBtn && map) zoomOutBtn.addEventListener('click', () => map.zoomOut());

        // Reset View to Campus Center
        const resetBtn = document.getElementById('resetViewBtn');
        if (resetBtn && map) {
          resetBtn.addEventListener('click', () => {
            map.flyTo(CAMPUS_CENTER, DEFAULT_ZOOM, { duration: 0.8 });
            showToast('キャンパス全景を表示しました');
          });
        }

        // Theme Toggle (Light / Dark)
        const themeBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        if (themeBtn) {
          themeBtn.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const nextTheme = isDark ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', nextTheme);
            try {
              localStorage.setItem('app-theme', nextTheme);
            } catch (e) {}
            if (themeIcon) {
              themeIcon.className = nextTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            }
            renderStaticBaseLayers();
            renderFloorPolygons();
            showToast(nextTheme === 'dark' ? '🌙 ダークモード' : '☀️ ライトモード', 1200);
          });

          // Sync initial icon
          const currentIsDark = document.documentElement.getAttribute('data-theme') === 'dark';
          if (themeIcon) {
            themeIcon.className = currentIsDark ? 'fas fa-sun' : 'fas fa-moon';
          }
        }

        // Geolocation / MyLocation Button (Ray-Casting PIP)
        const myLocationBtn = document.getElementById('myLocationBtn');
        if (myLocationBtn) {
          myLocationBtn.addEventListener('click', () => {
            if (!('geolocation' in navigator)) {
              showToast('お使いの端末は位置情報取得に対応していません');
              return;
            }

            showToast('現在地を取得中...');
            navigator.geolocation.getCurrentPosition(
              (pos) => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                const accuracy = pos.coords.accuracy;

                userLocationLayerGroup.clearLayers();

                // User Pulse Dot
                const userIcon = L.divIcon({
                  className: 'user-location-wrapper',
                  html: '<div class="user-location-marker"></div>',
                  iconSize: [20, 20],
                  iconAnchor: [10, 10]
                });

                const userMarker = L.marker([lat, lng], {
                  icon: userIcon,
                  pane: 'userLocationPane'
                });
                userLocationLayerGroup.addLayer(userMarker);

                // Accuracy Circle
                if (accuracy && accuracy < 500) {
                  const circle = L.circle([lat, lng], {
                    radius: accuracy,
                    pane: 'userLocationPane',
                    color: '#007aff',
                    weight: 1,
                    fillColor: '#007aff',
                    fillOpacity: 0.12
                  });
                  userLocationLayerGroup.addLayer(circle);
                }

                const insideCampus = isPointInCampus(lat, lng);
                if (insideCampus) {
                  showToast('📍 校内にいます');
                  map.flyTo([lat, lng], 19, { duration: 1.0 });
                } else {
                  showToast('📍 校外にいます（アクセスルートをご利用ください）', 4000);
                  map.fitBounds(L.latLngBounds([[lat, lng], CAMPUS_CENTER]), {
                    padding: [60, 60],
                    duration: 1.0
                  });
                }
              },
              (err) => {
                console.warn('Geolocation failed:', err);
                showToast('位置情報の取得が許可されていないか、タイムアウトしました');
              },
              { enableHighAccuracy: true, timeout: 10000, maximumAge: 3000 }
            );
          });
        }

        // Access Route Modal & Options
        const routeModalBtn = document.getElementById('routeModalBtn');
        const routeModal = document.getElementById('routeModal');
        const closeRouteModalBtn = document.getElementById('closeRouteModalBtn');
        const clearRouteBtn = document.getElementById('clearRouteBtn');

        if (routeModalBtn && routeModal) {
          routeModalBtn.addEventListener('click', () => {
            routeModal.classList.add('active');
          });
        }
        if (closeRouteModalBtn && routeModal) {
          closeRouteModalBtn.addEventListener('click', () => {
            routeModal.classList.remove('active');
          });
        }
        if (clearRouteBtn && routeModal) {
          clearRouteBtn.addEventListener('click', () => {
            activeRouteLayerGroup.clearLayers();
            document.querySelectorAll('.route-option-card').forEach(c => c.classList.remove('active'));
            routeModal.classList.remove('active');
            showToast('ルート表示を解除しました');
          });
        }
        if (routeModal) {
          routeModal.addEventListener('click', (e) => {
            if (e.target === routeModal) {
              routeModal.classList.remove('active');
            }
          });
        }
        window.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' || e.key === 'Esc') {
            if (routeModal && routeModal.classList.contains('active')) {
              routeModal.classList.remove('active');
            }
          }
        });

        document.querySelectorAll('.route-option-card').forEach(card => {
          card.addEventListener('click', () => {
            const routeId = card.getAttribute('data-route-id');
            document.querySelectorAll('.route-option-card').forEach(c => c.classList.remove('active'));
            card.classList.add('active');
            renderAccessRouteById(routeId);
            if (routeModal) routeModal.classList.remove('active');
          });
        });

        // Window Resize & Orientation Change Map Size Invalidation
        window.addEventListener('resize', () => {
          if (map) {
            map.invalidateSize();
          }
          if (bottomSheet) {
            bottomSheet.handleResize();
          }
        });

        window.addEventListener('orientationchange', () => {
          setTimeout(() => {
            if (map) {
              map.invalidateSize();
            }
            if (bottomSheet) {
              bottomSheet.handleResize();
            }
          }, 150);
        });
      }

      // ==========================================================================
      // Access Route Rendering (Catmull-Rom Multi-Line & fitBounds)
      // ==========================================================================
      function renderAccessRouteById(routeId) {
        if (!campusData || !campusData.accessRoutes) return;
        const route = campusData.accessRoutes.find(r => 
          r.id === routeId || 
          (routeId === 'route_yokodai' && (r.id === 'route_180112' || (r.name && r.name.includes('洋光台')))) ||
          (routeId === 'route_hino_park' && (r.id === 'route_290409' || (r.name && r.name.includes('日野中央公園')))) ||
          (routeId === 'route_hino_elem' && (r.id === 'route_875650' || (r.name && r.name.includes('日野小学校'))))
        );
        if (!route || !route.polyline || route.polyline.length === 0) return;

        activeRouteLayerGroup.clearLayers();

        const smoothedCoords = route.smooth ? getCatmullRomSpline(route.polyline, 0.5, 15) : route.polyline;
        const isDarkMode = document.documentElement.getAttribute('data-theme') === 'dark';

        // 1. Casing Outer Polyline
        const casing = L.polyline(smoothedCoords, {
          pane: 'routePane',
          weight: 8,
          color: isDarkMode ? '#0f172a' : '#ffffff',
          opacity: 0.95,
          lineCap: 'round',
          lineJoin: 'round'
        });

        // 2. Core Inner Polyline
        const core = L.polyline(smoothedCoords, {
          pane: 'routePane',
          weight: 5,
          color: route.color || '#eab308',
          opacity: 1.0,
          lineCap: 'round',
          lineJoin: 'round',
          className: 'access-route-neon'
        });

        // Safe Start & End Point Resolution
        const startPt = route.startPoint || {
          name: route.name ? route.name.replace(/アクセスルート.*$/, '').trim() : '出発地',
          latlng: route.polyline[0]
        };
        const endPt = route.endPoint || {
          name: '南陵高校 正門',
          latlng: route.polyline[route.polyline.length - 1]
        };

        // 3. Start Point Badge
        const startIcon = L.divIcon({
          className: 'route-badge-marker',
          html: `<div class="route-badge start" style="border-color:${escapeHtml(route.color || '#eab308')}">
                   <i class="fas fa-bus"></i>
                   <span>${escapeHtml(startPt.name || '出発地')}</span>
                   <span class="route-min">${escapeHtml(route.timeMinutes || 10)}分</span>
                 </div>`,
          iconSize: [160, 32],
          iconAnchor: [80, 16]
        });
        const startMarker = L.marker(startPt.latlng, { icon: startIcon, pane: 'markerPane' });

        // 4. End Point Badge (Main Gate)
        const endIcon = L.divIcon({
          className: 'route-badge-marker',
          html: `<div class="route-badge end">
                   <i class="fas fa-school"></i>
                   <span>${escapeHtml(endPt.name || '正門')}</span>
                 </div>`,
          iconSize: [130, 32],
          iconAnchor: [65, 16]
        });
        const endMarker = L.marker(endPt.latlng, { icon: endIcon, pane: 'markerPane' });

        activeRouteLayerGroup.addLayer(casing);
        activeRouteLayerGroup.addLayer(core);
        activeRouteLayerGroup.addLayer(startMarker);
        activeRouteLayerGroup.addLayer(endMarker);

        // 5. Fit camera bounds
        map.fitBounds(L.latLngBounds(route.polyline), {
          paddingTopLeft: [80, 24],
          paddingBottomRight: [24, 24],
          maxZoom: 18,
          animate: true,
          duration: 0.8
        });

        showToast(`🚩 ${escapeHtml(route.name)}を表示しました（${escapeHtml(route.timeMinutes)}分）`);
      }

      // ==========================================================================
      // App Bootstrap
      // ==========================================================================
      async function bootstrap() {
        initMap();
        bottomSheet = new BottomSheetController();
        initUiControls();

        try {
          const response = await fetch('data/campus_map_data.json');
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          campusData = await response.json();
        } catch (err) {
          console.warn('Could not fetch campus_map_data.json via network, using static fallback:', err);
          // Safety Fallback (minimal structure if fetch failed)
          campusData = window.CAMPUS_MAP_DATA_FALLBACK || {
            metadata: { center: CAMPUS_CENTER, defaultZoom: 18 },
            buildings: [],
            outdoorAreas: [],
            spots: [],
            indoorFloors: {}
          };
        }

        // Build Client-Side Model (Zero-DB Principle)
        const rawProjects = (typeof projectData !== 'undefined' && Array.isArray(projectData)) ? projectData : [];
        joinedPins = buildJoinedPinsModel(campusData, rawProjects);

        // Render Layers
        renderStaticBaseLayers();
        renderFloorPolygons();

        // Check URL parameter (?room=... or ?project=...)
        const urlParams = new URLSearchParams(window.location.search);
        const targetRoom = urlParams.get('room');
        const targetProject = urlParams.get('project') || urlParams.get('id');

        if (targetRoom) {
          selectRoom(targetRoom, true);
        } else if (targetProject) {
          const foundPin = joinedPins.find(p => p.projects && p.projects.some(pr => pr.id === targetProject));
          if (foundPin) {
            selectRoom(foundPin.roomId, true);
          }
        }
      }

      // Start on DOMContentLoaded
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootstrap);
      } else {
        bootstrap();
      }
    })();
  </script>

  <!-- App Shell Integration -->
  <script type="module" src="app-shell.js"></script>
</body>

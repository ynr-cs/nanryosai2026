<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Super Admin | 南陵祭2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
    <style>
      :root {
        --bg-color: #111827;
        --card-bg: #1f2937;
        --text-main: #f9fafb;
        --text-sub: #9ca3af;
        --accent: #3b82f6;
        --border: #374151;
      }
      body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: "Inter", "Noto Sans JP", sans-serif;
        padding: 20px;
        display: none; /* 初期は隠し、認証OKで表示 */
      }
      .admin-container {
        max-width: 800px;
        margin: 0 auto;
      }
      .card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 24px;
        margin-bottom: 24px;
        color: var(--text-main);
      }
      .form-label {
        font-weight: 600;
        color: var(--text-sub);
      }
      .form-control, .form-select {
        background-color: #374151;
        border: 1px solid #4b5563;
        color: #f9fafb;
      }
      .form-control:focus, .form-select:focus {
        background-color: #374151;
        border-color: var(--accent);
        color: #f9fafb;
        box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25);
      }
      .btn-save {
        width: 100%;
        padding: 12px;
        font-weight: bold;
      }
      .loading-overlay {
        position: fixed;
        inset: 0;
        background: var(--bg-color);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }
    </style>
  </head>
  <body>
    <div class="loading-overlay" id="loading-overlay">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div class="admin-container" id="admin-content">
      <h2 class="mb-4 fw-bold">
        <i class="bi bi-shield-lock-fill text-danger me-2"></i>Super Admin
      </h2>
      <p class="text-sub mb-4">ディレクトリ全体（main/pos）のシステムアラートを一括制御します。</p>

      <div class="card">
        <h4 class="mb-3 border-bottom border-secondary pb-2">Main側アラート (来場者向け)</h4>
        <div class="mb-3 form-check form-switch">
          <input class="form-check-input" type="checkbox" id="main-active" />
          <label class="form-check-label" for="main-active">アラートを表示する</label>
        </div>
        <div class="mb-3">
          <label class="form-label">種別 (Color)</label>
          <select class="form-select" id="main-type">
            <option value="error">Error (Red)</option>
            <option value="warning">Warning (Yellow)</option>
            <option value="info">Info (Blue)</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">メッセージ内容</label>
          <textarea class="form-control" id="main-message" rows="3" placeholder="現在エラーが起きています。修正中です。"></textarea>
        </div>
      </div>

      <div class="card">
        <h4 class="mb-3 border-bottom border-secondary pb-2">POS側アラート (店舗スタッフ向け)</h4>
        <div class="mb-3 form-check form-switch">
          <input class="form-check-input" type="checkbox" id="pos-active" />
          <label class="form-check-label" for="pos-active">アラートを表示する</label>
        </div>
        <div class="mb-3">
          <label class="form-label">種別 (Color)</label>
          <select class="form-select" id="pos-type">
            <option value="error">Error (Red)</option>
            <option value="warning">Warning (Yellow)</option>
            <option value="info">Info (Blue)</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">メッセージ内容</label>
          <textarea class="form-control" id="pos-message" rows="3" placeholder="全店舗への連絡事項です。"></textarea>
        </div>
      </div>

      <button class="btn btn-primary btn-save" id="btn-save">
        <i class="bi bi-cloud-arrow-up-fill me-2"></i>設定を保存
      </button>
    </div>

    <script type="module">
      import { watchUser, db } from "../auth.js";
      import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

      const ALLOWED_EMAIL = "ynrcs1000@gmail.com";
      const METADATA_DOC = doc(db, "_metadata", "system_alerts");

      // Elements
      const loadingOverlay = document.getElementById("loading-overlay");
      const btnSave = document.getElementById("btn-save");

      // Auth Guard
      watchUser((user) => {
        if (!user || user.email !== ALLOWED_EMAIL) {
          // 未ログイン、または許可されていないメールアドレスの場合は即座に左遷
          window.location.replace("../index.html");
          return;
        }
        // 認証OK
        document.body.style.display = "block";
        loadData();
      });

      async function loadData() {
        try {
          const snap = await getDoc(METADATA_DOC);
          if (snap.exists()) {
            const data = snap.data();
            document.getElementById("main-active").checked = !!data.mainAlertActive;
            document.getElementById("main-type").value = data.mainAlertType || "error";
            document.getElementById("main-message").value = data.mainAlertMessage || "";

            document.getElementById("pos-active").checked = !!data.posAlertActive;
            document.getElementById("pos-type").value = data.posAlertType || "error";
            document.getElementById("pos-message").value = data.posAlertMessage || "";
          }
        } catch (err) {
          console.error("データの読み込みに失敗しました", err);
          alert("データの読み込みに失敗しました。権限を確認してください。");
        } finally {
          loadingOverlay.style.display = "none";
        }
      }

      btnSave.addEventListener("click", async () => {
        btnSave.disabled = true;
        const originalText = btnSave.innerHTML;
        btnSave.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> 保存中...';

        const data = {
          mainAlertActive: document.getElementById("main-active").checked,
          mainAlertType: document.getElementById("main-type").value,
          mainAlertMessage: document.getElementById("main-message").value,
          posAlertActive: document.getElementById("pos-active").checked,
          posAlertType: document.getElementById("pos-type").value,
          posAlertMessage: document.getElementById("pos-message").value,
          updatedAt: new Date().toISOString()
        };

        try {
          await setDoc(METADATA_DOC, data, { merge: true });
          alert("設定を保存しました。");
        } catch (err) {
          console.error("保存エラー:", err);
          alert("保存に失敗しました。");
        } finally {
          btnSave.disabled = false;
          btnSave.innerHTML = originalText;
        }
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="ja">
  <head>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('app-theme');
          if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
          else if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
        } catch (e) {}
      })();
    </script>
    <!-- Prevent Dark Mode Flicker (FOUC) -->
    <style>
      html { background-color: #f0f2f5; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) { background-color: #0f172a; }
      }
      html[data-theme="dark"] { background-color: #0f172a; }
      html[data-theme="light"] { background-color: #f0f2f5; }
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ありがとうございました！ | 南陵祭'26 公式サイト</title>
    <!-- Core Style (Shell) -->
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <style>
      body {
        background-color: var(--bg-color);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-main);
        padding: 24px 16px;
        position: relative;
        overflow-x: hidden;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      /* Ambient Orbs (2026 Theme) */
      .bg-orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(80px);
        pointer-events: none;
        z-index: 0;
        opacity: 0.45;
        animation: floatOrb 10s ease-in-out infinite alternate;
      }

      .bg-orb-1 {
        width: 380px;
        height: 380px;
        background: radial-gradient(circle, rgba(106, 17, 203, 0.45) 0%, rgba(106, 17, 203, 0) 70%);
        top: -80px;
        left: -80px;
      }

      .bg-orb-2 {
        width: 420px;
        height: 420px;
        background: radial-gradient(circle, rgba(37, 117, 252, 0.4) 0%, rgba(37, 117, 252, 0) 70%);
        bottom: -100px;
        right: -80px;
        animation-delay: -5s;
      }

      [data-theme="dark"] .bg-orb-1 {
        background: radial-gradient(circle, rgba(106, 17, 203, 0.6) 0%, rgba(106, 17, 203, 0) 70%);
      }

      [data-theme="dark"] .bg-orb-2 {
        background: radial-gradient(circle, rgba(37, 117, 252, 0.5) 0%, rgba(37, 117, 252, 0) 70%);
      }

      @keyframes floatOrb {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(30px, 25px) scale(1.08); }
      }

      /* Theme Toggle Floating Button */
      .theme-toggle-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        color: var(--text-main);
        font-size: 1.25rem;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 4px 14px var(--shadow-color);
        transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.3s ease, border-color 0.3s ease;
        z-index: 100;
      }

      .theme-toggle-btn:hover {
        transform: scale(1.08);
        border-color: var(--primary-color);
        color: var(--primary-color);
      }

      .theme-toggle-btn:active {
        transform: scale(0.95);
      }

      /* Thank You Card */
      .thank-you-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 24px;
        padding: 44px 32px;
        max-width: 760px;
        width: 100%;
        text-align: center;
        animation: fadeIn 0.8s ease-out;
        box-shadow: 0 15px 50px var(--shadow-color);
        position: relative;
        z-index: 1;
        transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      }

      /* Status Badge */
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(106, 17, 203, 0.08);
        border: 1px solid rgba(106, 17, 203, 0.25);
        color: var(--primary-color);
        padding: 6px 16px;
        border-radius: 50px;
        font-size: 0.84rem;
        font-weight: 800;
        margin-bottom: 20px;
        letter-spacing: 0.05em;
        white-space: nowrap;
        transition: all 0.3s ease;
      }

      [data-theme="dark"] .status-pill {
        background: rgba(167, 139, 250, 0.15);
        border-color: rgba(167, 139, 250, 0.35);
        color: #c4b5fd;
      }

      .thank-you-card h1 {
        font-size: clamp(1.65rem, 5vw, 2.35rem);
        font-weight: 900;
        background: var(--primary-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 18px;
        line-height: 1.35;
        letter-spacing: -0.01em;
      }

      .thank-you-card .lead-text {
        font-size: 1.02rem;
        line-height: 1.85;
        color: var(--text-main);
        margin-bottom: 32px;
      }

      /* CTA Buttons */
      .cta-container {
        display: flex;
        flex-direction: column;
        gap: 16px;
        max-width: 440px;
        margin: 0 auto 32px;
      }

      .cta-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 16px 24px;
        border-radius: 50px;
        text-decoration: none;
        font-weight: 800;
        font-size: 1rem;
        white-space: nowrap;
        transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      }

      .cta-button.cs {
        background: var(--primary-gradient);
        color: #ffffff;
      }

      .cta-button.vote {
        background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        color: #ffffff;
      }

      .cta-button:hover {
        transform: translateY(-4px);
        box-shadow: 0 14px 36px rgba(0, 0, 0, 0.22);
      }

      .cta-button i {
        font-size: 1.2rem;
        flex-shrink: 0;
      }

      .credit {
        font-size: 0.88rem;
        color: var(--text-sub);
        margin-top: 12px;
        letter-spacing: 0.03em;
        font-weight: 600;
        white-space: nowrap;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 600px) {
        .thank-you-card {
          padding: 32px 20px;
          border-radius: 20px;
        }
        .theme-toggle-btn {
          top: 16px;
          right: 16px;
          width: 40px;
          height: 40px;
          font-size: 1.1rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- Background Ambient Glow -->
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>

    <!-- Theme Toggle Button -->
    <button id="theme-toggle" class="theme-toggle-btn" aria-label="テーマ切り替え" title="テーマ切り替え">
      <i class="bi bi-moon-stars-fill"></i>
    </button>

    <!-- Main Card -->
    <div class="thank-you-card">
      <div class="status-pill">
        <i class="bi bi-check-circle-fill"></i>
        <span>全日程終了</span>
      </div>

      <h1>南陵祭'26 Webサイト<br />ご利用ありがとうございました！</h1>

      <p class="lead-text">
        令和8年度 第24回 南陵祭「南陵祭楽しすぎて滅」は、全日程を終了いたしました。<br />
        多くの方に本サイトおよびシステムをご利用いただき、心より感謝申し上げます。<br />
        このサイトが、あなたの文化祭の思い出の1ページになれたなら幸いです。
      </p>

      <div class="cta-container">
        <a
          href="https://docs.google.com/forms/d/e/1FAIpQLSeCqNNdr9NFcosejNj0acvD7MSqFfmgOQIAVad_Ss1YV-Sh9A/viewform?usp=header"
          class="cta-button cs"
          target="_blank"
          rel="noopener noreferrer"
        >
          <i class="bi bi-chat-heart-fill"></i>
          <span>コンピュータ科学部 アンケート</span>
        </a>

        <a
          href="https://docs.google.com/forms/d/e/1FAIpQLSfp5h3ff_OnUV_0zNVLEA7Efbd9Qyy5VYJWBJmWIWnTeZwnmQ/viewform?usp=header"
          class="cta-button vote"
          target="_blank"
          rel="noopener noreferrer"
        >
          <i class="bi bi-trophy-fill"></i>
          <span>生徒会 人気投票</span>
        </a>
      </div>

      <div class="credit">制作・運営：横浜南陵高校 コンピュータ科学部</div>
    </div>

    <!-- Theme Toggle Script -->
    <script>
      (function() {
        const themeBtn = document.getElementById('theme-toggle');
        const themeIcon = themeBtn.querySelector('i');

        function isDarkModeActive() {
          const explicitTheme = document.documentElement.getAttribute('data-theme');
          if (explicitTheme === 'dark') return true;
          if (explicitTheme === 'light') return false;
          return window.matchMedia('(prefers-color-scheme: dark)').matches;
        }

        function updateIcon() {
          if (isDarkModeActive()) {
            themeIcon.className = 'bi bi-sun-fill';
            themeBtn.setAttribute('title', 'ライトモードに切り替え');
          } else {
            themeIcon.className = 'bi bi-moon-stars-fill';
            themeBtn.setAttribute('title', 'ダークモードに切り替え');
          }
        }

        themeBtn.addEventListener('click', function() {
          const currentlyDark = isDarkModeActive();
          const nextTheme = currentlyDark ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', nextTheme);
          localStorage.setItem('app-theme', nextTheme);
          updateIcon();
        });

        // 初期アイコン更新
        updateIcon();
      })();
    </script>
  </body>
</html>

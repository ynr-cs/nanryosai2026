    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-functions-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-analytics-compat.js"></script>

    <script>
      // --- Firebase Config ---
      const firebaseConfig = {
        apiKey: "AIzaSyA-Ijkbo-9rgrNKbDlRJ-rQVYdSXR_a9Do", // ダミーです
        authDomain: "nanryosai-2026-a4091.firebaseapp.com",
        projectId: "nanryosai-2026-a4091",
        storageBucket: "nanryosai-2026-a4091.firebasestorage.app",
        messagingSenderId: "360316480856",
        appId: "1:360316480856:web:1234567890abcdef",
      };

      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      const analytics = firebase.analytics();
      const db = firebase.firestore();
      const auth = firebase.auth();
      const provider = new firebase.auth.GoogleAuthProvider();

      // POSアラート監視 (動的インポート)
      import("./pos-alert.js").then((module) => {
        db.collection("_metadata").doc("system_alerts").onSnapshot((snap) => {
          if (snap.exists) module.renderPosAlert(snap.data());
        });
      }).catch(err => console.error("Failed to load pos-alert module", err));

      let unsubscribe = null;
      const urlParams = new URLSearchParams(window.location.search);
      const storeId = urlParams.get("storeId");

      const ordersContainer = document.getElementById("orders-container");
      const errorMsgEl = document.getElementById("error-message");

      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      function playPingSound() {
        if (audioCtx.state === "suspended") audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(
          0.001,
          audioCtx.currentTime + 0.5,
        );
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      }

      let currentZoom = 1.0;
      function adjustZoom(delta) {
        currentZoom = Math.round((currentZoom + delta) * 10) / 10;
        if (currentZoom < 0.5) currentZoom = 0.5;
        if (currentZoom > 2.0) currentZoom = 2.0;
        document.body.style.zoom = currentZoom;
      }

      function toggleFullScreen() {
        const doc = window.document;
        const docEl = doc.documentElement;
        const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
        const cancelFullScreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;
        if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
          if (requestFullScreen) requestFullScreen.call(docEl);
        } else {
          if (cancelFullScreen) cancelFullScreen.call(doc);
        }
      }

      function showError(html) {
        errorMsgEl.innerHTML = html;
        errorMsgEl.style.display = "block";
      }

      // --- Auth Guard ---
      const ALLOWED_DOMAIN = "@gl.pen-kanagawa.ed.jp";
      const MASTER_ACCOUNTS = ["ynrcs1000@gmail.com"];

      function isAuthorizedUser(user) {
        if (!user || !user.email) return false;
        return user.email.endsWith(ALLOWED_DOMAIN) || MASTER_ACCOUNTS.includes(user.email);
      }

      auth.onAuthStateChanged((user) => {
        const LS_KEY = "nanryosai_store_id";
        const cachedId = localStorage.getItem(LS_KEY);

        if (!user || !isAuthorizedUser(user) || cachedId !== storeId) {
          const currentUrl = encodeURIComponent(window.location.href);
          const storeParam = storeId ? `&s=${storeId}` : '';
          window.location.href = `portal.html?return=${currentUrl}${storeParam}`;
        } else {
          document.getElementById("login-screen").style.display = "none";
          document.getElementById("main-content").style.display = "block";
          // User Name display removed for privacy
          document.getElementById("display-store-id").textContent = storeId;
          startOrderListener();
          startTimerLoop();
        }
      });
      function logout() {
        if (confirm("ログアウトしますか？"))
          auth.signOut().then(() => location.reload());
      }

      // --- Firestore Listener ---
      function startOrderListener() {
        let isInitialLoad = true;

        unsubscribe = db
          .collection("orders")
          .where("storeId", "==", storeId)
          .where("status", "in", ["ready_to_serve", "ready_for_pickup", "abandoned"])
          .orderBy("createdAt", "asc")
          .onSnapshot(
            (snapshot) => {
              snapshot.docChanges().forEach((change) => {
                const data = change.doc.data();
                if (change.type === "added") {
                  removeCard(change.doc.id);
                  renderCardSorted(change.doc);
                  if (!isInitialLoad && data.status === "ready_to_serve") {
                    playPingSound();
                  }
                }
                if (change.type === "modified") {
                  removeCard(change.doc.id);
                  renderCardSorted(change.doc);
                }
                if (change.type === "removed") {
                  removeCard(change.doc.id);
                }
              });
              isInitialLoad = false;
            },
            (error) => {
              console.error("Firestore Error:", error);
              if (error.code === "failed-precondition") {
                showError(
                  `インデックスが必要です。<a href="#" onclick="alert('コンソールを確認してください')">詳細</a>`,
                );
              } else if (error.code === "permission-denied") {
                showError("アクセス権限がありません。");
              }
            },
          );
      }

      function renderCardSorted(doc) {
        const data = doc.data();

        // スタッフがすでに「確認済」として消去したBAN注文は描画しない
        if (data.status === "abandoned") {
          if (localStorage.getItem("dismissed_" + doc.id) === "true") return;

          // 別端末で開いた時用に、破棄から5分以上経過したものは自動非表示にする
          if (data.updatedAt) {
            const diffMin = (Date.now() - data.updatedAt.toDate().getTime()) / 60000;
            if (diffMin > 5) return;
          }
        }

        const createdDate = data.createdAt
          ? data.createdAt.toDate()
          : new Date();
        const createdTimeMs = createdDate.getTime();

        const cardEl = createCardElement(doc, createdDate);

        const children = ordersContainer.children;
        let inserted = false;
        for (let i = 0; i < children.length; i++) {
          const childTime = parseInt(children[i].dataset.createdAt);
          if (createdTimeMs < childTime) {
            ordersContainer.insertBefore(cardEl, children[i]);
            inserted = true;
            break;
          }
        }
        if (!inserted) {
          ordersContainer.appendChild(cardEl);
        }
        updateSingleTimer(cardEl, Date.now());
      }

      function createCardElement(doc, createdDate) {
        const data = doc.data();
        const orderId = doc.id;
        const displayId = data.receiptNumber
          ? `${data.receiptNumber}`
          : `${orderId.slice(-4).toUpperCase()}`;

        // ★ ソース判定ロジック (受付番号範囲で判定)
        let sourceLabel = "POS";
        let sourceClass = "badge-pos";

        if (data.orderChannel === "mobile") {
          sourceLabel = "Mobile";
          sourceClass = "badge-mobile";
        } else if (data.orderChannel === "sok") {
          sourceLabel = "SOK";
          sourceClass = "badge-mobile";
        }

        let itemsHtml = buildItemsHtml(data.items);
        let footerHtml = "";

        // フッター分岐
        if (data.status === "ready_to_serve") {
          footerHtml = `
                <button class="btn-action btn-call" onclick="callForPickup('${orderId}')">
                    呼び出し (準備完了)
                </button>
            `;
        } else if (data.status === "ready_for_pickup") {
          footerHtml = `
                <div class="payment-actions">
                    <button class="btn-full btn-qr" onclick="completeOrder('${orderId}')">受渡完了 (AirPay端末確認)</button>
                </div>
            `;
        } else if (data.status === "abandoned") {
          footerHtml = `
                <div class="payment-actions">
                    <button class="btn-full" style="background-color: #d32f2f; color: white;" onclick="dismissAbandoned('${orderId}')">確認・破棄する (表示から消去)</button>
                </div>
            `;
        }

        const totalPrice = data.totalPrice ? `¥${data.totalPrice.toLocaleString()}` : "¥---";

        const div = document.createElement("div");
        div.className = "order-card";
        div.id = `card-${orderId}`;
        div.dataset.createdAt = createdDate.getTime();
        div.dataset.status = data.status;
        div.dataset.orderChannel = data.orderChannel || "unknown";
        div.dataset.readyAt = data.readyForPickupAt ? data.readyForPickupAt.toDate().getTime() : "";
        div.dataset.updatedAt = data.updatedAt ? data.updatedAt.toDate().getTime() : "";

        // BANアラート用HTML
        let abandonedAlertHtml = "";
        if (data.status === "abandoned") {
            abandonedAlertHtml = `
                <div style="background-color: #ffebee; color: #c62828; padding: 12px; text-align: center; font-weight: 900; border-bottom: 2px solid #ef5350; border-radius: 6px 6px 0 0;">
                    🚨 この注文は破棄されました (BAN)
                </div>
            `;
            div.style.borderColor = "#c62828";
            div.style.borderWidth = "2px";
        }

        div.innerHTML = `
            ${abandonedAlertHtml}
            <div class="card-body">
                <div class="card-header-row">
                    <span class="order-id">${displayId}</span>
                    <div style="flex: 1; display: flex; align-items: center; justify-content: flex-end; padding-right: 12px;">
                        <div id="ban-timer-${orderId}" style="text-align: right; line-height: 1.2;"></div>
                    </div>
                    <div class="header-right-col">
                        <div style="position:relative; text-align:right;">
                            <button class="menu-btn" onclick="toggleMenu('${orderId}', event)">⋮</button>
                            <div id="menu-${orderId}" class="dropdown-menu">
                                <div class="dropdown-item text-warn" onclick="forceComplete('${orderId}')">緊急完了 (手動)</div>
                                <div class="dropdown-item text-danger" onclick="cancelOrder('${orderId}')">提供不可・キャンセル</div>
                            </div>
                        </div>
                        <span class="order-timer" id="timer-${orderId}">00:00</span>
                        <!-- ★ここにバッジを表示 -->
                        <span class="source-badge ${sourceClass}">${sourceLabel}</span>
                    </div>
                </div>
                <div>${itemsHtml}</div>
                <div style="text-align: right; margin-top: 15px; padding-top: 10px; border-top: 1px dashed #ddd; font-size: 1.2rem; font-weight: 900; color: #111;">
                    合計: <span style="color: #d32f2f;">${totalPrice}</span>
                </div>
            </div>
            <div class="card-footer">
                ${footerHtml}
            </div>
        `;
        return div;
      }

      function buildItemsHtml(items) {
        if (!items || !Array.isArray(items)) return "";

        return items
          .map((item) => {
            let customizationHtml = "";
            if (item.customizations && item.customizations.length > 0) {
              const rows = item.customizations
                .map((c) => {
                  let mode = "",
                    target = c;
                  if (typeof c === "object") {
                    mode = c.mode || "";
                    target = c.target || c.name || "";
                  }

                  let badgeClass = "bg-gray";
                  let textClass = "cust-text";
                  let displayMode = mode || "OPT";

                  if (mode === "ADD") {
                    badgeClass = "bg-green";
                  } else if (mode === "NO" || mode === "REMOVE") {
                    badgeClass = "bg-red";
                    displayMode = "NO";
                    textClass += " text-alert";
                  }

                  return `<div class="customization-row">
                            <span class="cust-badge ${badgeClass}">${displayMode}</span>
                            <span class="${textClass}">${target}</span>
                          </div>`;
                })
                .join("");
              customizationHtml = `<div class="item-customizations">${rows}</div>`;
            }
            return `
                <div class="item-row">
                    <div class="item-main">
                        <div class="item-qty">${item.quantity}</div>
                        <div class="item-name">${item.name}</div>
                    </div>
                    ${customizationHtml}
                </div>`;
          })
          .join("");
      }

      function removeCard(id) {
        const el = document.getElementById(`card-${id}`);
        if (el) el.remove();
      }

      function startTimerLoop() {
        setInterval(() => {
          const now = Date.now();
          document
            .querySelectorAll(".order-card")
            .forEach((c) => updateSingleTimer(c, now));
        }, 1000);
      }

      function updateSingleTimer(cardEl, now) {
        // メインのタイマー（注文からの経過時間）はBAN後も表示を維持する
        const createdAt = parseInt(cardEl.dataset.createdAt);
        if (createdAt) {
            const diffSeconds = Math.floor((now - createdAt) / 1000);
            const mm = String(Math.floor(diffSeconds / 60)).padStart(2, "0");
            const ss = String(diffSeconds % 60).padStart(2, "0");
            const timerSpan = cardEl.querySelector(".order-timer");
            if (timerSpan) {
              timerSpan.textContent = `${mm}:${ss}`;
              if (diffSeconds > 900) timerSpan.classList.add("timer-alert");
              else timerSpan.classList.remove("timer-alert");
            }
        }

        const banSpan = cardEl.querySelector(`#ban-timer-${cardEl.id.replace('card-', '')}`);
        if (!banSpan) return;

        // モバイルオーダー以外はBANタイマーを表示しない
        if (cardEl.dataset.orderChannel !== "mobile") {
            banSpan.innerHTML = "";
            return;
        }

        if (cardEl.dataset.status === "abandoned") {
            // BANからは何分経過したかを表示
            const abandonedAt = parseInt(cardEl.dataset.updatedAt);
            if (abandonedAt) {
                const diffSeconds = Math.max(0, Math.floor((now - abandonedAt) / 1000));
                const rm = String(Math.floor(diffSeconds / 60)).padStart(2, '0');
                const rs = String(diffSeconds % 60).padStart(2, '0');
                banSpan.innerHTML = `<div style="font-size: 0.8rem; font-weight: 800; color: #d32f2f;">BANから</div><div style="font-size: 1.2rem; font-weight: 900; color: #d32f2f;">${rm}:${rs}</div>`;
            } else {
                banSpan.innerHTML = `<span style="font-size: 1.2rem; font-weight: 900; color: #d32f2f;">破棄済</span>`;
            }
            return;
        }

        // BANタイマーの更新
        if (cardEl.dataset.status === "ready_for_pickup") {
            const readyAt = parseInt(cardEl.dataset.readyAt);
            if (readyAt) {
                const deadline = readyAt + 5 * 60 * 1000;
                const remainDiff = Math.max(0, Math.floor((deadline - now) / 1000));
                if (banSpan) {
                    if (remainDiff <= 0) {
                        banSpan.innerHTML = `<span style="font-size: 1rem; font-weight: 900; color: #d32f2f;">BAN実行中...</span>`;
                    } else {
                        const rm = String(Math.floor(remainDiff / 60)).padStart(2, '0');
                        const rs = String(remainDiff % 60).padStart(2, '0');
                        banSpan.innerHTML = `<div style="font-size: 0.8rem; font-weight: 800; color: #d32f2f;">BANまで</div><div style="font-size: 1.2rem; font-weight: 900; color: #d32f2f;">${rm}:${rs}</div>`;
                    }
                }
            }
        } else {
            if (banSpan) banSpan.innerHTML = "";
        }
      }

      function setLoading(orderId, text) {
        const menu = document.getElementById(`menu-${orderId}`);
        if(menu) menu.classList.remove('show');
        
        const card = document.getElementById(`card-${orderId}`);
        if (!card) return;
        const mainBtn = card.querySelector('.card-footer button');
        if (mainBtn) {
          mainBtn.disabled = true;
          mainBtn.classList.add('btn-loading');
          mainBtn.innerHTML = `<div class="spinner"></div>${text || "処理中..."}`;
        }
      }

      window.dismissAbandoned = function(orderId) {
        // バックエンド（関数）は動かさず、ローカルの画面上からのみ非表示にする
        localStorage.setItem("dismissed_" + orderId, "true");
        removeCard(orderId);
      };

      window.callForPickup = function (orderId) {
        setLoading(orderId, "呼出処理中...");
        const callFn = firebase.app().functions("asia-northeast1").httpsCallable("callForPickup");
        callFn({ orderId }).catch(e => {
          alert("呼出失敗: " + e.message + "\n画面を再読み込みします。");
          location.reload();
        });
      };

      window.completeOrder = function (orderId) {
        setLoading(orderId, "完了処理中...");
        const completeFn = firebase.app().functions("asia-northeast1").httpsCallable("completeOrder");
        completeFn({ orderId }).catch(e => {
          alert("完了失敗: " + e.message + "\n画面を再読み込みします。");
          location.reload();
        });
      };

      window.forceComplete = function (orderId) {
        if (!confirm("【緊急完了】\n強制的に完了済みに変更します。")) return;
        setLoading(orderId, "緊急完了処理中...");
        const adminUpdate = firebase.app().functions("asia-northeast1").httpsCallable("adminUpdateOrderStatus");
        adminUpdate({ orderId, newStatus: "completed" }).catch(e => {
          alert("緊急完了失敗: " + e.message + "\n画面を再読み込みします。");
          location.reload();
        });
      };

      window.cancelOrder = function (orderId) {
        const reason = prompt("【キャンセル】\n提供不可としてキャンセルしますか？\n理由を入力してください:");
        if (reason === null) return; // promptでキャンセルを押した場合は終了
        if (reason.trim() === "") {
          alert("キャンセル理由は必須です。理由を入力してください。");
          return;
        }
        setLoading(orderId, "キャンセル処理中...");
        const cancelFn = firebase.app().functions("asia-northeast1").httpsCallable("cancelOrder");
        cancelFn({ orderId, reason }).catch(e => {
          alert("キャンセル失敗: " + e.message + "\n画面を再読み込みします。");
          location.reload();
        });
      };

      window.toggleMenu = function (orderId, event) {
        event.stopPropagation();
        document.querySelectorAll(".dropdown-menu").forEach((el) => {
          if (el.id !== `menu-${orderId}`) el.classList.remove("show");
        });
        const menu = document.getElementById(`menu-${orderId}`);
        if (menu) menu.classList.toggle("show");
      };

      window.onclick = function (event) {
        if (!event.target.matches(".menu-btn")) {
          document
            .querySelectorAll(".dropdown-menu")
            .forEach((el) => el.classList.remove("show"));
        }
      };

      document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('store-password-input').addEventListener('input', function(e) {
          this.value = this.value.replace(/[０-９A-Za-z]/g, function(s) {
            return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
          }).replace(/[^0-9A-Za-z]/g, '');
        });

        document.getElementById('toggle-store-pass').addEventListener('click', function() {
          const input = document.getElementById('store-password-input');
          if (input.type === 'password') {
            input.type = 'text';
            this.textContent = '🙈';
          } else {
            input.type = 'password';
            this.textContent = '👁️';
          }
        });
      });
    </script>
  </body>
</html>
